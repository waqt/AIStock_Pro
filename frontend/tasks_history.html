<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>执行历史审计 - AIStock Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #007bff; --bg: #f4f7f6; --text: #2f3542; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 40px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 24px; color: #1e2124; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 24px; margin-bottom: 20px; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #f1f1f1; color: #747d8c; font-size: 13px; }
        td { padding: 14px 12px; border-bottom: 1px solid #f1f1f1; font-size: 13px; }
        .status-tag { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .SUCCESS { background: #e3f9eb; color: #2ed573; }
        .FAILED { background: #ffebee; color: #ff4757; }
        .CANCELLED { background: #f1f2f6; color: #747d8c; }
        .btn { padding: 6px 12px; border-radius: 6px; cursor: pointer; border: none; font-size: 13px; transition: 0.2s; }
        .btn-danger { background: #ff4757; color: white; }
        .btn-outline { background: white; border: 1px solid #dfe4ea; color: #2f3542; }
        .nav-link { color: var(--primary); text-decoration: none; font-size: 14px; }
        /* 弹窗样式 */
        #detail-modal { 
            display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 600px; background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); 
            z-index: 10000; padding: 24px; 
        }
        .modal-overlay { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 9999; }
        pre { background: #f8f9fa; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📜 任务执行历史审计</h1>
            <div>
                <a href="/data.html" class="nav-link">返回看板</a> | 
                <a href="/tasks_registry.html" class="nav-link">定义管理</a>
            </div>
        </div>

        <div class="card">
            <div class="toolbar">
                <button class="btn btn-outline" onclick="clearHistory(7)">清理 7 天前记录</button>
                <button class="btn btn-danger" id="bulk-delete" style="display:none;" onclick="bulkDelete()">批量删除</button>
                <div style="flex-grow: 1;"></div>
                <button class="btn btn-outline" onclick="loadHistory()">刷新 <i class="fas fa-sync"></i></button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="select-all"></th>
                        <th>启动时间</th>
                        <th>任务类型</th>
                        <th>状态</th>
                        <th>耗时</th>
                        <th>执行结论</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="history-list">
                    <!-- 动态加载 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="overlay"></div>
    <div id="detail-modal">
        <h3 id="modal-title">任务详情</h3>
        <hr>
        <p><strong>启动参数 (Params):</strong></p>
        <pre id="modal-params"></pre>
        <p><strong>执行结论 (Result):</strong></p>
        <pre id="modal-result"></pre>
        <div style="text-align: right; margin-top: 20px;">
            <button class="btn btn-primary" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <script>
        let allHistory = [];

        async function loadHistory() {
            const res = await fetch('/api/system/tasks/history');
            allHistory = await res.json();
            const list = document.getElementById('history-list');
            list.innerHTML = allHistory.map(h => `
                <tr>
                    <td><input type="checkbox" class="record-check" value="${h.id}"></td>
                    <td>${new Date(h.start_time).toLocaleString()}</td>
                    <td><span style="font-family:monospace">${h.task_code}</span></td>
                    <td><span class="status-tag ${h.status}">${h.status}</span></td>
                    <td>${h.end_time ? ((new Date(h.end_time) - new Date(h.start_time))/1000).toFixed(1) + 's' : '-'}</td>
                    <td style="max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                        ${h.result_msg || '-'}
                    </td>
                    <td>
                        <button class="btn btn-outline" onclick="showDetail('${h.id}')">详情</button>
                    </td>
                </tr>
            `).join('');
            
            // 绑定勾选逻辑
            const checks = document.querySelectorAll('.record-check');
            checks.forEach(c => c.onchange = updateBulkBtn);
        }

        function showDetail(id) {
            const h = allHistory.find(item => item.id === id);
            if (!h) return;
            document.getElementById('modal-title').innerText = `任务详情: ${h.task_code}`;
            document.getElementById('modal-params').innerText = JSON.stringify(h.params, null, 2);
            document.getElementById('modal-result').innerText = h.result_msg || '无结论';
            document.getElementById('detail-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('detail-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        function updateBulkBtn() {
            const checkedCount = document.querySelectorAll('.record-check:checked').length;
            document.getElementById('bulk-delete').style.display = checkedCount > 0 ? 'inline-block' : 'none';
        }

        async function clearHistory(days) {
            if (!confirm(`确定要永久删除 ${days} 天前的所有历史记录吗？`)) return;
            const res = await fetch(`/api/system/tasks/history?days_ago=${days}`, { method: 'DELETE' });
            if (res.ok) loadHistory();
        }

        async function bulkDelete() {
            const ids = Array.from(document.querySelectorAll('.record-check:checked')).map(c => c.value);
            if (!confirm(`确定要删除选中的 ${ids.length} 条记录吗？`)) return;
            const res = await fetch(`/api/system/tasks/history?${ids.map(id => 'ids=' + id).join('&')}`, { method: 'DELETE' });
            if (res.ok) loadHistory();
        }

        document.getElementById('select-all').onchange = (e) => {
            document.querySelectorAll('.record-check').forEach(c => c.checked = e.target.checked);
            updateBulkBtn();
        };

        loadHistory();
    </script>
</body>
</html>
