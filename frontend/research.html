<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIStock | AI 投研</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .research-input { display: flex; gap: 10px; margin-bottom: 16px; }
        .research-input input { flex: 1; background: #000; border: 1px solid var(--border-color); color: #fff; padding: 10px 14px; border-radius: 4px; font-size: 13px; }
        .step-progress { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .step-badge { padding: 4px 10px; border-radius: 3px; font-size: 10px; background: var(--border-color); color: var(--text-micro); }
        .step-badge.active { background: var(--accent-blue); color: #000; }
        .step-badge.done { background: rgba(46,213,115,0.15); color: var(--accent-green); }
        .result-block { margin-bottom: 16px; }
        .result-block pre { font-size: 11px; line-height: 1.6; white-space: pre-wrap; color: var(--text-dim); max-height: 300px; overflow-y: auto; }
        .score-badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-weight: 700; }
        .score-high { background: rgba(46,213,115,0.15); color: var(--accent-green); }
        .summary-box { background: rgba(255,255,255,0.03); border: 1px solid var(--accent-gold); padding: 16px; border-radius: 6px; font-size: 13px; line-height: 1.8; }
        .summary-box h2,.summary-box h3 { color: var(--accent-gold); font-size: 14px; margin: 12px 0 6px; }
        .summary-box table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 11px; }
        .summary-box th { text-align: left; color: var(--text-micro); padding: 4px 8px; border-bottom: 1px solid var(--border-thin); }
        .summary-box td { padding: 4px 8px; color: var(--text-dim); border-bottom: 1px solid var(--border-thin); }
        .chain-layer { background: rgba(255,255,255,0.02); border: 1px solid var(--border-thin); border-radius: 4px; padding: 12px; margin-bottom: 8px; }
        .chain-layer .tier-badge { display: inline-block; padding: 1px 6px; border-radius: 2px; font-size: 10px; }
        .tier-up { background: rgba(112,161,255,0.15); color: var(--accent-blue); }
        .tier-mid { background: rgba(255,165,2,0.15); color: var(--accent-gold); }
        .tier-down { background: rgba(46,213,115,0.15); color: var(--accent-green); }
    </style>
</head>
<body data-page-id="research">
    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="top-bar"></div>

            <div class="workspace" style="grid-template-columns: 380px 1fr; gap: 16px; padding: 16px;">

                <!-- 左: 查询 + 步骤进度 -->
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <!-- 每日扫描 -->
                    <div class="panel" style="border-left: 3px solid var(--accent-gold);">
                        <div class="panel-header"><span class="panel-title">每日市场扫描</span></div>
                        <div class="panel-body" style="text-align:center;">
                            <div style="font-size:11px;color:var(--text-dim);margin-bottom:10px;">AI 自动扫宏观+资金流+持仓, 发现今日最热赛道</div>
                            <button class="btn-action" onclick="startScan()" id="btn-scan" style="width:100%;justify-content:center;border-color:var(--accent-gold);color:var(--accent-gold);font-size:14px;padding:12px;">
                                <i class="fas fa-satellite"></i> 开始扫描
                            </button>
                            <div id="scan-status" style="font-size:10px;color:var(--text-micro);margin-top:6px;"></div>
                        </div>
                    </div>

                    <!-- 扫描结果: 赛道卡片 -->
                    <div class="panel" id="panel-scan-result" style="display:none;">
                        <div class="panel-header"><span class="panel-title">热门赛道</span></div>
                        <div class="panel-body" id="content-scan-industries"></div>
                    </div>

                    <div class="panel">
                        <div class="panel-header"><span class="panel-title">深度供应链分析</span></div>
                        <div class="panel-body">
                            <div class="research-input">
                                <input type="text" id="research-industry" placeholder="行业或主题 (如: AI算力, 新能源...)" value="AI算力">
                            </div>
                            <div class="research-input">
                                <input type="text" id="research-codes" placeholder="A股代码 (逗号分隔)" value="">
                            </div>
                            <button class="btn-action btn-primary" onclick="startResearch()" id="btn-research" style="width:100%; justify-content:center;">
                                <i class="fas fa-brain"></i> 供应链下钻
                            </button>
                            <div style="font-size: 10px; color: var(--text-micro); margin-top: 8px;">
                                5步: 景气信号→供应链图谱→供需瓶颈→核心标的→估值
                            </div>
                        </div>
                    </div>

                    <!-- 步骤进度 -->
                    <div class="panel">
                        <div class="panel-header"><span class="panel-title">分析进度</span></div>
                        <div class="panel-body">
                            <div class="step-progress" id="step-progress">
                                <span class="step-badge">1 景气信号</span>
                                <span class="step-badge">2 供应链</span>
                                <span class="step-badge">3 瓶颈定位</span>
                                <span class="step-badge">4 标的锁定</span>
                                <span class="step-badge">5 估值</span>
                            </div>
                            <div id="step-status" style="font-size:11px;color:var(--text-dim);">等待查询...</div>
                        </div>
                    </div>

                    <!-- 景气评分 -->
                    <div class="panel">
                        <div class="panel-header"><span class="panel-title">景气度评分</span></div>
                        <div class="panel-body" style="text-align:center;">
                            <div id="prosperity-score" style="font-size:48px;font-weight:800;color:var(--text-micro);">—</div>
                            <div id="hot-segments" style="font-size:10px;color:var(--text-dim);margin-top:8px;"></div>
                        </div>
                    </div>
                </div>

                <!-- 右: 结果展示 -->
                <div style="display: flex; flex-direction: column; gap: 16px;">
                    <!-- Summary -->
                    <div class="panel" id="panel-summary" style="display:none;">
                        <div class="panel-header"><span class="panel-title">CIO 投资建议</span></div>
                        <div class="panel-body">
                            <div class="summary-box" id="content-summary"></div>
                        </div>
                    </div>

                    <!-- 供应链 -->
                    <div class="panel" id="panel-chain" style="display:none;">
                        <div class="panel-header"><span class="panel-title">供应链图谱</span></div>
                        <div class="panel-body" id="content-chain"></div>
                    </div>

                    <!-- 瓶颈 -->
                    <div class="panel" id="panel-bottleneck" style="display:none;">
                        <div class="panel-header"><span class="panel-title">瓶颈环节 + 核心标的</span></div>
                        <div class="panel-body" id="content-bottleneck"></div>
                    </div>

                    <!-- 时间维度 -->
                    <div class="panel" id="panel-temporal" style="display:none;">
                        <div class="panel-header"><span class="panel-title">景气周期预测 (时间维度)</span></div>
                        <div class="panel-body" id="content-temporal"></div>
                    </div>

                    <!-- 估值 -->
                    <div class="panel" id="panel-valuation" style="display:none;">
                        <div class="panel-header"><span class="panel-title">估值分析</span></div>
                        <div class="panel-body" id="content-valuation"></div>
                    </div>

                    <!-- 加载中 -->
                    <div class="panel" id="panel-loading" style="display:none;">
                        <div class="panel-body" style="text-align:center;padding:40px;">
                            <i class="fas fa-spinner fa-spin fa-2x" style="color:var(--accent-blue);margin-bottom:12px;"></i>
                            <div style="color:var(--text-dim);font-size:12px;">AI 正在深度分析供应链...<br><small id="loading-step" style="color:var(--text-micro);">这可能需要 60-90 秒</small></div>
                        </div>
                    </div>

                    <!-- 空状态 -->
                    <div class="panel" id="panel-empty">
                        <div class="panel-body" style="text-align:center;padding:60px;">
                            <div style="font-size:40px;margin-bottom:12px;opacity:0.3;">&#129504;</div>
                            <div style="color:var(--text-dim);font-size:12px;">
                                输入行业关键词, AI 将从全球供应链视角分析:<br>
                                高景气信号 → 供应链结构 → 供需瓶颈 → 垄断标的 → 估值潜力
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/framework/api.js"></script>
    <script src="js/framework/modal.js"></script>
    <script src="js/framework/task_monitor.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/common.js"></script>
    <script>
        const STEPS = ['景气信号','供应链','瓶颈定位','标的锁定','估值分析'];

        function setStep(idx, status) {
            const badges = document.querySelectorAll('#step-progress .step-badge');
            for (let i = 0; i < badges.length; i++) {
                badges[i].classList.remove('active', 'done');
                if (i < idx - 1) badges[i].classList.add('done');
                else if (i === idx - 1) badges[i].classList.add('active');
            }
            document.getElementById('step-status').textContent = status || `步骤 ${idx}: ${STEPS[idx-1]}...`;
        }

        // ── 每日扫描 ──
        async function startScan() {
            const btn = document.getElementById('btn-scan');
            const status = document.getElementById('scan-status');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 扫描中...';
            status.textContent = '正在收集市场信号...';

            try {
                const res = await fetch(`${API_BASE}/research/scan`, {
                    method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}'
                });
                const result = await res.json();
                if (!result.success) { Modal.alert('扫描失败', result.detail || ''); return; }
                const d = result.data;

                // 赛道卡片
                const industries = d.hot_industries || [];
                const panel = document.getElementById('panel-scan-result');
                const content = document.getElementById('content-scan-industries');
                panel.style.display = '';
                if (Array.isArray(industries) && industries.length) {
                    content.innerHTML = industries.map((ind, idx) => `
                        <div style="padding:10px;border-bottom:1px solid var(--border-thin);${idx===0?'border-left:3px solid var(--accent-gold);padding-left:8px;':''}">
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <span style="font-weight:600;">${idx+1}. ${ind.name || ind.industry || ''}</span>
                                <span class="score-badge score-high">${ind.score || '?'}/10</span>
                            </div>
                            <div style="font-size:11px;color:var(--text-dim);margin-top:4px;">${ind.reason || ''}</div>
                            ${ind.a_stock_codes ? `<div style="font-size:10px;color:var(--accent-blue);margin-top:4px;">关注: ${ind.a_stock_codes.join(', ')}</div>` : ''}
                        </div>
                    `).join('');
                } else {
                    content.innerHTML = '<div style="color:var(--text-micro);padding:12px;">扫描未识别到热门赛道, 请稍后重试</div>';
                }

                // 简报
                if (d.briefing) {
                    document.getElementById('panel-summary').style.display = '';
                    document.getElementById('content-summary').innerHTML = d.briefing
                        .replace(/### (.+)/g, '<h3>$1</h3>')
                        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\n/g, '<br>')
                        .replace(/\|(.+)\|/g, (m) => m.includes('---') ? '' : '<tr>'+m.split('|').filter(c=>c.trim()).map(c=>`<td>${c.trim()}</td>`).join('')+'</tr>');
                }

                status.textContent = '扫描完成';
                document.getElementById('panel-empty').style.display = 'none';
            } catch (e) {
                status.textContent = '扫描异常: ' + e.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-satellite"></i> 开始扫描';
            }
        }

        async function startResearch() {
            const industry = document.getElementById('research-industry').value.trim();
            if (!industry) { Modal.alert('提示', '请输入行业或主题'); return; }

            const codes = document.getElementById('research-codes').value.split(',').map(s => s.trim()).filter(Boolean);
            const btn = document.getElementById('btn-research');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 分析中...';

            // 隐藏空状态
            document.getElementById('panel-empty').style.display = 'none';
            document.getElementById('panel-loading').style.display = '';
            ['panel-summary','panel-chain','panel-bottleneck','panel-valuation'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });

            try {
                setStep(1, '正在识别全球高景气信号...');
                const res = await fetch(`${API_BASE}/research/supply-chain`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: industry, stock_codes: codes, industry, include_portfolio: true })
                });
                const result = await res.json();
                if (!result.success) { Modal.alert('分析失败', result.detail || JSON.stringify(result)); return; }

                const d = result.data;
                const steps = d.steps || [];

                // 渲染步骤进度
                for (let i = 0; i < steps.length; i++) {
                    setStep(i + 1, steps[i].name);
                }
                setStep(6, '分析完成');
                document.getElementById('loading-step').textContent = '分析完成';

                // Step 1: 景气度
                const p = d.prosperity_signals || {};
                if (p.prosperity_score && document.getElementById('prosperity-score')) {
                    document.getElementById('prosperity-score').textContent = p.prosperity_score + '/10';
                    document.getElementById('prosperity-score').style.color = p.prosperity_score >= 7 ? 'var(--accent-green)' : (p.prosperity_score >= 4 ? 'var(--accent-gold)' : 'var(--accent-red)');
                }
                if (p.hot_segments) {
                    document.getElementById('hot-segments').innerHTML = p.hot_segments.map(s => `<span style="margin:2px;">#${s}</span>`).join(' ');
                }

                // Summary
                if (d.summary) {
                    document.getElementById('panel-summary').style.display = '';
                    document.getElementById('content-summary').innerHTML = d.summary.replace(/\n/g, '<br>').replace(/##\s*(.+)/g, '<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\|(.+)\|/g, (m) => { if (m.includes('---')) return ''; const cells = m.split('|').filter(c => c.trim()); return '<tr>' + cells.map(c => `<td>${c.trim()}</td>`).join('') + '</tr>'; });
                }

                // Chain (recursive layers)
                const chain = d.supply_chain || {};
                const layers = chain.recursive_layers || chain.layers || [];
                if (layers.length || chain.raw_text) {
                    document.getElementById('panel-chain').style.display = '';
                    if (layers.length) {
                        const gapColors = {10:'var(--accent-red)',9:'var(--accent-red)',8:'var(--accent-gold)',7:'var(--accent-gold)',6:'var(--accent-blue)'};
                        document.getElementById('content-chain').innerHTML = layers.map(l => {
                            const gapScore = l.expectation_gap_score || 0;
                            const gapColor = gapColors[gapScore] || 'var(--text-dim)';
                            const levelBadge = `<span style="display:inline-block;padding:1px 6px;border-radius:2px;font-size:9px;background:rgba(255,165,2,0.15);color:var(--accent-gold);">L${l.level || '?'}</span>`;
                            return `
                            <div class="chain-layer" style="${gapScore >= 8 ? 'border-left:3px solid var(--accent-red);' : ''}">
                                <div style="display:flex;justify-content:space-between;align-items:center;">
                                    <span>${levelBadge} <strong style="margin-left:4px;">${l.name || ''}</strong></span>
                                    ${gapScore > 0 ? `<span class="score-badge" style="color:${gapColor};background:rgba(255,165,2,0.1);font-size:10px;">预期差 ${gapScore}/10</span>` : ''}
                                </div>
                                <div style="font-size:10px;color:var(--text-dim);margin-top:4px;">${l.barriers || ''}</div>
                                ${l.gap_reason ? `<div style="font-size:10px;color:var(--accent-gold);margin-top:2px;">💡 ${l.gap_reason}</div>` : ''}
                                <div style="font-size:9px;color:var(--text-micro);margin-top:2px;">${l.supply_status || ''} | 扩产${l.expansion_months || '?'}月 | ${l.concentration || ''}</div>
                                ${l.a_share_peers && l.a_share_peers.length ? `<div style="font-size:9px;color:var(--accent-blue);margin-top:2px;">A股: ${l.a_share_peers.map(p=>p.name||p.code).join(', ')}</div>` : ''}
                            </div>`;
                        }).join('');
                    } else {
                        document.getElementById('content-chain').innerHTML = `<pre>${chain.raw_text || '供应链映射未成功解析'}</pre>`;
                    }
                }

                // Bottleneck
                const bn = d.bottleneck || {};
                const bnList = Array.isArray(bn) ? bn : (bn.raw_text ? [{raw: bn.raw_text}] : []);
                if (bnList.length) {
                    document.getElementById('panel-bottleneck').style.display = '';
                    document.getElementById('content-bottleneck').innerHTML = bnList.map(b => b.raw
                        ? `<pre>${b.raw}</pre>`
                        : `<div style="font-size:12px;padding:8px;border-bottom:1px solid var(--border-thin);">
                            <strong>${b.segment || ''}</strong> <span class="score-badge score-high">垄断评分 ${b.monopoly_score || '?'}/10</span>
                            <div style="color:var(--text-dim);margin-top:4px;">${b.monopoly_root || ''}</div>
                            <div style="color:var(--text-micro);font-size:10px;margin-top:4px;">${b.supply_gap || ''} | ${b.pricing_power || ''}</div>
                        </div>`).join('');
                }

                // Temporal
                const tmp = d.temporal || {};
                const tmpList = Array.isArray(tmp) ? tmp : (tmp.raw_text ? [{raw: tmp.raw_text}] : []);
                if (tmpList.length && tmpList[0].segment) {
                    document.getElementById('panel-temporal').style.display = '';
                    document.getElementById('content-temporal').innerHTML = `
                        <div style="overflow-x:auto;">
                        <table style="width:100%;font-size:10px;">
                        <tr style="color:var(--text-micro);">
                            <th>环节</th><th>需求增速</th><th>产能利用</th><th>供需缺口</th>
                            <th>缺口填补</th><th>产能过剩</th><th>景气评分</th><th>热度</th>
                        </tr>
                        ${tmpList.map(t => `
                        <tr>
                            <td style="font-weight:600;">${t.segment||''}</td>
                            <td>${t.demand_growth||'?'}</td>
                            <td>${t.capacity_util||'?'}</td>
                            <td style="color:var(--accent-red);">${t.supply_gap||'?'}</td>
                            <td>${t.gap_filled||'?'}</td>
                            <td style="color:${(t.overcapacity_risk||'').includes('202')?'var(--accent-gold)':'var(--text-dim)'};">${t.overcapacity_risk||'暂无'}</td>
                            <td><span class="score-badge score-high">${t.sustainability_score||'?'}/10</span></td>
                            <td style="color:${t.heat_level==='过热'?'var(--accent-red)':(t.heat_level==='偏热'?'var(--accent-gold)':'var(--accent-green)')};">${t.heat_level||'?'}</td>
                        </tr>
                        ${t.heat_reason ? `<tr><td colspan="8" style="font-size:9px;color:var(--text-micro);">${t.heat_reason}</td></tr>` : ''}
                        `).join('')}
                        </table></div>`;
                }

                // Valuation
                const val = d.valuation || {};
                if (val.note) {
                    document.getElementById('panel-valuation').style.display = '';
                    document.getElementById('content-valuation').innerHTML = `<pre>${val.note}</pre>`;
                }

            } catch (e) {
                Modal.alert('分析异常', e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-brain"></i> 启动供应链分析';
                document.getElementById('panel-loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
