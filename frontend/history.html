<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AIStock | 交易审计</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand-area"><div class="brand-title">AI STOCK</div></div>
            <div class="nav-item" onclick="location.href='index.html'"><i class="fas fa-terminal"></i><span>指挥部概览</span></div>
            <div class="nav-item" onclick="location.href='positions.html'"><i class="fas fa-search-dollar"></i><span>持仓管理</span></div>
            <div class="nav-item" onclick="location.href='suggestions.html'"><i class="fas fa-exchange-alt"></i><span>调仓建议</span></div>
            <div class="nav-item" onclick="location.href='research.html'"><i class="fas fa-brain"></i><span>AI 投研</span></div>
            <div class="nav-item active" onclick="location.href='history.html'"><i class="fas fa-history"></i><span>交易审计</span></div>
            <div class="nav-item" onclick="location.href='data.html'"><i class="fas fa-server"></i><span>数据中心</span></div>
            <div class="nav-item" onclick="location.href='import.html'"><i class="fas fa-file-import"></i><span>智能导入</span></div>
            <div style="margin-top: auto;"><div class="nav-item"><i class="fas fa-cog"></i><span>系统设置</span></div></div>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <div class="status-item"><span class="status-label">已审计成交记录:</span> <span class="status-value" id="history-count">0</span></div>
            </div>

            <div class="workspace" style="grid-template-columns: 1fr;">
                <div class="panel">
                    <div class="panel-header"><span class="panel-title">历史交易记录 (Audit Trail)</span></div>
                    <div class="panel-body">
                        <table>
                            <thead>
                                <tr>
                                    <th>交易时间</th>
                                    <th>标的</th>
                                    <th>操作</th>
                                    <th style="text-align: right;">成交价</th>
                                    <th style="text-align: right;">成交数量</th>
                                    <th style="text-align: right;">成交总额</th>
                                    <th>策略标记</th>
                                </tr>
                            </thead>
                            <tbody id="history-list"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>
        const API_BASE = '/api';
        async function loadHistory() {
            const res = await fetch(`${API_BASE}/positions/transactions/`);
            const data = await res.json();
            document.getElementById('history-count').textContent = data.length;
            const list = document.getElementById('history-list');
            list.innerHTML = data.map(t => `
                <tr>
                    <td style="color: var(--text-micro); font-size: 11px;">${t.trade_date}</td>
                    <td class="ticker">${t.stock_name}<br><small style="color:var(--text-micro);">${t.stock_code}</small></td>
                    <td style="color: ${t.trade_type === 'BUY' ? 'var(--accent-green)' : 'var(--accent-red)'}; font-weight: bold;">
                        ${t.trade_type === 'BUY' ? '买入' : '卖出'}
                    </td>
                    <td style="text-align: right; font-family: var(--font-mono);">¥${Number(t.price).toFixed(2)}</td>
                    <td style="text-align: right; font-family: var(--font-mono);">${Number(t.shares).toLocaleString()}</td>
                    <td style="text-align: right; font-family: var(--font-mono);">¥${Number(t.amount).toLocaleString()}</td>
                    <td style="font-size: 11px; color: var(--text-dim);">${t.notes || 'AI 导入'}</td>
                </tr>
            `).join('');
        }
        window.onload = loadHistory;
    </script>
</body>
</html>
