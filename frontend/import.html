<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AIStock | 智能导入</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--border-thin); margin-bottom: 20px; }
        .tab { padding: 10px 20px; cursor: pointer; color: var(--text-dim); border-bottom: 2px solid transparent; transition: all 0.3s; }
        .tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); font-weight: bold; }
        .import-options { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 4px; font-size: 13px; }
        .option-group { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { cursor: pointer; }
        .preview-table-container { max-height: 500px; overflow-y: auto; }
        .status-badge { padding: 2px 6px; border-radius: 3px; font-size: 10px; text-transform: uppercase; }
        .badge-buy { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-sell { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    </style>
</head>
<body data-page-id="import">
    <div class="app-container">
        <!-- 侧边导航 (由 ui.js 填充) -->
        <aside class="sidebar"></aside>

        <main class="main-content">
            <!-- 顶栏 (由 ui.js 填充) -->
            <div class="top-bar"></div>

            <div class="workspace">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab(this, 'position')">持仓导入</div>
                    <div class="tab" onclick="switchTab(this, 'trade')">成交历史导入</div>
                </div>

                <div class="panel" style="margin-bottom: 20px;">
                    <div class="panel-header"><span class="panel-title" id="acquisition-title">持仓数据采集</span></div>
                    <div class="panel-body" style="display: flex; gap: 20px; align-items: flex-start;">
                        <div style="flex: 1; border: 2px dashed var(--border-thin); padding: 20px; text-align: center; color: var(--text-dim); border-radius: 8px; display: flex; flex-direction: column; justify-content: center; height: 120px;">
                            <input type="file" id="image-input" style="display: none;" onchange="handleImage(this)">
                            <div style="display: flex; gap: 10px; justify-content: center;">
                                <button class="btn-action" onclick="document.getElementById('image-input').click()"><i class="fas fa-camera"></i> 上传识别</button>
                                <button class="btn-action" id="btn-restore" onclick="restoreCache()" style="display:none; border-color: var(--accent-gold); color: var(--accent-gold);"><i class="fas fa-undo"></i> 恢复上次</button>
                            </div>
                            <p style="margin-top: 10px; font-size: 11px;">支持券商、雪球、同花顺截图</p>
                        </div>
                        <div style="flex: 1; border: 2px dashed var(--border-thin); padding: 14px; text-align: center; color: var(--text-dim); border-radius: 8px; display: flex; flex-direction: column; justify-content: center; height: 120px;">
                            <input type="file" id="excel-input" style="display: none;" accept=".xlsx,.xls" onchange="handleExcel(this)">
                            <button class="btn-action" onclick="document.getElementById('excel-input').click()" style="border-color: var(--accent-green); width: fit-content; margin: 0 auto;">
                                <i class="fas fa-file-excel"></i> 上传 Excel
                            </button>
                            <p style="margin-top: 8px; font-size: 11px;">.xlsx / .xls 表格</p>
                        </div>
                        <div style="flex: 2; display: flex; flex-direction: column; gap: 10px;">
                            <textarea id="text-input" placeholder="或在此粘贴文本列表..." style="width: 100%; height: 80px; background: #000; border: 1px solid var(--border-thin); color: #fff; padding: 10px; font-family: var(--font-mono); border-radius: 4px; resize: none;"></textarea>
                            <button class="btn-action" onclick="parseText()" style="border-color: var(--accent-blue); width: fit-content; padding: 5px 20px;">解析文本内容</button>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header"><span class="panel-title">结果预览与导入控制 (Result Preview)</span></div>
                        <div class="panel-body">
                            <div id="import-controls" style="display: none;">
                                <div class="import-options" id="position-options">
                                    <span style="color: var(--text-micro); margin-right: 10px;">导入策略:</span>
                                    <label class="option-group"><input type="radio" name="import-mode" value="clear" checked> 覆盖 (清空旧持仓)</label>
                                    <label class="option-group"><input type="radio" name="import-mode" value="keep"> 追加 (保留旧持仓)</label>
                                </div>
                                <div style="margin-bottom: 12px; display:flex; justify-content:space-between; align-items:center;">
                                    <div style="display: flex; align-items: center; gap: 15px;">
                                        <label style="cursor: pointer; font-size: 12px;"><input type="checkbox" id="select-all" checked onchange="toggleSelectAll(this)"> 全选</label>
                                        <span id="select-count" style="color:var(--accent-blue); font-size: 12px; font-weight:bold;">已选择 0 条记录</span>
                                    </div>
                                    <button class="btn-action" id="btn-batch-import" onclick="executeBatchImport()" style="border-color:var(--accent-green); color:var(--accent-green);">
                                        <i class="fas fa-check-circle"></i> 执行导入
                                    </button>
                                </div>
                            </div>
                            
                            <div id="import-preview" class="preview-table-container">
                                <div style="color: var(--text-micro); text-align: center; padding: 60px;">
                                    <i class="fas fa-cloud-upload-alt" style="font-size: 32px; margin-bottom: 15px; display: block; opacity: 0.3;"></i>
                                    等待数据采集输入...
                                </div>
                            </div>
                        </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 任务监控由 common.js 自动注入 -->

    <script src="js/ui.js"></script>
    <script src="js/common.js"></script>
    <script>
        // API_BASE 已在 common.js 中定义
        let currentTab = 'position'; // 'position' or 'trade'
        let parsedItems = [];

        function switchTab(el, tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if (el) el.classList.add('active');
            
            document.getElementById('acquisition-title').textContent = tab === 'position' ? '持仓数据采集' : '成交记录采集';
            document.getElementById('text-input').placeholder = tab === 'position' ? '或在此粘贴持仓文本列表...' : '或在此粘贴成交历史记录...';
            document.getElementById('position-options').style.display = tab === 'position' ? 'flex' : 'none';
            
            // Clear preview
            parsedItems = [];
            document.getElementById('import-preview').innerHTML = '<div style="color: var(--text-micro); text-align: center; padding: 60px;">等待数据采集输入...</div>';
            document.getElementById('import-controls').style.display = 'none';
        }

        async function handleImage(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const statusEl = document.getElementById('import-preview');
            document.getElementById('import-controls').style.display = 'none';

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Data = e.target.result;
                const endpoint = currentTab === 'position' ? '/ai/recognize-image' : '/ai/recognize-trades';
                try {
                    // 1. 提交异步识别任务
                    statusEl.innerHTML = '<div style="text-align:center; padding:50px; color:var(--accent-blue);"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>AI 识别任务已提交，正在处理...</div>';
                    const res = await fetch(`${API_BASE}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: base64Data })
                    });
                    const result = await res.json();
                    if (!result.success || !result.task_id) {
                        statusEl.innerHTML = `<div style="text-align:center; padding:30px; color:var(--accent-red);">提交失败: ${result.detail || '未知错误'}</div>`;
                        return;
                    }
                    const taskId = result.task_id;
                    statusEl.innerHTML = `<div style="text-align:center; padding:50px; color:var(--accent-blue);"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>AI 正在深度解析截图...<br><small style="color:var(--text-micro);">任务: ${taskId.substring(0,8)}...</small></div>`;

                    // 2. 轮询缓存，等待识别完成
                    let attempts = 0;
                    const maxAttempts = 60; // 最多等 90s
                    while (attempts < maxAttempts) {
                        await new Promise(r => setTimeout(r, 1500));
                        attempts++;
                        try {
                            const cacheRes = await fetch(`${API_BASE}/ai/get-cache`);
                            const cacheData = await cacheRes.json();
                            if (cacheData.success && cacheData.data && cacheData.data.length > 0) {
                                statusEl.innerHTML = `<div style="text-align:center; padding:20px; color:var(--accent-green);"><i class="fas fa-check-circle"></i> 识别完成: ${cacheData.data.length} 条记录</div>`;
                                await new Promise(r => setTimeout(r, 300));
                                renderPreview(cacheData.data);
                                return;
                            }
                        } catch (pollErr) { /* ignore poll errors */ }
                    }
                    statusEl.innerHTML = '<div style="text-align:center; padding:30px; color:var(--accent-red);">识别超时，请重试</div>';
                } catch (e) {
                    statusEl.innerHTML = `<div style="text-align:center; padding:30px; color:var(--accent-red);">网络请求失败: ${e.message}</div>`;
                }
            };
            reader.readAsDataURL(file);
        }

        async function handleExcel(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const statusEl = document.getElementById('import-preview');
            statusEl.innerHTML = '<div style="text-align:center; padding:50px; color:var(--accent-green);"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>解析 Excel 文件中...</div>';
            document.getElementById('import-controls').style.display = 'none';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('sheet_type', currentTab);

            try {
                const res = await fetch(`${API_BASE}/ai/upload-excel`, {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();
                if (result.success && result.data && result.data.length > 0) {
                    renderPreview(result.data);
                } else {
                    statusEl.innerHTML = `<div style="text-align:center; padding:30px; color:var(--accent-red);">解析失败: ${result.detail || '未识别到有效数据'}</div>`;
                }
            } catch (e) {
                statusEl.innerHTML = `<div style="text-align:center; padding:30px; color:var(--accent-red);">网络请求失败: ${e.message}</div>`;
            }
        }

        async function parseText() {
            const text = document.getElementById('text-input').value;
            if (!text.trim()) { Modal.alert('提示', '请先粘贴文本数据'); return; }

            if (currentTab === 'trade') {
                Modal.alert('提示', '文本解析目前仅支持持仓列表，成交历史请使用截图识别。');
                return;
            }

            const statusEl = document.getElementById('import-preview');
            statusEl.innerHTML = '<div style="text-align:center; padding:30px; color:var(--accent-blue);"><i class="fas fa-spinner fa-spin"></i> 解析中...</div>';
            document.getElementById('import-controls').style.display = 'none';

            try {
                const res = await fetch(`${API_BASE}/ai/parse-text`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const result = await res.json();
                renderPreview(result.data || result);
            } catch (e) {
                statusEl.innerHTML = `<div style="text-align:center; padding:30px; color:var(--accent-red);">文本解析失败</div>`;
            }
        }

        function renderPreview(data) {
            parsedItems = Array.isArray(data) ? data : [];
            const container = document.getElementById('import-preview');
            const controls = document.getElementById('import-controls');
            
            if (!parsedItems.length) {
                container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-micro);">未解析到有效记录</div>';
                controls.style.display = 'none';
                return;
            }

            controls.style.display = 'block';
            updateSelectCount();

            let html = `<table><thead><tr><th width="30"></th>`;
            if (currentTab === 'position') {
                html += `<th>代码</th><th>名称</th><th style="text-align:right;">数量</th><th style="text-align:right;">成本价</th><th style="text-align:right;">现价</th></tr></thead><tbody>`;
                html += parsedItems.map((p, i) => `
                    <tr>
                        <td><input type="checkbox" class="item-check" data-index="${i}" checked onchange="updateSelectCount()"></td>
                        <td style="font-family:var(--font-mono); color:var(--text-dim);">${p.stock_code}</td>
                        <td class="ticker">${p.stock_name}</td>
                        <td style="text-align:right;">${Number(p.shares).toLocaleString()}</td>
                        <td style="text-align:right; color:var(--accent-blue);">¥${Number(p.cost_price || p.price || 0).toFixed(2)}</td>
                        <td style="text-align:right;">¥${Number(p.current_price || p.price || 0).toFixed(2)}</td>
                    </tr>
                `).join('');
            } else {
                html += `<th>日期</th><th>名称</th><th>类型</th><th style="text-align:right;">数量</th><th style="text-align:right;">成交价</th></tr></thead><tbody>`;
                html += parsedItems.map((p, i) => `
                    <tr>
                        <td><input type="checkbox" class="item-check" data-index="${i}" checked onchange="updateSelectCount()"></td>
                        <td style="font-family:var(--font-mono); font-size: 11px;">${p.trade_date || '未知'}</td>
                        <td class="ticker">${p.stock_name}<br><small style="color:var(--text-micro);">${p.stock_code}</small></td>
                        <td><span class="status-badge ${p.trade_type === 'BUY' ? 'badge-buy' : 'badge-sell'}">${p.trade_type === 'BUY' ? '买入' : '卖出'}</span></td>
                        <td style="text-align:right;">${Number(p.shares).toLocaleString()}</td>
                        <td style="text-align:right;">¥${Number(p.price).toFixed(2)}</td>
                    </tr>
                `).join('');
            }
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function toggleSelectAll(checkbox) {
            document.querySelectorAll('.item-check').forEach(c => c.checked = checkbox.checked);
            updateSelectCount();
        }

        function updateSelectCount() {
            const checked = document.querySelectorAll('.item-check:checked').length;
            document.getElementById('select-count').textContent = `已选择 ${checked} 条记录`;
            document.getElementById('btn-batch-import').disabled = checked === 0;
            document.getElementById('select-all').checked = checked === parsedItems.length && checked > 0;
        }

        async function executeBatchImport() {
            const selectedIndices = Array.from(document.querySelectorAll('.item-check:checked')).map(c => parseInt(c.dataset.index));
            if (selectedIndices.length === 0) return;

            const selectedItems = selectedIndices.map(i => parsedItems[i]);
            
            if (currentTab === 'position') {
                const mode = document.querySelector('input[name="import-mode"]:checked').value;
                const clearOld = mode === 'clear';
                const confirmMsg = `确认导入 ${selectedItems.length} 条持仓记录？` + (clearOld ? '\n⚠️ 此操作将清空现有持仓数据！' : '');
                if (!await Modal.confirm('确认导入', confirmMsg)) return;

                try {
                    const res = await fetch(`${API_BASE}/ai/batch-import`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ items: selectedItems, clear_old: clearOld })
                    });
                    const result = await res.json();
                    Modal.alert('导入成功', `新导入: ${result.imported_count} 条` + (clearOld ? `\n已清空旧记录: ${result.cleared_count} 条` : ''));
                    if (result.success) location.href = 'positions.html';
                } catch (e) {
                    Modal.alert('导入失败', e.message);
                }
            } else {
                if (!await Modal.confirm('确认导入', `确认将这 ${selectedItems.length} 条成交历史导入审计库？`)) return;
                try {
                    const res = await fetch(`${API_BASE}/ai/batch-import-trades`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ items: selectedItems })
                    });
                    const result = await res.json();
                    Modal.alert('导入成功', `历史记录导入成功！\n共计: ${result.imported_count} 条记录`);
                    if (result.success) location.href = 'history.html';
                } catch (e) {
                    Modal.alert('导入失败', e.message);
                }
            }
        }

        async function checkCache() {
            try {
                const res = await fetch(`${API_BASE}/ai/get-cache`);
                const result = await res.json();
                if (result.success && result.data) {
                    const btn = document.getElementById('btn-restore');
                    if (btn) btn.style.display = 'inline-block';
                    window.lastCache = result.data;
                }
            } catch (e) {}
        }

        async function restoreCache() {
            if (!window.lastCache) return;
            const cache = window.lastCache;
            if (cache.type !== currentTab) {
                switchTab(cache.type);
            }
            setTimeout(() => {
                renderPreview(cache.data);
                document.getElementById('import-preview').scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }

        window.onload = checkCache;
    </script>
</body>
</html>
