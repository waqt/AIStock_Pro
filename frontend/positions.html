<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AIStock | 持仓管理</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body data-page-id="positions">
    <div class="app-container">
        <!-- 侧边导航 (由 ui.js 填充) -->
        <aside class="sidebar"></aside>

        <main class="main-content">
            <!-- 顶栏 (由 ui.js 填充) -->
            <div class="top-bar"></div>

            <div class="workspace">
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">持仓明细 (Portfolio Details)</span>
                        <button class="btn-action" onclick="computeSnapshot()" id="btn-snapshot" style="margin-left:12px;font-size:11px;padding:4px 10px;border-color:var(--accent-gold);color:var(--accent-gold);">
                            <i class="fas fa-calculator"></i> 刷新损益
                        </button>
                        <span id="snapshot-result" style="font-size:10px;color:var(--text-micro);margin-left:8px;"></span>
                    </div>
                    <div class="panel-body">
                        <table>
                            <thead>
                                <tr>
                                    <th>股票名称</th>
                                    <th style="text-align: right;">持股数量</th>
                                    <th style="text-align: right;">成本价</th>
                                    <th style="text-align: right;">现价</th>
                                    <th style="text-align: right;">市值</th>
                                    <th style="text-align: right;">盈亏金额</th>
                                    <th style="text-align: right;">收益率</th>
                                    <th style="text-align: right;">总市值</th>
                                    <th style="text-align: center;">观察</th>
                                    <th style="text-align: center;">操作</th>
                                </tr>
                            </thead>
                            <tbody id="position-list"></tbody>
                        </table>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header"><span class="panel-title">资产分布 (Allocation)</span></div>
                    <div class="panel-body">
                        <div id="allocation-stats" style="font-size: 12px; color: var(--text-dim);">
                            <!-- 动态加载 -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 图表弹窗 -->
    <div id="chart-modal-wrapper" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px);">
        <div style="background: var(--bg-card); width: 80%; max-width: 900px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div style="padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                <span id="chart-modal-title" style="font-weight: bold; font-size: 16px;">个股走势</span>
                <button onclick="closeChartModal()" style="background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 16px;"><i class="fas fa-times"></i></button>
            </div>
            <div id="chart-container" style="width: 100%; height: 500px; padding: 10px;"></div>
        </div>
    </div>

    <!-- 任务监控由 common.js 自动注入 -->

    <script src="js/framework/api.js"></script>
    <script src="js/framework/modal.js"></script>
    <script src="js/framework/task_monitor.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/common.js"></script>
    <script>
        // API_BASE 已在 common.js 中定义
        async function computeSnapshot() {
            const btn = document.getElementById('btn-snapshot');
            const status = document.getElementById('snapshot-result');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 计算中...';
            status.textContent = '';
            try {
                const res = await fetch(`${API_BASE}/data/portfolio/snapshot`, { method: 'POST' });
                const d = await res.json();
                const daily = d.daily_profit_loss || 0;
                const cumulative = d.cumulative_profit_loss || 0;
                const realized = d.realized_profit_loss || 0;
                const total = d.total_profit_loss || 0;
                const dailyColor = daily >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
                status.innerHTML = `${d.count||0}只 | 市值¥${(d.total_market_value||0).toLocaleString()} | <span style="color:${dailyColor}">当日盈亏 ¥${daily.toLocaleString()}</span> | 累计持仓 ¥${cumulative.toLocaleString()} | 已实现 ¥${realized.toLocaleString()} | 历史总 ¥${total.toLocaleString()}`;
                refreshPositions();
            } catch(e) { status.textContent = '失败: ' + e.message; }
            finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-calculator"></i> 刷新损益'; }
        }

        async function refreshPositions() {
            try {
                const res = await fetch(`${API_BASE}/positions`);
                const data = await res.json();
                
                // 确保数据展示容器存在
                const statsEl = document.getElementById('page-stats');
                if (statsEl && !document.getElementById('pos-count')) {
                    statsEl.innerHTML = `<div class="status-item"><span class="status-label">当前持仓标的:</span> <span class="status-value" id="pos-count">0</span></div>`;
                }
                
                const countEl = document.getElementById('pos-count');
                if (countEl) countEl.textContent = data.length;
                
                const list = document.getElementById('position-list');
                if (!list) return;

                list.innerHTML = data.map(p => `
                    <tr>
                        <td class="ticker">${p.stock_name}<br><small style="color: var(--text-micro);">${p.stock_code}</small></td>
                        <td style="text-align: right; font-family: var(--font-mono);">${p.volume}</td>
                        <td style="text-align: right; font-family: var(--font-mono);">¥${Number(p.avg_cost || 0).toFixed(3)}</td>
                        <td style="text-align: right; font-family: var(--font-mono);">¥${Number(p.current_price || 0).toFixed(3)}</td>
                        <td style="text-align: right; font-family: var(--font-mono);">¥${Number(p.market_value || 0).toLocaleString()}</td>
                        <td style="text-align: right; color: ${(p.profit_loss || 0) >= 0 ? 'var(--accent-green)' : 'var(--accent-red)'};">
                            ${(p.profit_loss || 0) >= 0 ? '+' : ''}${Number(p.profit_loss || 0).toFixed(3)}
                        </td>
                        <td style="text-align: right; color: ${(p.profit_loss_ratio || 0) >= 0 ? 'var(--accent-green)' : 'var(--accent-red)'}; font-weight: bold;">
                            ${p.profit_loss_ratio != null ? ((p.profit_loss_ratio >= 0 ? '+' : '') + Number(p.profit_loss_ratio).toFixed(3) + '%') : '—'}
                        </td>
                        <td style="text-align: right; font-family: var(--font-mono);">
                            ${p.mcap_yi != null ? Math.round(p.mcap_yi).toLocaleString() + '亿' : '—'}
                        </td>
                        <td style="text-align: center;">
                            <span class="obs-badge" data-code="${p.stock_code}" onclick="showStockObs('${p.stock_code}')" style="cursor:pointer;font-size:11px;color:var(--text-dim);">···</span>
                        </td>
                        <td style="text-align: center;">
                            <button class="btn-action" style="padding: 4px 10px; font-size: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-normal); border-radius: 4px; cursor: pointer;" onclick="showChart('${p.stock_code}', '${p.stock_name}')"><i class="fas fa-chart-bar" style="color: #60a5fa;"></i> 走势</button>
                            <button class="btn-action" style="padding: 2px 8px; font-size: 10px; border-color: var(--accent-red); color: var(--accent-red); margin-left: 4px;" onclick="deletePosition('${p.stock_code}', '${p.stock_name}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
                // 加载各股票观察计数
                const codes = data.map(p => p.stock_code).filter(Boolean);
                codes.forEach(code => {
                    fetch(`${API_BASE}/observations/stocks/${code}`)
                        .then(r => r.json())
                        .then(d => {
                            const badge = document.querySelector(`.obs-badge[data-code="${code}"]`);
                            if (badge) {
                                const n = d.total || 0;
                                badge.innerHTML = n > 0 ? `<span style="color:var(--accent-green);font-weight:bold;">${n}</span><span style="font-size:9px;">观</span>` : `<span style="color:var(--text-micro);font-size:10px;">-</span>`;
                            }
                        })
                        .catch(() => {});
                });
            } catch (e) {
                console.error('加载持仓失败:', e);
            }
        }

        // 个股观察弹窗
        async function showStockObs(code) {
            try {
                const data = await API.get(`/observations/stocks/${code}`);
                if (!data.observations || data.observations.length === 0) {
                    await Modal.alert('观察事件', '该股票暂无关联的观察事件');
                    return;
                }
                let html = `<div style="font-size:11px;">共 ${data.total} 条观察事件</div><table style="width:100%;font-size:11px;border-collapse:collapse;margin-top:8px;">`;
                html += `<tr style="color:var(--text-micro);border-bottom:1px solid var(--border-color);">
                    <th style="padding:4px 6px;text-align:left;">来源</th>
                    <th style="padding:4px 6px;text-align:left;">标题</th>
                    <th style="padding:4px 6px;text-align:left;">分类</th>
                    <th style="padding:4px 6px;text-align:left;">方向</th>
                    <th style="padding:4px 6px;text-align:left;">状态</th>
                </tr>`;
                data.observations.forEach(o => {
                    const dirIcon = o.direction === 'positive' ? '↑' : o.direction === 'negative' ? '↓' : '—';
                    html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.04);">
                        <td style="padding:4px 6px;">${o.source_step}</td>
                        <td style="padding:4px 6px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escHtml(o.description || '')}">${escHtml(o.title || '').substring(0,30)}</td>
                        <td style="padding:4px 6px;font-size:10px;color:var(--text-micro);">${o.category || '-'}</td>
                        <td style="padding:4px 6px;">${dirIcon}</td>
                        <td style="padding:4px 6px;">${o.status}</td>
                    </tr>`;
                });
                html += '</table>';
                await Modal.alert(`观察事件 - ${code}`, html);
            } catch (e) {
                console.error('showStockObs error:', e);
            }
        }

        async function refreshPrices() {
            const btn = document.getElementById('btn-refresh-price');
            if(btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 获取行情中...';
            }
            try {
                const res = await fetch(`${API_BASE}/positions/update-prices`, { method: 'POST' });
                const data = await res.json();
                Modal.alert('操作完成', data.message || '行情刷新完成');
                refreshPositions();
            } catch (e) {
                Modal.alert('刷新失败', e.message);
            }
            if(btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-chart-line"></i> 刷新行情';
            }
        }

        let myChart = null;

        function closeChartModal() {
            document.getElementById('chart-modal-wrapper').style.display = 'none';
        }

        async function showChart(stockCode, stockName) {
            const modal = document.getElementById('chart-modal-wrapper');
            modal.style.display = 'flex';
            document.getElementById('chart-modal-title').innerText = `${stockName} (${stockCode}) - 近期走势 (日K)`;
            
            const container = document.getElementById('chart-container');
            if (!myChart) {
                myChart = echarts.init(container, 'dark'); // 搭配暗色系统主题
            }
            
            myChart.showLoading({ text: '拼命加载行情中...', color: '#60a5fa', textColor: '#fff', maskColor: 'rgba(0,0,0,0.5)' });
            
            try {
                const res = await fetch(`${API_BASE}/data/daily/${stockCode}?limit=500`);
                if (!res.ok) throw new Error('行情获取失败');
                const rawData = await res.json();
                
                // 新后端已返回正序数据，无需 reverse
                const dates = rawData.map(item => item.trade_date);
                // K线图所需数据格式: [open, close, low, high]
                const values = rawData.map(item => [item.open, item.close, item.low, item.high]);
                // 成交量数据格式: [index, volume, sign]
                const volumes = rawData.map((item, index) => [index, item.volume, item.close >= item.open ? 1 : -1]);
                
                const option = {
                    backgroundColor: 'transparent',
                    tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
                    grid: [
                        { left: '10%', right: '5%', height: '50%' },
                        { left: '10%', right: '5%', top: '70%', height: '15%' }
                    ],
                    xAxis: [
                        { type: 'category', data: dates, scale: true, boundaryGap: false, axisLine: { onZero: false }, splitLine: { show: false }, min: 'dataMin', max: 'dataMax' },
                        { type: 'category', gridIndex: 1, data: dates, boundaryGap: false, axisLabel: { show: false }, axisTick: { show: false }, axisLine: { onZero: false }, splitLine: { show: false }, min: 'dataMin', max: 'dataMax' }
                    ],
                    yAxis: [
                        { scale: true, splitArea: { show: true } },
                        { gridIndex: 1, splitNumber: 2, axisLabel: { show: false }, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false } }
                    ],
                    dataZoom: [
                        { type: 'inside', xAxisIndex: [0, 1], start: 50, end: 100 },
                        { show: true, xAxisIndex: [0, 1], type: 'slider', top: '90%', start: 50, end: 100 }
                    ],
                    series: [
                        {
                            name: '日K',
                            type: 'candlestick',
                            data: values,
                            itemStyle: { 
                                color: '#ef5350', // 阳线（红）
                                color0: '#26a69a', // 阴线（绿）
                                borderColor: '#ef5350', 
                                borderColor0: '#26a69a' 
                            }
                        },
                        {
                            name: '成交量',
                            type: 'bar',
                            xAxisIndex: 1,
                            yAxisIndex: 1,
                            data: volumes.map(item => {
                                return {
                                    value: item[1],
                                    itemStyle: { color: item[2] > 0 ? '#ef5350' : '#26a69a' }
                                }
                            })
                        }
                    ]
                };
                
                myChart.setOption(option);
            } catch (e) {
                console.error(e);
                Modal.alert('加载失败', '无法加载图表数据，可能暂未同步该股行情');
            } finally {
                myChart.hideLoading();
            }
        }
        
        window.addEventListener('resize', () => {
            if (myChart) myChart.resize();
        });

        async function deletePosition(code, name) {
            const ok = await Modal.danger('删除持仓', `确认删除 ${name} (${code})？`);
            if (!ok) return;
            try {
                const res = await fetch(`${API_BASE}/positions/${code}`, { method: 'DELETE' });
                if (res.ok) refreshPositions();
                else Modal.alert('删除失败', '请稍后重试');
            } catch (e) {
                Modal.alert('删除失败', e.message);
            }
        }

        // 注册刷新钩子
        window.refreshPageData = refreshPositions;
    </script>
</body>
</html>
