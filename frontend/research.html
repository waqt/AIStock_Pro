<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AIStock | AI 投研</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .workspace { padding: 10px; display: flex; gap: 10px; height: calc(100vh - 110px); }
        /* Left: project list */
        .proj-list-panel { width: 280px; min-width: 220px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--border-color); padding-right: 8px; }
        .proj-list-panel .header { display: flex; justify-content: space-between; align-items: center; }
        .proj-list-panel .header .title { color: #fff; font-size: 12px; }
        .proj-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
        .proj-item { padding: 8px 10px; background: rgba(255,255,255,0.02); border: 1px solid var(--border-thin); border-radius: 4px; cursor: pointer; }
        .proj-item:hover { background: rgba(255,255,255,0.04); }
        .proj-item.active { border-color: var(--accent-blue); background: rgba(64,158,255,0.06); }
        .proj-item .name { color: #fff; font-size: 11px; }
        .proj-item .meta { color: var(--text-micro); font-size: 9px; margin-top: 3px; }
        .proj-item .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
        .status-dot.ok { background: var(--accent-green); }
        .status-dot.fail { background: var(--accent-red); }
        .status-dot.running { background: var(--accent-yellow); }
        .status-dot.pending { background: var(--text-micro); }
        /* Right: detail */
        .detail-panel { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; overflow-y: auto; }
        .detail-header { display: flex; justify-content: space-between; align-items: center; }
        .detail-header .name { color: var(--accent-blue); font-size: 13px; }
        .detail-header .meta { color: var(--text-micro); font-size: 10px; }
        /* Step cards */
        .step-cards { display: flex; flex-direction: column; gap: 4px; }
        .step-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border-thin); border-radius: 4px; overflow: hidden; }
        .step-card-header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; }
        .step-card-header:hover { background: rgba(255,255,255,0.03); }
        .step-card-header .step-name { color: #fff; font-size: 11px; flex: 1; }
        .step-card-header .step-meta { color: var(--text-micro); font-size: 9px; }
        .step-card-header .step-icon { font-size: 12px; width: 16px; text-align: center; }
        .step-actions { padding: 4px 10px 6px; display: flex; gap: 6px; border-top: 1px solid var(--border-thin); }
        /* Output / Trace panels */
        .output-panel, .trace-panel { background: rgba(0,0,0,0.3); border: 1px solid var(--border-thin); border-radius: 4px; margin: 0 8px 8px; }
        .output-panel .header, .trace-panel .header { display: flex; justify-content: space-between; align-items: center; padding: 4px 10px; border-bottom: 1px solid var(--border-thin); }
        .output-panel .header .title, .trace-panel .header .title { color: var(--text-dim); font-size: 10px; }
        .output-editor { width: 100%; min-height: 300px; background: #000; color: var(--accent-green); border: none; padding: 10px; font-family: var(--font-mono); font-size: 11px; resize: vertical; }
        .output-view { padding: 10px; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
        .trace-list { max-height: 300px; overflow-y: auto; padding: 6px; }
        .trace-event { padding: 4px 8px; border-bottom: 1px solid var(--border-thin); font-size: 10px; }
        .trace-event .type { color: var(--accent-blue); }
        .trace-event .detail { color: var(--text-dim); margin-left: 8px; }
        /* Buttons */
        .btn-proj { background: none; border: 1px solid var(--border-thin); color: var(--text-dim); padding: 3px 8px; border-radius: 3px; cursor: pointer; font-size: 10px; white-space: nowrap; }
        .btn-proj:hover { color: #fff; border-color: var(--accent-blue); }
        .btn-proj.primary { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
        .btn-proj.primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-proj.success { border-color: var(--accent-green); color: var(--accent-green); }
        .btn-proj.success:hover { background: rgba(76,175,80,0.1); }

        /* Step 2 详情面板 */
        .step2-detail { margin-top: 6px; padding: 8px; background: rgba(255,255,255,0.02); border: 1px solid var(--border-thin); border-radius: 4px; font-size: 11px; }
        .step2-detail .mismatch-row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
        .step2-detail .mismatch-card { padding: 4px 8px; border-radius: 3px; font-size: 10px; text-align: center; min-width: 50px; }
        .step2-detail .mismatch-card .val { font-weight: bold; font-size: 11px; }
        .step2-detail .mismatch-card .label { font-size: 9px; opacity: 0.8; }
        .step2-detail .path-badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: bold; margin-right: 4px; }
        .step2-detail .path-badge.A { background: rgba(33,150,243,0.2); color: #64b5f6; }
        .step2-detail .path-badge.B { background: rgba(156,39,176,0.2); color: #ce93d8; }
        .step2-detail .path-badge.C { background: rgba(76,175,80,0.2); color: #81c784; }
        .step2-detail .path-badge.KILL { background: rgba(244,67,54,0.2); color: #ef9a9a; }
        .step2-detail .info-row { display: flex; gap: 10px; margin-bottom: 4px; font-size: 10px; color: var(--text-dim); flex-wrap: wrap; }
        .step2-detail .info-item { }
        .step2-detail .info-item .tag { color: var(--text-micro); }
        .step2-detail .thesis-killer { display: inline-block; padding: 1px 5px; border-radius: 2px; font-size: 9px; margin-right: 3px; }
        .step2-detail .thesis-killer.warn { background: rgba(244,67,54,0.15); color: #ef9a9a; }
        .step2-detail .thesis-killer.ok { background: rgba(76,175,80,0.15); color: #81c784; }
        .step2-detail .thesis-killer.info { background: rgba(33,150,243,0.15); color: #64b5f6; }
        .step2-detail .rationale { font-size: 10px; color: var(--text-dim); margin-top: 4px; padding: 4px; border-left: 2px solid var(--border-thin); }
        .placeholder { color: var(--text-micro); text-align: center; padding: 40px; font-size: 12px; }
        /* Tabs */
        .detail-tab { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 6px 14px; font-size: 11px; border-bottom: 2px solid transparent; }
        .detail-tab.active { color: #fff; border-bottom-color: var(--accent-blue); }
        .detail-tab:hover { color: #fff; }
        /* Report */
        .report-area .md-content { font-size: 12px; line-height: 1.8; color: var(--text-dim); }
        .report-area .md-content h1 { font-size: 16px; margin: 0 0 12px; color: #fff; }
        .report-area .md-content h2 { font-size: 14px; margin: 16px 0 8px; border-bottom: 1px solid var(--border-thin); padding-bottom: 4px; color: #fff; }
        .report-area .md-content h3 { font-size: 13px; margin: 12px 0 6px; color: #fff; }
        .report-area .md-content table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 11px; }
        .report-area .md-content th { color: var(--text-micro); padding: 4px 6px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .report-area .md-content td { padding: 3px 6px; border-bottom: 1px solid var(--border-thin); }
        .extract-panel .stock-item { padding: 6px 8px; background: rgba(255,255,255,0.02); border: 1px solid var(--border-thin); border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .extract-panel .stock-item:hover { background: rgba(255,255,255,0.05); }
        .badge { font-size: 9px; padding: 1px 5px; border-radius: 3px; }
        .badge-info { background: rgba(64,158,255,0.12); color: var(--accent-blue); }
    </style>
</head>
<body data-page-id="research">
<div class="app-container">
<aside class="sidebar"></aside>
<main class="main-content">
<div class="top-bar"></div>
<div class="workspace">

    <!-- Left: Project List -->
    <div class="proj-list-panel">
        <div class="header">
            <span class="title"><i class="fas fa-project-diagram"></i> 投研项目</span>
            <button class="btn-proj primary" onclick="newProject()"><i class="fas fa-plus"></i> 新建</button>
        </div>
        <div class="proj-list" id="proj-list">
            <div class="placeholder">加载中...</div>
        </div>
    </div>

    <!-- Right: Project Detail -->
    <div class="detail-panel" id="detail-panel">
        <div class="placeholder" id="detail-empty">
            <div style="font-size:36px;margin-bottom:10px;opacity:0.3;">&#128202;</div>
            <div>选择一个项目查看详情，或点击「新建」开始投研</div>
        </div>
        <div id="detail-content" style="display:none;">
            <div class="detail-header">
                <div>
                    <span class="name" id="detail-name"></span>
                    <span class="meta" id="detail-meta"></span>
                </div>
                <div style="display:flex;gap:4px;">
                    <button class="btn-proj" onclick="refreshProject()"><i class="fas fa-sync-alt"></i> 刷新</button>
                </div>
            </div>
            <!-- Tab bar -->
            <div class="detail-tabs" id="detail-tabs" style="display:flex;gap:0;border-bottom:1px solid var(--border-color);margin-bottom:6px;">
                <button class="detail-tab active" onclick="switchDetailTab('nodes')" data-tab="nodes">节点详情</button>
                <button class="detail-tab" onclick="switchDetailTab('report')" data-tab="report">投研报告</button>
            </div>
            <!-- Nodes Tab -->
            <div id="tab-nodes">
            <div class="step-cards" id="step-cards"></div>
            <!-- Output Panel -->
            <div class="output-panel" id="output-panel" style="display:none;">
                <div class="header">
                    <span class="title" id="output-title"></span>
                    <div style="display:flex;gap:4px;">
                        <button class="btn-proj" id="btn-edit" onclick="toggleEdit()"><i class="fas fa-edit"></i> 编辑</button>
                        <button class="btn-proj success" id="btn-save" onclick="saveEdit()" style="display:none;"><i class="fas fa-check"></i> 保存</button>
                        <button class="btn-proj" id="btn-cancel" onclick="toggleEdit()" style="display:none;"><i class="fas fa-times"></i> 取消</button>
                        <button class="btn-proj" onclick="loadTrace(currentStep)"><i class="fas fa-search"></i> 溯源</button>
                        <button class="btn-proj" onclick="closeOutput()"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                <div id="output-content"></div>
            </div>
            <!-- Trace Panel -->
            <div class="output-panel" id="output-panel" style="display:none;">
                <div class="header">
                    <span class="title" id="output-title"></span>
                    <div style="display:flex;gap:4px;">
                        <button class="btn-proj" id="btn-edit" onclick="toggleEdit()"><i class="fas fa-edit"></i> 编辑</button>
                        <button class="btn-proj success" id="btn-save" onclick="saveEdit()" style="display:none;"><i class="fas fa-check"></i> 保存</button>
                        <button class="btn-proj" id="btn-cancel" onclick="toggleEdit()" style="display:none;"><i class="fas fa-times"></i> 取消</button>
                        <button class="btn-proj" onclick="loadTrace(currentStep)"><i class="fas fa-search"></i> 溯源</button>
                        <button class="btn-proj" onclick="closeOutput()"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                <div id="output-content"></div>
            </div>
            <!-- Trace Panel -->
            <div class="trace-panel" id="trace-panel" style="display:none;">
                <div class="header">
                    <span class="title" id="trace-title"></span>
                    <button class="btn-proj" onclick="document.getElementById('trace-panel').style.display='none'"><i class="fas fa-times"></i></button>
                </div>
                <div class="trace-list" id="trace-list"></div>
            </div>
            </div><!-- /tab-nodes -->

            <!-- Report Tab -->
            <div id="tab-report" style="display:none;">
                <div class="content-area" style="display:flex;gap:12px;flex:1;min-height:300px;">
                    <div class="report-area" id="report-area" style="flex:1;overflow-y:auto;background:rgba(255,255,255,0.01);border:1px solid var(--border-thin);border-radius:6px;padding:16px;">
                        <div style="color:var(--text-micro);text-align:center;padding:40px;" id="report-placeholder">
                            加载报告内容中...
                        </div>
                        <div class="md-content" id="report-content" style="display:none;"></div>
                    </div>
                    <div class="extract-panel" id="extract-panel" style="width:260px;min-width:200px;display:flex;flex-direction:column;gap:6px;">
                        <div style="color:var(--accent-blue);font-size:10px;padding:4px 0;"><i class="fas fa-code"></i> 提取标的</div>
                        <div id="extract-list" style="flex:1;overflow-y:auto;">
                            <div style="color:var(--text-micro);font-size:10px;text-align:center;padding:10px;">报告加载后自动提取</div>
                        </div>
                    </div>
                </div>
            </div><!-- /tab-report -->

        </div>
    </div>

</div><!-- workspace -->
</main>
</div><!-- app-container -->

<script src="js/framework/api.js"></script>
<script src="js/framework/modal.js"></script>

<script src="js/ui.js"></script>

<script>
var currentRunId = null;
var currentStep = null;
var currentOutput = null;
var editMode = false;

// ═══ Project List ═══════════════════════════════

async function loadProjects() {
    var el = document.getElementById('proj-list');
    try {
        var res = await fetch(API_BASE + '/research/pipeline/runs');
        var d = await res.json();
        var runs = d.data || [];
        if (!runs.length) {
            el.innerHTML = '<div class="placeholder">暂无项目，点击「新建」开始投研</div>';
            return;
        }
        // 星标置顶
        runs.sort(function(a, b) { return (b.starred ? 1 : 0) - (a.starred ? 1 : 0); });
        el.innerHTML = runs.map(function(r) {
            var active = r.run_id === currentRunId ? ' active' : '';
            var dot = r.status === 'completed' ? 'ok' : (r.status === 'failed' ? 'fail' : (r.status === 'running' ? 'running' : 'pending'));
            var starIcon = r.starred ? '<i class="fas fa-star" style="color:var(--accent-yellow);"></i>' : '<i class="far fa-star" style="color:var(--text-micro);"></i>';
            var started = (r.started_at || '').substring(5, 16).replace('T', ' ');
            return '<div class="proj-item' + active + '">' +
                '<div onclick="selectProject(\'' + r.run_id + '\')" style="flex:1;cursor:pointer;">' +
                '<div class="name">' + escHtml(r.display_name || r.run_id) + '</div>' +
                '<div class="meta"><span class="status-dot ' + dot + '"></span>' +
                escHtml(r.status || '?') + ' · ' + (r.elapsed_seconds || 0) + 's' +
                (started ? ' · ' + started : '') + '</div></div>' +
                '<div style="display:flex;gap:6px;align-items:center;" onclick="event.stopPropagation()">' +
                '<span style="cursor:pointer;font-size:12px;" onclick="toggleStar(\'' + r.run_id + '\')" title="收藏">' + starIcon + '</span>' +
                '<span style="cursor:pointer;color:var(--text-micro);font-size:10px;" onclick="deleteProject(\'' + r.run_id + '\',\'' + escHtml(r.display_name || r.run_id) + '\')" title="删除"><i class="fas fa-trash"></i></span>' +
                '</div></div>';
        }).join('');
    } catch(e) {
        el.innerHTML = '<div class="placeholder" style="color:var(--accent-red);">加载失败<br><button class="btn-proj" onclick="loadProjects()">重试</button></div>';
    }
}

// ═══ Project Detail ═══════════════════════════════

async function selectProject(runId) {
    currentRunId = runId;
    closeOutput();
    document.getElementById('trace-panel').style.display = 'none';
    document.querySelectorAll('.proj-item').forEach(function(el) { el.classList.remove('active'); });
    var el = document.querySelector('.proj-item[onclick*="' + runId + '"]');
    if (el) el.classList.add('active');
    await loadProjectDetail();
}

async function refreshProject() {
    if (currentRunId) await loadProjectDetail();
}

async function loadProjectDetail() {
    if (!currentRunId) return;
    document.getElementById('detail-empty').style.display = 'none';
    document.getElementById('detail-content').style.display = '';
    try {
        var res = await fetch(API_BASE + '/research/pipeline/' + currentRunId);
        var d = await res.json();
        var data = d.data || {};
        var m = data.manifest || {};
        document.getElementById('detail-name').textContent = data.display_name || currentRunId;
        document.getElementById('detail-meta').textContent =
            (m.started_at || '').substring(0,16) + ' · ' + (m.mode || '?') + ' · ' + (m.status || '?') + ' · ' + (m.elapsed_seconds || 0) + 's';
        // Step cards
        var steps = data.steps || {};
        var stepNames = Object.keys(steps);
        if (!stepNames.length) {
            document.getElementById('step-cards').innerHTML = '<div class="placeholder" style="font-size:11px;">暂无步骤数据</div>';
            return;
        }
        stepNames.sort();
        var statusIcons = {completed: '✅', pending: '⏳', running: '🔄', planned: '📋', failed: '❌'};
        var cardsHtml = '';
        stepNames.forEach(function(s) {
            var info = steps[s];
            var status = info.status || 'pending';
            var icon = statusIcons[status] || '⏳';
            var label = info.label || s;
            var isDone = status === 'completed';
            var isPlanned = status === 'planned';
            var dimmed = (status === 'pending' || isPlanned) ? 'color:var(--text-micro);' : '';
            var metaText = (info.elapsed_seconds ? info.elapsed_seconds + 's' : '') +
                (info.is_shared ? ' · 共享' : '') +
                (info.optional ? ' · 可选' : '') +
                (info.has_trace ? ' · trace✓' : '') +
                (isPlanned ? ' · 未实现' : '');
            cardsHtml += '<div class="step-card">' +
                '<div class="step-card-header">' +
                '<span class="step-icon">' + icon + '</span>' +
                '<span class="step-name" style="' + dimmed + '">' + escHtml(label) + '</span>' +
                '<span class="step-meta" style="font-size:9px;">' + metaText + '</span></div>' +
                (isDone ? '<div class="step-actions">' +
                '<button class="btn-proj" onclick="event.stopPropagation();loadOutput(\'' + s + '\')"><i class="fas fa-file-code"></i> 查看输出</button>' +
                (info.has_trace ? '<button class="btn-proj" onclick="event.stopPropagation();loadTrace(\'' + s + '\')"><i class="fas fa-search"></i> 查看溯源</button>' : '') +
                (s === 'step2_gatekeeper' ? '<button class="btn-proj success" onclick="event.stopPropagation();continueStep(\'' + s + '\')"><i class="fas fa-play"></i> 继续推演</button>' : '') +
                (s === 'step3_sc_hacker' ? '<button class="btn-proj success" onclick="event.stopPropagation();continueStep(\'' + s + '\')"><i class="fas fa-play"></i> 继续推演</button>' : '') +
                (s === 'step4_system_dynamics' ? '<button class="btn-proj success" onclick="event.stopPropagation();continueStep(\'' + s + '\')"><i class="fas fa-play"></i> 继续推演</button>' : '') +
                (s === 'step5_cross_industry' ? '<button class="btn-proj success" onclick="event.stopPropagation();continueStep(\'' + s + '\')"><i class="fas fa-play"></i> 继续推演</button>' : '') +
                '</div>' : '') +
                '</div>';
        });
        document.getElementById('step-cards').innerHTML = cardsHtml;
        // 全局扫描: 显示候选行业列表
        loadIndustryList();
    } catch(e) {
        document.getElementById('step-cards').innerHTML = '<div class="placeholder" style="color:var(--accent-red);">加载失败: ' + e.message + '</div>';
    }
}

async function loadIndustryList() {
    if (!currentRunId) return;
    try {
        var res = await fetch(API_BASE + '/research/pipeline/' + currentRunId + '/checkpoint/step2_gatekeeper');
        var d = await res.json();
        var out = (d.data || {}).output || {};
        // auto_scan 输出 industries 数组; 加载节点输出时也加载完整数据
        if (!out.industries || !out.industries.length) {
            // 可能是 manual 模式的单行业, 不需要列表
            try {
                // 从原始 checkpoint 文件中读取 (checkpoint API 只返回 output)
                var rawRes = await fetch(API_BASE + '/research/pipeline/' + currentRunId);
                var rawData = await rawRes.json();
                var steps = (rawData.data || {}).steps || {};
                var cpFile = (steps.step2_gatekeeper || {}).file;
                if (cpFile) {
                    var cpRes = await fetch(API_BASE + '/research/pipeline/' + currentRunId + '/checkpoint/step2_gatekeeper');
                    var cpData = await cpRes.json();
                    out = (cpData.data || {}).output || {};
                }
            } catch(e2) {}
        }
        var industries = out.industries;
        if (!industries || !industries.length) return;
        var listHtml = '<div style="margin-top:8px;padding:8px;background:rgba(255,255,255,0.01);border:1px solid var(--border-thin);border-radius:6px;">' +
            '<div style="color:#fff;font-size:11px;margin-bottom:6px;">📋 候选行业 (' + industries.length + '个)</div>';
        window._step2IndustryData = industries;
        industries.forEach(function(ind, idx) {
            var v = ind.verdict || {};
            var enter = v.enter_step3;
            var priority = v.priority || '低';
            var icon = enter ? '🥇' : (priority === '低' ? '🥉' : '🥈');
            var detailId = 's2detail-' + idx;
            listHtml += '<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--border-thin);font-size:11px;">' +
                '<span>' + icon + '</span>' +
                '<span style="color:#fff;flex:1;">' + escHtml(ind.industry || '?') + '</span>' +
                '<span style="color:' + (enter ? 'var(--accent-green)' : 'var(--text-micro)') + ';font-size:10px;">' +
                'enter=' + enter + ' · ' + priority + '</span>' +
                '<div style="display:flex;gap:4px;flex-shrink:0;">' +
                '<button class="btn-proj" style="font-size:10px;" onclick="event.stopPropagation();toggleStep2Detail(' + idx + ', \'' + detailId + '\')" title="查看五错配详情"><i class="fas fa-chart-bar"></i></button>' +
                '<button class="btn-proj" style="font-size:10px;" onclick="event.stopPropagation();directAssetMine(\'' + escHtml(ind.industry || '') + '\', this)"><i class="fas fa-crosshairs"></i> 直挖</button>' +

function toggleStep2Detail(idx, detailId) {
    var div = document.getElementById(detailId);
    if (!div) return;
    if (div.style.display !== 'none') {
        div.style.display = 'none';
        return;
    }
    // 从全局数组查找行业数据
    var industries = window._step2IndustryData || [];
    var ind = industries[idx];
    if (!ind) { div.innerHTML = '<div class="step2-detail">数据不可用</div>'; div.style.display = 'block'; return; }
    div.innerHTML = renderStep2Detail(ind, detailId);
    div.style.display = 'block';
}

function renderStep2Detail(ind, detailId) {
    var g = ind._step3_guidance || {};
    var rp = g.recommended_path || {};
    var ma = ind.mismatch_analysis || {};
    var cp = ind.cycle_position || {};
    var pr = ind.prosperity || {};
    var tk = ind.thesis_killers || g.thesis_killers || {};

    // 错配颜色映射
    var mismatchColors = {strong: '#4caf50', moderate: '#ff9800', weak: '#f44336', uncertain: '#888'};
    var mismatchLabels = {supply_demand_mismatch: '供需(S)', timing_mismatch: '时间(T)',
        expectation_gap: '认知(E)', profit_redistribution: '利润(P)', pricing_gap: '定价($)'};

    var html = '<div class="step2-detail">';

    // ── 错配矩阵 ──
    html += '<div class="mismatch-row">';
    for (var key in mismatchLabels) {
        var raw = ma[key];
        // profit_redistribution 兼容 dict
        var val = (key === 'profit_redistribution' && typeof raw === 'object') ? (raw ? (raw.strength || '?') : '?') : (raw || '?');
        var color = mismatchColors[val] || '#888';
        html += '<div class="mismatch-card" style="background:' + color + '22;border:1px solid ' + color + '44;">' +
            '<div class="val" style="color:' + color + ';">' + val.toUpperCase() + '</div>' +
            '<div class="label">' + mismatchLabels[key] + '</div></div>';
    }
    html += '</div>';

    // ── 推荐路径徽章 ──
    var path = rp.path || '';
    var conf = rp.confidence || '';
    var rationale = rp.rationale || '';
    if (path) {
        var pathLabels = {A: 'A·直挖', B: 'B·二阶', C: 'C·深挖', KILL: 'KILL·跳过'};
        var pathColors = {A: 'A', B: 'B', C: 'C', KILL: 'KILL'};
        html += '<div style="margin-bottom:6px;"><span class="path-badge ' + (pathColors[path] || '') + '">' +
            (pathLabels[path] || path) + '</span>' +
            '<span style="font-size:10px;color:var(--text-dim);">' +
            (conf ? ' 置信度: ' + conf : '') + '</span></div>';
        if (rationale) {
            html += '<div class="rationale">📌 ' + escHtml(rationale) + '</div>';
        }
    }

    // ── 周期 + 景气 + 方向 ──
    var phase = cp.phase || '';
    var nextPhase = cp.next_phase || '';
    var prosperityType = pr.type || '';
    var demandQuality = pr.demand_quality || '';
    // 利润迁移方向
    var prRaw = ma.profit_redistribution;
    var direction = '';
    if (typeof prRaw === 'object' && prRaw) {
        direction = prRaw.direction || '';
    }

    html += '<div class="info-row" style="margin-top:6px;">';
    if (phase) html += '<span class="info-item"><span class="tag">周期:</span> ' + escHtml(phase) + (nextPhase ? ' → ' + escHtml(nextPhase) : '') + '</span>';
    if (prosperityType) html += '<span class="info-item"><span class="tag">景气:</span> ' + escHtml(prosperityType) + (demandQuality ? ' (' + escHtml(demandQuality) + ')' : '') + '</span>';
    if (direction) {
        var dirMap = {upstream: '⬆上游', midstream: '➡中游', downstream: '⬇下游', 分散: '🔄分散'};
        html += '<span class="info-item"><span class="tag">利润流向:</span> ' + (dirMap[direction] || direction) + '</span>';
    }
    html += '</div>';

    // ── thesis_killers ──
    var tkItems = [
        {key: 'substitution_risk', label: '替代威胁', cls: 'warn'},
        {key: 'policy_block_risk', label: '政策阻断', cls: 'warn'},
        {key: 'investable_exposure', label: 'A股敞口', cls: 'info'}
    ];
    var hasTk = false;
    for (var i = 0; i < tkItems.length; i++) {
        var tkVal = tk[tkItems[i].key];
        if (tkVal && tkVal !== 'uncertain' && tkVal !== 'unknown') {
            if (!hasTk) { html += '<div class="info-row" style="margin-top:4px;"><span class="tag">风险:</span> '; hasTk = true; }
            var isWarn = (tkVal === 'high' || tkVal === 'limited' || tkVal === 'none');
            html += '<span class="thesis-killer ' + (isWarn ? 'warn' : 'ok') + '">' +
                escHtml(tkItems[i].label) + ': ' + escHtml(tkVal) + '</span>';
        }
    }
    if (hasTk) html += '</div>';

    html += '</div>';
    return html;
}

async function directAssetMine(industry, btn) {

function outputToggleEdit() {
    editMode = !editMode;
    var ta = document.getElementById('output-editor');
    document.getElementById('output-btn-edit').style.display = editMode ? 'none' : '';
    document.getElementById('output-btn-save').style.display = editMode ? '' : 'none';
    document.getElementById('output-btn-cancel').style.display = editMode ? '' : 'none';
    if (ta) ta.readOnly = !editMode;
    if (!editMode && ta && currentOutput) {
        ta.value = JSON.stringify(currentOutput.output, null, 2);
    }
}

async function outputSaveEdit() {
    var ta = document.getElementById('output-editor');
    if (!ta || !currentStep) return;
    var newOutput;
    try { newOutput = JSON.parse(ta.value); }
    catch(e) { Modal.alert('JSON 格式错误', e.message); return; }
    try {
        var res = await fetch(API_BASE + '/research/pipeline/' + currentRunId + '/checkpoint/' + currentStep, {
            method: 'PUT', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({output: newOutput})
        });
        var d = await res.json();
        if (d.success) {
            editMode = false;
            document.getElementById('output-btn-edit').style.display = '';
            document.getElementById('output-btn-save').style.display = 'none';
            document.getElementById('output-btn-cancel').style.display = 'none';
            if (ta) ta.readOnly = true;
            Modal.alert('保存成功', '检查点已更新');
        }
    } catch(e) { Modal.alert('保存失败', e.message); }
}

function closeOutput() {
    currentStep = null;
    currentOutput = null;
    editMode = false;
    document.getElementById('output-panel').style.display = 'none';
    document.getElementById('trace-panel').style.display = 'none';
}

async function loadTrace(step) {
    try {
        var res = await fetch(API_BASE + '/research/pipeline/' + currentRunId + '/trace/' + step);
        var d = await res.json();
        var events = (d.data || {}).events || [];
        var html = '';
        if (!events.length) {
            html = '<div class="placeholder" style="font-size:11px;padding:20px;">暂无溯源记录</div>';
        } else {
            html = events.map(function(e, i) {
                var typeIcon = e.type === 'search' ? '🔍' : (e.type === 'llm' ? '🤖' : (e.type === 'note' ? '📝' : '📎'));
                var detail = '';
                if (e.type === 'search') {
                    detail = 'q=' + escHtml((e.query || '').substring(0, 80)) + ' · r=' + (e.result_count || 0);
                } else if (e.type === 'llm') {
                    detail = 'prompt=' + (e.prompt||'').length + ' chars · response=' + (e.response||'').length + ' chars';
                } else if (e.type === 'note') {
                    detail = escHtml((e.value || '').substring(0, 150));
                }
                return '<div class="trace-event" style="padding:4px 8px;border-bottom:1px solid var(--border-thin);font-size:11px;">' +
                    '<span class="type" style="color:var(--accent-blue);">' + typeIcon + ' ' + e.type + '</span>' +
                    '<span class="detail" style="color:var(--text-dim);margin-left:8px;">' + detail + '</span></div>';
            }).join('');
        }
        html += '<div style="text-align:right;margin-top:10px;padding-top:8px;border-top:1px solid var(--border-thin);"><button class="btn-proj" onclick="Modal.close()"><i class="fas fa-times"></i> 关闭</button></div>';
        Modal.custom({title: '溯源日志: ' + step, content: '<div style="max-height:65vh;overflow-y:auto;">' + html + '</div>', wide: true});
    } catch(e) {
        Modal.alert('错误', '加载失败: ' + e.message);
    }
}

// ═══ New Project — 两步 Modal ═══════════════

var newProjectAgentId = 'supply_chain';
var newProjectModeId = 'manual_industry';

async function newProject() {
    // 加载智能体列表
    var agents = [];
    try {
        var res = await fetch(API_BASE + '/research/agents');
        var d = await res.json();
        agents = d.data || [];
    } catch(e) { agents = []; }

    if (!agents.length) {
        // 兜底: 直接显示输入框
        showNewProjectStep2('supply_chain', {id:'manual_industry',name:'定性产业分析',input_type:'industry',placeholder:'输入行业关键词'});
        return;
    }

    showNewProjectStep1(agents);
}

function showNewProjectStep1(agents) {
    var cards = agents.map(function(a, i) {
        var checked = i === 0 ? ' checked' : '';
        return '<label style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:rgba(255,255,255,0.02);border:1px solid var(--border-thin);border-radius:6px;cursor:pointer;margin-bottom:6px;">' +
            '<input type="radio" name="agent" value="' + a.id + '"' + checked + ' onchange="newProjectAgentId=this.value" style="margin-top:3px;">' +
            '<div><div style="color:#fff;font-size:13px;">' + escHtml(a.name) + '</div>' +
            '<div style="color:var(--text-dim);font-size:10px;">' + escHtml(a.desc) + '</div></div></label>';
    }).join('');

    var html = '<div style="min-width:420px;">' +
        '<div style="color:var(--text-dim);font-size:11px;margin-bottom:8px;">选择分析智能体</div>' +
        cards +
        '<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:8px;">' +
        '<button class="btn-proj" onclick="Modal.close()">取消</button>' +
        '<button class="btn-proj primary" onclick="showNewProjectStep2(newProjectAgentId)">下一步</button></div></div>';
    Modal.custom({title: '新建投研项目 — 第1步', content: html});
}

function showNewProjectStep2(agentId, fallbackMode) {
    if (fallbackMode) {
        // 兜底模式
        renderStep2(agentId, [fallbackMode]);
        return;
    }
    // 从注册表找到智能体的模式列表
    fetch(API_BASE + '/research/agents').then(function(r){return r.json()}).then(function(d){
        var agents = d.data || [];
        var agent = agents.find(function(a){ return a.id === agentId; });
        var modes = agent ? agent.modes : [{id:'manual_industry',name:'定性产业分析',input_type:'industry',placeholder:'输入行业关键词'}];
        renderStep2(agentId, modes);
    }).catch(function(){
        renderStep2(agentId, [{id:'manual_industry',name:'定性产业分析',input_type:'industry',placeholder:'输入行业关键词'}]);
    });
}

function renderStep2(agentId, modes) {
    newProjectAgentId = agentId;
    newProjectModeId = modes[0].id;

    var modeRadios = modes.map(function(m, i) {
        var checked = i === 0 ? ' checked' : '';
        return '<label style="display:block;padding:8px 10px;background:rgba(255,255,255,0.02);border:1px solid var(--border-thin);border-radius:4px;cursor:pointer;margin-bottom:4px;">' +
            '<input type="radio" name="mode" value="' + m.id + '"' + checked + ' onchange="onModeChange(this)" data-input="' + m.input_type + '" data-placeholder="' + escHtml(m.placeholder || '') + '"> ' +
            '<span style="color:#fff;font-size:12px;">' + escHtml(m.name) + '</span>' +
            '<div style="color:var(--text-micro);font-size:9px;margin-left:20px;">' + escHtml(m.desc) + '</div></label>';
    }).join('');

    var firstMode = modes[0];
    var showInput = firstMode.input_type !== 'none';

    var html = '<div style="min-width:440px;">' +
        '<div style="color:var(--text-dim);font-size:11px;margin-bottom:8px;">选择分析模式</div>' +
        modeRadios +
        '<div id="new-input-area" style="margin-top:8px;' + (showInput ? '' : 'display:none;') + '">' +
        '<input id="new-target" placeholder="' + escHtml(firstMode.placeholder || '') + '" style="width:100%;background:#000;border:1px solid var(--border-color);color:#fff;padding:8px 12px;border-radius:4px;font-size:13px;"></div>' +
        '<div style="display:flex;gap:6px;justify-content:space-between;margin-top:10px;">' +
        '<button class="btn-proj" onclick="showNewProjectStep1([]);">← 返回</button>' +
        '<div>' +
        '<button class="btn-proj" onclick="Modal.close()">取消</button>' +
        '<button class="btn-proj primary" onclick="submitNewProject()">开始分析</button></div></div></div>';
    Modal.custom({title: '新建投研项目 — 第2步', content: html});

    // 自动聚焦输入框
    setTimeout(function() {
        var inp = document.getElementById('new-target');
        if (inp) { inp.focus(); inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') submitNewProject(); }); }
    }, 200);
}

function onModeChange(radio) {
    newProjectModeId = radio.value;
    var area = document.getElementById('new-input-area');
    var inp = document.getElementById('new-target');
    if (radio.dataset.input === 'none') {
        area.style.display = 'none';
    } else {
        area.style.display = '';
        if (inp) inp.placeholder = radio.dataset.placeholder || '';
    }
}

async function submitNewProject() {
    var target = '';
    var inp = document.getElementById('new-target');
    if (inp && inp.offsetParent !== null) target = inp.value.trim();

    // auto_scan/capital_flow/macro_only 不需要输入
    var noInputModes = ['auto_scan', 'capital_flow', 'macro_only'];
    if (target === '' && noInputModes.indexOf(newProjectModeId) < 0) return;
    Modal.close();
    try {
        // 异步提交: 立即返回 exec_id, 后台执行
        var res = await fetch(API_BASE + '/research/scan?async_mode=true', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({agent_id: newProjectAgentId, mode_id: newProjectModeId, target: target})
        });
        var d = await res.json();
        if (d.success && d.data && d.data.exec_id) {
            var execId = d.data.exec_id;
            var runId = d.data.run_id;
            await loadProjects();
            if (runId) {
                selectProject(runId);
                document.getElementById('detail-meta').textContent += ' · 后台运行中...';
            }
            var pollCount = 0;
            var pollTimer = setInterval(async function() {
                try {
                    pollCount++;
                    var pollRes = await fetch(API_BASE + '/system/tasks/executions/' + execId);
                    var exec = await pollRes.json();
                    if (exec.status === 'SUCCESS' || exec.status === 'FAILED' || pollCount > 60) {
                        clearInterval(pollTimer);
                        await loadProjects();
                        if (runId) selectProject(runId);
                    }
                } catch(e) {}
            }, 3000);
        } else if (d.success && d.run_id) {
            // 同步模式 fallback (缓存命中)
            await loadProjects();
            selectProject(d.run_id);
        } else {
            Modal.alert('提交失败', d.message || '未知错误');
        }
    } catch(e) {
        Modal.alert('错误', e.message);
    }
}

function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ═══ Tab Switching ═══════════════════════════════

function switchDetailTab(tab) {
    document.querySelectorAll('.detail-tab').forEach(function(b) { b.classList.toggle('active', b.dataset.tab === tab); });
    document.getElementById('tab-nodes').style.display = tab === 'nodes' ? '' : 'none';
    document.getElementById('tab-report').style.display = tab === 'report' ? '' : 'none';
    if (tab === 'report') loadReport();
}

// ═══ Report Viewer ═══════════════════════════════

async function loadReport() {
    if (!currentRunId) return;
    var placeholder = document.getElementById('report-placeholder');
    var content = document.getElementById('report-content');
    placeholder.style.display = ''; placeholder.textContent = '加载报告内容中...';
    content.style.display = 'none';
    try {
        // 获取当前项目的 industry 信息
        var runRes = await fetch(API_BASE + '/research/pipeline/' + currentRunId);
        var runData = await runRes.json();
        var manifest = (runData.data || {}).manifest || {};
        var industry = manifest.industry || '';
        // 从报告列表找匹配的最新报告
        var listRes = await fetch(API_BASE + '/research/reports?limit=100');
        var listData = await listRes.json();
        var reports = (listData.data || []).filter(function(r) {
            return r.industry === industry || r.title === industry;
        });
        if (!reports.length) {
            placeholder.textContent = '未找到 ' + (industry || '该项目') + ' 的投研报告';
            return;
        }
        // 加载最新一份
        var reportRes = await fetch(API_BASE + '/research/reports/' + reports[0].report_id);
        var reportData = await reportRes.json();
        var report = reportData.data || {};
        var cio = report.data ? report.data.cio_report : (report.cio_report || '');
        if (!cio) {
            // 尝试从 data 直接渲染
            cio = '## ' + (report.title || industry || '报告') + '\n\n' + JSON.stringify(report.data || report, null, 2);
        }
        placeholder.style.display = 'none';
        content.style.display = '';
        content.innerHTML = typeof MD !== 'undefined' ? MD.render(cio) : '<pre>' + escHtml(cio) + '</pre>';
        // 提取标的
        var stockMap = {};
        var sc = (report.data && report.data.core_stocks) || [];
        sc.forEach(function(s) { if (s.code && s.name) stockMap[s.code] = s.name; });
        extractStocks(cio, stockMap);
    } catch(e) {
        placeholder.textContent = '加载报告失败: ' + e.message;
    }
}

// ═══ Stock Extraction ═══════════════════════════

async function extractStocks(markdown, stockMap) {
    stockMap = stockMap || {};
    var codes = markdown.match(/\b(\d{6})\b/g) || [];
    var unique = [];
    codes.forEach(function(c) { if (unique.indexOf(c) < 0) unique.push(c); });
    var el = document.getElementById('extract-list');
    if (!unique.length) { el.innerHTML = '<div style="color:var(--text-micro);font-size:10px;text-align:center;padding:10px;">未提取到标的</div>'; return; }
    var infoMap = {};
    try {
        var infoRes = await fetch(API_BASE + '/research/stocks/batch-info', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(unique)
        });
        var infoData = await infoRes.json();
        (infoData.data || []).forEach(function(s) { infoMap[s.code] = s; });
    } catch(e) {}
    unique.forEach(function(c) { if (stockMap[c] && !infoMap[c]) infoMap[c] = {name: stockMap[c]}; });
    el.innerHTML = unique.map(function(c) {
        var info = infoMap[c] || {};
        var name = info.name || c;
        var ind = info.industry ? '<span style="color:var(--text-micro);font-size:9px;">' + escHtml(info.industry) + '</span>' : '';
        var pe = info.pe_ttm ? ' · PE' + (info.pe_ttm || '').toFixed(0) : '';
        var mcap = info.mcap_yi ? ' · ' + (info.mcap_yi || '').toFixed(0) + '亿' : '';
        return '<div class="stock-item">' +
            '<div onclick="viewStock(\'' + c + '\')" title="点击查看指标数据" style="flex:1;cursor:pointer;">' +
            '<span style="color:var(--accent-blue);font-family:var(--font-mono);">' + c + '</span> ' +
            '<span style="color:#fff;font-size:11px;">' + escHtml(name) + '</span>' +
            '<div>' + ind + '<span style="color:var(--text-dim);font-size:10px;">' + pe + mcap + '</span></div></div>' +
            '<button class="btn-proj" onclick="event.stopPropagation();openAddToWatchlist(\'' + c + '\',\'' + escHtml(name) + '\')" title="添加自选">' +
            '<i class="fas fa-plus"></i> 自选</button></div>';
    }).join('');
}

// ═══ Add to Watchlist ═══════════════════════════

function openAddToWatchlist(code, name) {
    var groups = ['默认', '持仓股', '核心观察', '待研究', '高风险'];
    var groupOpts = groups.map(function(g) { return '<option value="' + g + '">' + g + '</option>'; }).join('');
    var html = '<div style="display:flex;flex-direction:column;gap:8px;min-width:360px;">' +
        '<div style="color:#fff;font-size:13px;"><span style="font-family:var(--font-mono);color:var(--accent-blue);">' + code + '</span> ' + escHtml(name) + '</div>' +
        '<label style="color:var(--text-dim);font-size:11px;">分组 <select id="addwl-group" style="background:#000;border:1px solid var(--border-color);color:#fff;padding:4px 8px;border-radius:3px;font-size:11px;width:100%;">' + groupOpts + '<option value="__new__">+ 新建分组...</option></select></label>' +
        '<label style="color:var(--text-dim);font-size:11px;">备注 <input id="addwl-notes" placeholder="如: 瓶颈环节龙头、铬盐唯一标的" style="width:100%;background:#000;border:1px solid var(--border-color);color:#fff;padding:4px 8px;border-radius:3px;font-size:11px;"></label>' +
        '<div style="display:flex;gap:8px;">' +
        '<label style="color:var(--text-dim);font-size:11px;flex:1;">目标价下限 <input id="addwl-low" type="number" step="0.01" placeholder="如 300" style="width:100%;background:#000;border:1px solid var(--border-color);color:#fff;padding:4px 8px;border-radius:3px;font-size:11px;"></label>' +
        '<label style="color:var(--text-dim);font-size:11px;flex:1;">目标价上限 <input id="addwl-high" type="number" step="0.01" placeholder="如 500" style="width:100%;background:#000;border:1px solid var(--border-color);color:#fff;padding:4px 8px;border-radius:3px;font-size:11px;"></label></div>' +
        '<div style="display:flex;gap:6px;justify-content:flex-end;">' +
        '<button class="btn-proj" onclick="Modal.close()" style="padding:6px 14px;">取消</button>' +
        '<button class="btn-proj primary" onclick="submitAddToWatchlist(\'' + code + '\',\'' + escHtml(name) + '\')" style="font-size:11px;">确认添加</button></div></div>';
    Modal.custom({title: '添加自选股', content: html});
}

async function submitAddToWatchlist(code, name) {
    var group = document.getElementById('addwl-group').value;
    if (group === '__new__') {
        group = prompt('输入新分组名称:');
        if (!group) return;
    }
    var notes = document.getElementById('addwl-notes').value;
    var low = document.getElementById('addwl-low').value;
    var high = document.getElementById('addwl-high').value;
    var params = 'stock_code=' + code + '&stock_name=' + encodeURIComponent(name) + '&group_tag=' + encodeURIComponent(group);
    if (notes) params += '&notes=' + encodeURIComponent(notes);
    if (low) params += '&target_price_low=' + low;
    if (high) params += '&target_price_high=' + high;
    try {
        var res = await fetch(API_BASE + '/data/watchlist/add?' + params, {method: 'POST'});
        var d = await res.json();
        if (d.success) { Modal.close(); Modal.alert('成功', '已添加 ' + name + ' 到自选股分组 [' + group + ']'); }
        else Modal.alert('失败', d.message || '添加失败');
    } catch(e) { Modal.alert('错误', e.message); }
}

function viewStock(code) { window.open('indicators.html?stock=' + code, '_blank'); }

// ═══ Star + Delete ═══════════════════════════

async function toggleStar(runId) {
    try {
        var res = await fetch(API_BASE + '/research/pipeline/' + runId + '/star', {method: 'PUT'});
        var d = await res.json();
        if (d.success) loadProjects();
    } catch(e) { /* silent */ }
}

async function deleteProject(runId, name) {
    var ok = await Modal.confirm('删除项目', '确定删除「' + name + '」？所有检查点文件和溯源日志将被永久删除。');
    if (!ok) return;
    try {
        var res = await fetch(API_BASE + '/research/pipeline/' + runId, {method: 'DELETE'});
        var d = await res.json();
        if (d.success) {
            if (currentRunId === runId) { currentRunId = null; document.getElementById('detail-content').style.display = 'none'; document.getElementById('detail-empty').style.display = ''; }
            loadProjects();
        } else {
            Modal.alert('删除失败', d.message || '未知错误');
        }
    } catch(e) { Modal.alert('错误', e.message); }
}

async function continueStep(step) {
    if (!currentRunId) return;
    var stepMap = {'step2_gatekeeper': 'step3_sc_hacker', 'step3_sc_hacker': 'step4_system_dynamics', 'step4_system_dynamics': 'step5_cross_industry', 'step5_cross_industry': 'step6_core_screening'};
    var nextStep = stepMap[step];
    if (!nextStep) return;
    if (!nextStep) return;
    var btn = event.target;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    try {
        var res = await fetch(API_BASE + '/research/pipeline/' + currentRunId + '/continue/' + nextStep, {method: 'POST'});
        var d = await res.json();
        if (d.success) {
            await loadProjectDetail();
        } else {
            Modal.alert('续跑失败', d.message || '未知错误');
        }
    } catch(e) { Modal.alert('错误', e.message); }
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-play"></i> 继续推演';
}

document.addEventListener('DOMContentLoaded', function() { loadProjects(); });
window.refreshPageData = function() { loadProjects(); if (currentRunId) loadProjectDetail(); };
</script>
