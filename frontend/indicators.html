<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AIStock | 指标数据</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        .workspace { display: flex; gap: 14px; padding: 14px; height: calc(100vh - 110px); }
        .left-panel { width: 380px; min-width: 340px; display: flex; flex-direction: column; gap: 8px; }
        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
        .cat-group { margin-bottom: 8px; }
        .cat-title { font-size: 10px; color: var(--text-micro); text-transform: uppercase; margin-bottom: 4px; padding: 2px 6px; background: rgba(255,255,255,0.03); border-radius: 3px; }
        .ind-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 6px; font-size: 11px; border-radius: 3px; transition: background 0.15s; gap: 4px; }
        .ind-row:hover { background: rgba(255,255,255,0.04); }
        .ind-row .name { flex: 1; color: #ccc; }
        .ind-row .val { font-family: var(--font-mono); color: var(--text-dim); text-align: right; min-width: 72px; }
        .stock-list-item { padding: 4px 8px; font-size: 11px; cursor: pointer; border-radius: 3px; display: flex; justify-content: space-between; }
        .stock-list-item:hover { background: rgba(255,255,255,0.04); }
        .stock-list-item.active { background: rgba(96,165,250,0.12); color: #60a5fa; }
        .chart-container { flex: 1; min-height: 300px; }
        select, input { background: #000; border: 1px solid var(--border-color); color: #fff; padding: 5px 10px; border-radius: 4px; font-size: 11px; }
        .info-bar { font-size: 10px; color: var(--text-micro); }
        .tab-btn { padding: 8px 16px; background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 13px; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab-btn:hover { color: #fff; }
        .tab-btn.active { color: #fff; border-bottom-color: var(--accent-blue); }
        .badge { display: inline-block; padding: 1px 6px; border-radius: 2px; font-size: 9px; }
        .badge-trend { background: rgba(112,161,255,0.15); color: var(--accent-blue); }
        .badge-momentum { background: rgba(46,213,115,0.15); color: var(--accent-green); }
        .badge-volatility { background: rgba(255,165,2,0.15); color: var(--accent-gold); }
        .badge-volume { background: rgba(255,107,107,0.15); color: var(--accent-red); }
        .badge-crowding { background: rgba(162,155,254,0.15); color: #a29bfe; }
        .badge-chip { background: rgba(255,107,167,0.15); color: #fb6da7; }
        .health-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .health-table th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border-color); color: var(--text-micro); font-weight: 500; position: sticky; top: 0; background: #0a0a0a; z-index: 1; }
        .health-table td { padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .health-table tr:hover td { background: rgba(255,255,255,0.03); }
        .fin-table-wrap { overflow-x: auto; max-height: 50vh; overflow-y: auto; }
    </style>
</head>
<body data-page-id="indicators">
<div class="app-container">
<aside class="sidebar"></aside>
<main class="main-content">
<div class="top-bar"></div>
<div class="workspace">
    <!-- Left: Stock Selector + Indicator Cards + Compare Panel -->
    <div class="left-panel">
        <div class="panel" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
            <div class="panel-header" style="display:flex;gap:4px;">
                <button class="tab-btn active" onclick="TechInd.switchMode('stock')" id="btn-stock">按股票</button>
                <button class="tab-btn" onclick="TechInd.switchMode('field')" id="btn-field">按指标</button>
                <button class="tab-btn" onclick="TechInd.switchMode('compare')" id="btn-compare">交叉比较</button>
            </div>
            <!-- Stock mode -->
            <div id="mode-stock" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
                <div style="padding:6px 10px;display:flex;gap:6px;">
                    <select id="stock-select" onchange="TechInd.selectStock()" style="flex:1;min-width:0;">
                        <option value="">— 加载中 —</option>
                    </select>
                </div>
                <div style="padding:2px 10px;" class="info-bar">
                    <span id="stock-info-text">选择股票查看指标</span>
                </div>
                <div id="indicator-cards" style="flex:1;overflow-y:auto;padding:0 10px 10px;"></div>
            </div>
            <!-- Field mode -->
            <div id="mode-field" style="display:none;flex:1;flex-direction:column;overflow:hidden;">
                <div style="padding:6px 10px;display:flex;gap:6px;">
                    <select id="field-select" onchange="TechInd.selectField()" style="flex:1;min-width:0;">
                        <option value="">— 加载中 —</option>
                    </select>
                </div>
                <div style="padding:2px 10px;" class="info-bar">
                    <span id="field-info-text">选择指标看排名</span>
                </div>
                <div id="field-rank-table" style="flex:1;overflow-y:auto;padding:0 8px;"></div>
            </div>
            <!-- Compare mode -->
            <div id="mode-compare" style="display:none;flex:1;flex-direction:column;overflow:hidden;">
                <div style="padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;">
                    <div style="display:flex;gap:4px;align-items:center;">
                        <span style="color:var(--text-dim);font-size:10px;">已选股票:</span>
                        <span id="ti-compare-stocks" style="color:var(--text-micro);font-size:10px;flex:1;">(空)</span>
                        <button onclick="TechInd.showAddStockDialog()" style="background:transparent;border:1px solid var(--accent-blue);color:var(--accent-blue);padding:3px 8px;border-radius:3px;cursor:pointer;font-size:9px;">+添加</button>
                    </div>
                    <div style="display:flex;gap:4px;align-items:center;">
                        <span style="color:var(--text-dim);font-size:10px;">已选指标:</span>
                        <span id="ti-compare-inds" style="color:var(--text-micro);font-size:10px;flex:1;">(空)</span>
                        <button onclick="TechInd.showAddIndicatorDialog()" style="background:transparent;border:1px solid var(--accent-gold);color:var(--accent-gold);padding:3px 8px;border-radius:3px;cursor:pointer;font-size:9px;">+添加</button>
                    </div>
                    <button onclick="TechInd.runComparison()" style="width:100%;background:transparent;border:1px solid var(--accent-green);color:var(--accent-green);padding:6px;border-radius:4px;cursor:pointer;font-size:11px;">
                        <i class="fas fa-chart-bar"></i> 运行比较
                    </button>
                    <div id="ti-compare-result" style="flex:1;overflow-y:auto;font-size:10px;color:var(--text-micro);padding:4px 0;">
                        选择股票和指标后点击运行比较
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right: Chart -->
    <div class="right-panel">
        <div class="panel" style="flex:1;display:flex;flex-direction:column;">
            <div class="panel-header" style="flex-wrap:wrap;">
                <span class="panel-title" id="chart-title">指标时间序列</span>
                <span style="font-size:10px;color:var(--text-micro);margin-left:auto;" id="chart-info"></span>
            </div>
            <div class="chart-container" id="main-chart"></div>
        </div>
    </div>
</div>
</main>
</div>

<script src="js/framework/api.js"></script>
<script src="js/framework/modal.js"></script>
<script src="js/framework/task_monitor.js"></script>
<script src="js/framework/markdown.js"></script>
<script src="js/framework/indicator_compute.js"></script>
<script src="js/ui.js"></script>
<script src="js/common.js"></script>
<script src="js/tech_indicators.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() { TechInd.init(); });
window.refreshPageData = function() {};
</script>
</body>
</html>
