<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AIStock | 执行历史审计</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-page-id="tasks_history">
    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="top-bar"></div>

            <div class="workspace" style="grid-template-columns: 1fr;">
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">AUDIT LOGS (HISTORY)</span>
                        <div style="display: flex; gap: 10px;">
                            <button class="btn-action" onclick="clearHistory(7)">清理 7 天前记录</button>
                            <button class="btn-action" id="bulk-delete" style="display:none; border-color: var(--accent-red); color: var(--accent-red);" onclick="bulkDelete()">删除选中</button>
                        </div>
                    </div>
                    <div class="panel-body">
                        <table>
                            <thead>
                                <tr>
                                    <th><input type="checkbox" id="select-all"></th>
                                    <th>启动时间</th>
                                    <th>任务类型</th>
                                    <th>状态</th>
                                    <th>耗时</th>
                                    <th>执行结论</th>
                                    <th style="text-align: center;">审计</th>
                                </tr>
                            </thead>
                            <tbody id="history-list"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 详情弹窗 (保持原逻辑但应用新样式) -->
    <div id="overlay" style="display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 9999;"></div>
    <div id="detail-modal" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 700px; background: #111; border: 1px solid var(--border-color); border-radius: 12px; z-index: 10000; padding: 25px;">
        <h3 id="modal-title" style="margin-top: 0;">任务审计详情</h3>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">
        <p style="font-size: 11px; color: var(--text-micro);">启动参数 (PARAMS)</p>
        <pre id="modal-params" style="background: #000; padding: 15px; border-radius: 6px; font-size: 12px; font-family: var(--font-mono); color: #888; overflow-x: auto;"></pre>
        <p style="font-size: 11px; color: var(--text-micro);">执行结果 (RESULT_MSG)</p>
        <pre id="modal-result" style="background: #000; padding: 15px; border-radius: 6px; font-size: 12px; font-family: var(--font-mono); color: var(--accent-blue); overflow-x: auto;"></pre>
        <div style="text-align: right; margin-top: 25px;">
            <button class="btn-action btn-primary" onclick="closeModal()">关闭审计</button>
        </div>
    </div>

    <script src="js/ui.js"></script>
    <script src="js/common.js"></script>
    <script>
        let allHistory = [];

        async function loadHistory() {
            const res = await fetch('/api/system/tasks/history');
            allHistory = await res.json();
            const list = document.getElementById('history-list');
            list.innerHTML = allHistory.map(h => {
                const statusColor = h.status === 'SUCCESS' ? 'var(--accent-green)' : (h.status === 'FAILED' ? 'var(--accent-red)' : 'var(--text-micro)');
                return `
                    <tr>
                        <td><input type="checkbox" class="record-check" value="${h.id}"></td>
                        <td style="font-family: var(--font-mono); font-size: 12px;">${new Date(h.start_time).toLocaleString()}</td>
                        <td><span style="font-weight: 600;">${h.task_code}</span></td>
                        <td><span style="color: ${statusColor}; font-weight: bold; font-size: 11px;">● ${h.status}</span></td>
                        <td>${h.end_time ? ((new Date(h.end_time) - new Date(h.start_time))/1000).toFixed(1) + 's' : '-'}</td>
                        <td style="max-width:250px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size: 12px; color: var(--text-dim);">
                            ${h.result_msg || '-'}
                        </td>
                        <td style="text-align: center;">
                            <button class="btn-action" onclick="showDetail('${h.id}')">审计详情</button>
                        </td>
                    </tr>
                `;
            }).join('');
            
            document.querySelectorAll('.record-check').forEach(c => c.onchange = updateBulkBtn);
        }

        function showDetail(id) {
            const h = allHistory.find(item => item.id === id);
            if (!h) return;
            document.getElementById('modal-title').innerText = `任务审计: ${h.task_code}`;
            document.getElementById('modal-params').innerText = JSON.stringify(h.params, null, 2);
            document.getElementById('modal-result').innerText = h.result_msg || '无结论';
            document.getElementById('detail-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('detail-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        function updateBulkBtn() {
            const checkedCount = document.querySelectorAll('.record-check:checked').length;
            document.getElementById('bulk-delete').style.display = checkedCount > 0 ? 'inline-block' : 'none';
        }

        async function clearHistory(days) {
            if (!confirm(`确定要永久删除 ${days} 天前的所有历史记录吗？`)) return;
            const res = await fetch(`/api/system/tasks/history?days_ago=${days}`, { method: 'DELETE' });
            if (res.ok) loadHistory();
        }

        async function bulkDelete() {
            const ids = Array.from(document.querySelectorAll('.record-check:checked')).map(c => c.value);
            if (!confirm(`确定要删除选中的 ${ids.length} 条记录吗？`)) return;
            const res = await fetch(`/api/system/tasks/history?${ids.map(id => 'ids=' + id).join('&')}`, { method: 'DELETE' });
            if (res.ok) loadHistory();
        }

        document.getElementById('select-all').onchange = (e) => {
            document.querySelectorAll('.record-check').forEach(c => c.checked = e.target.checked);
            updateBulkBtn();
        };

        loadHistory();
    </script>
</body>
</html>
