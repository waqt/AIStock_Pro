<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AIStock | 任务定义注册</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-page-id="tasks_registry">
    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="top-bar"></div>

            <div class="workspace" style="grid-template-columns: 1fr;">
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">SYSTEM TASK REGISTRY</span>
                    </div>
                    <div class="panel-body">
                        <table id="definitions-table">
                            <thead>
                                <tr>
                                    <th>任务名称 / 描述</th>
                                    <th>标识符 (Code)</th>
                                    <th>调度计划 (CRON)</th>
                                    <th>状态</th>
                                    <th style="text-align: center;">操作</th>
                                </tr>
                            </thead>
                            <tbody id="definitions-list"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/ui.js"></script>
    <script src="js/common.js"></script>
    <script>
        async function loadDefinitions() {
            const res = await fetch('/api/system/tasks/definitions');
            const data = await res.json();
            const list = document.getElementById('definitions-list');
            list.innerHTML = data.map(d => `
                <tr>
                    <td>
                        <div style="font-weight:600">${d.name}</div>
                        <div style="font-size:11px; color:var(--text-micro); margin-top:4px;">${d.description || '无描述'}</div>
                    </td>
                    <td><span style="font-family: var(--font-mono); font-size:11px;">${d.code}</span></td>
                    <td>
                        <input type="text" id="cron-${d.code}" value="${d.cron_expr || ''}" 
                               style="background: #000; border: 1px solid var(--border-color); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; width: 120px;"
                               placeholder="Manual Only">
                        <button class="btn-action" style="padding: 4px 8px;" onclick="updateCron('${d.code}')"><i class="fas fa-save"></i></button>
                    </td>
                    <td>
                        <span style="color: ${d.is_enabled ? 'var(--accent-green)' : 'var(--accent-red)'}; font-size: 11px;">
                            ${d.is_enabled ? '● ENABLED' : '○ DISABLED'}
                        </span>
                    </td>
                    <td style="text-align: center;">
                        <button class="btn-action btn-primary" onclick="triggerTask('${d.code}')"><i class="fas fa-play"></i> 立即启动</button>
                    </td>
                </tr>
            `).join('');
        }

        async function updateCron(code) {
            const cron = document.getElementById(`cron-${code}`).value;
            const res = await fetch(`/api/system/tasks/definitions/${code}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cron_expr: cron })
            });
            if (res.ok) alert("调度计划已更新");
        }

        async function triggerTask(code) {
            const paramsJson = prompt("请输入执行参数 (JSON, 可选)", "{}");
            if (paramsJson === null) return;
            try {
                const params = JSON.parse(paramsJson);
                const res = await fetch('/api/system/tasks/executions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task_code: code, params: params })
                });
                if (res.ok) alert("任务启动成功，请查看右下角监控");
            } catch (e) { alert("解析错误: " + e.message); }
        }

        loadDefinitions();
    </script>
</body>
</html>
