<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIStock | AI 投研</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .research-input { display: flex; gap: 10px; margin-bottom: 16px; }
        .research-input input { flex: 1; background: #000; border: 1px solid var(--border-color); color: #fff; padding: 10px 14px; border-radius: 4px; font-size: 13px; }
        .step-progress { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .step-badge { padding: 4px 10px; border-radius: 3px; font-size: 10px; background: var(--border-color); color: var(--text-micro); }
        .step-badge.active { background: var(--accent-blue); color: #000; }
        .step-badge.done { background: rgba(46,213,115,0.15); color: var(--accent-green); }
        .result-block { margin-bottom: 16px; }
        .result-block pre { font-size: 11px; line-height: 1.6; white-space: pre-wrap; color: var(--text-dim); max-height: 300px; overflow-y: auto; }
        .score-badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-weight: 700; }
        .score-high { background: rgba(46,213,115,0.15); color: var(--accent-green); }
        .summary-box { background: rgba(255,255,255,0.03); border: 1px solid var(--accent-gold); padding: 16px; border-radius: 6px; font-size: 13px; line-height: 1.8; }
        .summary-box h2,.summary-box h3 { color: var(--accent-gold); font-size: 14px; margin: 12px 0 6px; }
        .summary-box table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 11px; }
        .summary-box th { text-align: left; color: var(--text-micro); padding: 4px 8px; border-bottom: 1px solid var(--border-thin); }
        .summary-box td { padding: 4px 8px; color: var(--text-dim); border-bottom: 1px solid var(--border-thin); }
        .chain-layer { background: rgba(255,255,255,0.02); border: 1px solid var(--border-thin); border-radius: 4px; padding: 12px; margin-bottom: 8px; }
        .chain-layer .tier-badge { display: inline-block; padding: 1px 6px; border-radius: 2px; font-size: 10px; }
        .tier-up { background: rgba(112,161,255,0.15); color: var(--accent-blue); }
        .tier-mid { background: rgba(255,165,2,0.15); color: var(--accent-gold); }
        .tier-down { background: rgba(46,213,115,0.15); color: var(--accent-green); }
        /* V3.0 core stocks table */
        .core-stocks-table { width: 100%; border-collapse: collapse; font-size: 11px; font-family: var(--font-mono); }
        .core-stocks-table th { background: rgba(255,255,255,0.04); color: var(--text-micro); padding: 6px 8px; text-align: left; border-bottom: 2px solid var(--border-color); white-space: nowrap; position: sticky; top: 0; }
        .core-stocks-table td { padding: 6px 8px; border-bottom: 1px solid var(--border-thin); color: var(--text-dim); white-space: nowrap; }
        .core-stocks-table tr:hover td { background: rgba(255,255,255,0.03); }
        .core-stocks-table .stock-name { color: #fff; font-weight: 600; font-family: var(--font-main); }
        .core-stocks-table .moat-tag { display: inline-block; padding: 1px 5px; border-radius: 2px; font-size: 9px; }
        .moat-tech { background: rgba(112,161,255,0.15); color: var(--accent-blue); }
        .moat-oligopoly { background: rgba(46,213,115,0.15); color: var(--accent-green); }
        .moat-substitute { background: rgba(255,165,2,0.15); color: var(--accent-gold); }
        .moat-standard { background: rgba(255,107,107,0.15); color: var(--accent-red); }
        .gap-bar { display: inline-block; height: 3px; border-radius: 2px; min-width: 4px; background: var(--border-color); vertical-align: middle; margin-right: 4px; }
        .risk-tag { display: inline-block; padding: 1px 6px; border-radius: 2px; font-size: 10px; margin: 2px; }
        .risk-high { background: rgba(255,107,107,0.15); color: var(--accent-red); }
        .risk-mid { background: rgba(255,165,2,0.15); color: var(--accent-gold); }
        .risk-low { background: rgba(46,213,115,0.15); color: var(--accent-green); }
        .peer-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--border-thin); font-size: 11px; }
        .watchlist-item { display: inline-block; padding: 2px 8px; margin: 2px; border-radius: 3px; font-size: 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-thin); color: var(--text-dim); }
    </style>
</head>
<body data-page-id="research">
    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="top-bar"></div>

            <div class="workspace" style="grid-template-columns: 380px 1fr; gap: 16px; padding: 16px;">

                <!-- 左: 查询 + 步骤进度 -->
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <!-- 每日扫描 -->
                    <div class="panel" style="border-left: 3px solid var(--accent-gold);">
                        <div class="panel-header"><span class="panel-title">每日市场扫描</span></div>
                        <div class="panel-body" style="text-align:center;">
                            <div style="font-size:11px;color:var(--text-dim);margin-bottom:10px;">AI 自动扫宏观+资金流+持仓, 发现今日最热赛道</div>
                            <button class="btn-action" onclick="startScan()" id="btn-scan" style="width:100%;justify-content:center;border-color:var(--accent-gold);color:var(--accent-gold);font-size:14px;padding:12px;">
                                <i class="fas fa-satellite"></i> 开始扫描
                            </button>
                            <div id="scan-status" style="font-size:10px;color:var(--text-micro);margin-top:6px;"></div>
                        </div>
                    </div>

                    <!-- 扫描结果: 赛道卡片 -->
                    <div class="panel" id="panel-scan-result" style="display:none;">
                        <div class="panel-header"><span class="panel-title">热门赛道</span></div>
                        <div class="panel-body" id="content-scan-industries"></div>
                    </div>

                    <div class="panel">
                        <div class="panel-header"><span class="panel-title">深度供应链分析</span></div>
                        <div class="panel-body">
                            <div class="research-input">
                                <input type="text" id="research-industry" placeholder="行业或主题 (如: AI算力, 新能源...)" value="AI算力">
                            </div>
                            <div class="research-input">
                                <input type="text" id="research-codes" placeholder="A股代码 (逗号分隔)" value="">
                            </div>
                            <button class="btn-action btn-primary" onclick="startResearch()" id="btn-research" style="width:100%; justify-content:center;">
                                <i class="fas fa-brain"></i> 供应链下钻
                            </button>
                            <div style="font-size: 10px; color: var(--text-micro); margin-top: 8px;">
                                5步: 景气信号→供应链图谱→供需瓶颈→核心标的→估值
                            </div>
                        </div>
                    </div>

                    <!-- 步骤进度 V3.0 -->
                    <div class="panel">
                        <div class="panel-header"><span class="panel-title">分析进度</span></div>
                        <div class="panel-body">
                            <div class="step-progress" id="step-progress">
                                <span class="step-badge">Phase1 迭代深研</span>
                                <span class="step-badge">自检补搜</span>
                                <span class="step-badge">Phase2 结构化报告</span>
                            </div>
                            <div id="step-status" style="font-size:11px;color:var(--text-dim);">等待查询...</div>
                        </div>
                    </div>

                    <!-- 行业标签 -->
                    <div class="panel">
                        <div class="panel-header"><span class="panel-title">当前分析</span></div>
                        <div class="panel-body" style="text-align:center;">
                            <div id="current-industry" style="font-size:16px;font-weight:700;color:var(--text-dim);">—</div>
                            <div id="stock-count" style="font-size:10px;color:var(--text-micro);margin-top:4px;"></div>
                        </div>
                    </div>

                    <!-- 历史研报 -->
                    <div class="panel">
                        <div class="panel-header">
                            <span class="panel-title">历史研报</span>
                            <button onclick="loadReportList()" style="background:none;border:none;color:var(--text-micro);cursor:pointer;font-size:10px;"><i class="fas fa-sync-alt"></i></button>
                        </div>
                        <div class="panel-body" id="content-report-history" style="max-height:400px;overflow-y:auto;">
                            <div style="color:var(--text-micro);font-size:11px;text-align:center;">加载中...</div>
                        </div>
                    </div>
                </div>

                <!-- 右: 结果展示 -->
                <div style="display: flex; flex-direction: column; gap: 16px;">
                    <!-- Summary -->
                    <div class="panel" id="panel-summary" style="display:none;">
                        <div class="panel-header"><span class="panel-title">核心结论</span></div>
                        <div class="panel-body">
                            <div class="summary-box" id="content-summary"></div>
                        </div>
                    </div>

                    <!-- V3.0 核心标的表 -->
                    <div class="panel" id="panel-core-stocks" style="display:none;">
                        <div class="panel-header">
                            <span class="panel-title">核心标的</span>
                            <span style="font-size:10px;color:var(--text-micro);" id="core-stocks-count"></span>
                        </div>
                        <div class="panel-body" style="overflow-x:auto;max-height:500px;overflow-y:auto;" id="content-core-stocks"></div>
                    </div>

                    <!-- 供应链图谱 V3.0 -->
                    <div class="panel" id="panel-chain" style="display:none;">
                        <div class="panel-header"><span class="panel-title">供应链下钻 (L1→L4)</span></div>
                        <div class="panel-body" id="content-chain"></div>
                    </div>

                    <!-- 时间维度 -->
                    <div class="panel" id="panel-temporal" style="display:none;">
                        <div class="panel-header"><span class="panel-title">景气周期预测</span></div>
                        <div class="panel-body" id="content-temporal"></div>
                    </div>

                    <!-- 全球对标 -->
                    <div class="panel" id="panel-peers" style="display:none;">
                        <div class="panel-header"><span class="panel-title">全球对标估值</span></div>
                        <div class="panel-body" id="content-peers"></div>
                    </div>

                    <!-- 风险提示 -->
                    <div class="panel" id="panel-risks" style="display:none;">
                        <div class="panel-header"><span class="panel-title">风险警示</span></div>
                        <div class="panel-body" id="content-risks"></div>
                    </div>

                    <!-- 跟踪指标 -->
                    <div class="panel" id="panel-watchlist" style="display:none;">
                        <div class="panel-header"><span class="panel-title">后续跟踪指标</span></div>
                        <div class="panel-body" id="content-watchlist"></div>
                    </div>

                    <!-- 加载中 -->
                    <div class="panel" id="panel-loading" style="display:none;">
                        <div class="panel-body" style="text-align:center;padding:40px;">
                            <i class="fas fa-spinner fa-spin fa-2x" style="color:var(--accent-blue);margin-bottom:12px;"></i>
                            <div style="color:var(--text-dim);font-size:12px;">AI 正在深度分析供应链...<br><small id="loading-step" style="color:var(--text-micro);">这可能需要 60-90 秒</small></div>
                        </div>
                    </div>

                    <!-- 空状态 -->
                    <div class="panel" id="panel-empty">
                        <div class="panel-body" style="text-align:center;padding:60px;">
                            <div style="font-size:40px;margin-bottom:12px;opacity:0.3;">&#129504;</div>
                            <div style="color:var(--text-dim);font-size:12px;">
                                输入行业关键词, AI 将从全球供应链视角分析:<br>
                                高景气信号 → 供应链结构 → 供需瓶颈 → 垄断标的 → 估值潜力
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/framework/api.js"></script>
    <script src="js/framework/modal.js"></script>
    <script src="js/framework/task_monitor.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/common.js"></script>
    <script>
        const STEPS_V3 = ['Phase1 迭代深研', '自检补搜', 'Phase2 结构化报告'];

        function setStep(idx, status) {
            const badges = document.querySelectorAll('#step-progress .step-badge');
            for (let i = 0; i < badges.length; i++) {
                badges[i].classList.remove('active', 'done');
                if (i < idx - 1) badges[i].classList.add('done');
                else if (i === idx - 1) badges[i].classList.add('active');
            }
            document.getElementById('step-status').textContent = status || `${STEPS_V3[idx-1] || ''}...`;
        }

        function hideAllPanels() {
            ['panel-summary','panel-core-stocks','panel-chain','panel-temporal','panel-peers','panel-risks','panel-watchlist'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });
        }

        // ── 每日扫描 ──
        async function startScan() {
            const btn = document.getElementById('btn-scan');
            const status = document.getElementById('scan-status');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 扫描中...';
            status.textContent = '正在收集市场信号...';

            try {
                const res = await fetch(`${API_BASE}/research/scan`, {
                    method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}'
                });
                const result = await res.json();
                if (!result.success) { Modal.alert('扫描失败', result.detail || ''); return; }
                const d = result.data;

                const industries = d.hot_industries || [];
                const panel = document.getElementById('panel-scan-result');
                const content = document.getElementById('content-scan-industries');
                panel.style.display = '';
                if (Array.isArray(industries) && industries.length) {
                    content.innerHTML = industries.map((ind, idx) => `
                        <div style="padding:10px;border-bottom:1px solid var(--border-thin);cursor:pointer;${idx===0?'border-left:3px solid var(--accent-gold);padding-left:8px;':''}"
                             onclick="document.getElementById('research-industry').value='${(ind.name||ind.industry||'').replace(/'/g,"\\'")}';startResearch();">
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <span style="font-weight:600;">${idx+1}. ${ind.name || ind.industry || ''}</span>
                                <span class="score-badge score-high">${ind.score || '?'}/10</span>
                            </div>
                            <div style="font-size:11px;color:var(--text-dim);margin-top:4px;">${ind.reason || ''}</div>
                            ${ind.a_stock_codes ? `<div style="font-size:10px;color:var(--accent-blue);margin-top:4px;">关注: ${ind.a_stock_codes.join(', ')}</div>` : ''}
                        </div>
                    `).join('');
                } else {
                    content.innerHTML = '<div style="color:var(--text-micro);padding:12px;">扫描未识别到热门赛道, 请稍后重试</div>';
                }

                if (d.briefing) {
                    document.getElementById('panel-summary').style.display = '';
                    document.getElementById('content-summary').innerHTML = mdToHtml(d.briefing);
                }

                saveCache(d);
                status.textContent = '扫描完成';
                document.getElementById('panel-empty').style.display = 'none';
            } catch (e) {
                status.textContent = '扫描异常: ' + e.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-satellite"></i> 开始扫描';
            }
        }

        // ── V3.0 供应链下钻 ──
        async function startResearch() {
            const industry = document.getElementById('research-industry').value.trim();
            if (!industry) { Modal.alert('提示', '请输入行业或主题'); return; }

            const codes = document.getElementById('research-codes').value.split(',').map(s => s.trim()).filter(Boolean);
            const btn = document.getElementById('btn-research');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 分析中...';

            document.getElementById('panel-empty').style.display = 'none';
            document.getElementById('panel-loading').style.display = '';
            document.getElementById('current-industry').textContent = industry;
            document.getElementById('stock-count').textContent = '';
            hideAllPanels();

            try {
                setStep(1, 'Phase 1: 搜索 → LLM分析 → 自检缺口...');
                document.getElementById('loading-step').textContent = 'Phase 1/2: 迭代深研 (3轮搜索→分析→自检)';

                const res = await fetch(`${API_BASE}/research/supply-chain`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: industry, stock_codes: codes, industry, include_portfolio: true })
                });
                const result = await res.json();
                if (!result.success) { Modal.alert('分析失败', result.detail || JSON.stringify(result)); return; }

                const d = result.data;

                // V3.0 or legacy format detection
                const isV3 = d.core_stocks || d.supply_chain_map;

                if (isV3) {
                    setStep(3, 'Phase 2: 结构化深度报告生成完成');
                    document.getElementById('loading-step').textContent = '报告生成完成';
                    renderV3(d);
                } else {
                    // Legacy format fallback
                    setStep(5, 'Legacy 分析完成');
                    document.getElementById('loading-step').textContent = '分析完成';
                    renderLegacy(d);
                }

                document.getElementById('stock-count').textContent =
                    (d.core_stocks || []).length ? `锁定 ${d.core_stocks.length} 只核心标的` : '';

                saveCache(d);
            } catch (e) {
                Modal.alert('分析异常', e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-brain"></i> 供应链下钻';
                document.getElementById('panel-loading').style.display = 'none';
            }
        }

        // ═══ V3.0 渲染 ═══════════════════════════════════

        function renderV3(d) {
            // Summary
            if (d.summary) {
                document.getElementById('panel-summary').style.display = '';
                document.getElementById('content-summary').innerHTML = mdToHtml(d.summary);
            }

            // Core Stocks (the main feature)
            if (d.core_stocks && d.core_stocks.length) {
                renderCoreStocks(d.core_stocks);
            }

            // Supply Chain Map
            if (d.supply_chain_map && d.supply_chain_map.length) {
                renderSupplyChainMap(d.supply_chain_map);
            }

            // Temporal
            if (d.temporal && d.temporal.length) {
                renderTemporalV3(d.temporal);
            }

            // Valuation Peers
            if (d.valuation_peers && d.valuation_peers.length) {
                renderPeers(d.valuation_peers);
            }

            // Risk Alerts
            if (d.risk_alerts && d.risk_alerts.length) {
                renderRisks(d.risk_alerts);
            }

            // Watchlist
            if (d.watchlist && d.watchlist.length) {
                renderWatchlist(d.watchlist);
            }
        }

        function renderCoreStocks(stocks) {
            document.getElementById('panel-core-stocks').style.display = '';
            document.getElementById('core-stocks-count').textContent = `(${stocks.length} 只)`;

            const moatClass = {
                '技术垄断': 'moat-tech', '寡头格局': 'moat-oligopoly',
                '国产替代': 'moat-substitute', '标准制定': 'moat-standard'
            };

            const rows = stocks.map(s => {
                const upside = s.upside || '';
                const upsideColor = upside.includes('-') ? 'var(--accent-red)' : 'var(--accent-green)';
                const moatType = s.moat_type || '';
                const mc = moatClass[moatType] || 'moat-tech';
                const scissorOk = (s.scissor_gap || {}).verdict || '';

                return `<tr>
                    <td style="color:var(--accent-blue);">${escHtml(s.code||'')}</td>
                    <td class="stock-name">${escHtml(s.name||'')}</td>
                    <td>${escHtml(s.revenue||'')}</td>
                    <td style="color:${(s.profit_growth||'').startsWith('-')?'var(--accent-red)':'var(--accent-green)'};">${escHtml(s.profit_growth||'')}</td>
                    <td>${escHtml(s.gross_margin||'')}</td>
                    <td>${escHtml(s.peer_pe||'')}</td>
                    <td>${escHtml(s.market_cap||'')}</td>
                    <td>${escHtml(s.target_mcap||'')}</td>
                    <td style="color:${upsideColor};">${escHtml(upside)}</td>
                    <td><span class="moat-tag ${mc}">${escHtml(moatType)}</span></td>
                    <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;" title="${escHtml(s.moat||'')}">${escHtml((s.moat||'').slice(0,30))}${(s.moat||'').length>30?'…':''}</td>
                    <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;" title="${escHtml(s.key_tech||'')}">${escHtml((s.key_tech||'').slice(0,25))}${(s.key_tech||'').length>25?'…':''}</td>
                    <td>${escHtml(s.global_peer||'')}</td>
                    <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;" title="${escHtml(s.risk||'')}">${escHtml((s.risk||'').slice(0,25))}${(s.risk||'').length>25?'…':''}</td>
                </tr>`;
            }).join('');

            document.getElementById('content-core-stocks').innerHTML = `
                <table class="core-stocks-table">
                    <thead><tr>
                        <th>代码</th><th>名称</th><th>营收</th><th>利润增速</th><th>毛利率</th><th>对标PE</th>
                        <th>市值</th><th>目标市值</th><th>上涨空间</th><th>护城河</th>
                        <th>护城河原因</th><th>核心技术</th><th>全球对标</th><th>风险</th>
                    </tr></thead>
                    <tbody>${rows}</tbody>
                </table>`;
        }

        function renderSupplyChainMap(map) {
            document.getElementById('panel-chain').style.display = '';
            const gapColors = {10:'var(--accent-red)',9:'var(--accent-red)',8:'var(--accent-gold)',7:'var(--accent-gold)',6:'var(--accent-blue)'};
            const levelNames = {1:'L1 显性瓶颈', 2:'L2 工艺瓶颈', 3:'L3 材料瓶颈', 4:'L4 设备/测试瓶颈'};

            document.getElementById('content-chain').innerHTML = map.map(m => {
                const gs = m.gap_score || 0;
                const gapColor = gapColors[gs] || 'var(--text-dim)';
                const barWidth = Math.min(gs * 10, 100);
                return `<div class="chain-layer" style="${gs>=8?'border-left:3px solid var(--accent-red);':''}">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <span>
                            <span style="display:inline-block;padding:1px 6px;border-radius:2px;font-size:9px;background:rgba(255,165,2,0.15);color:var(--accent-gold);">${levelNames[m.level]||'L'+m.level}</span>
                            <strong style="margin-left:4px;">${escHtml(m.name||'')}</strong>
                        </span>
                        <span style="display:flex;align-items:center;gap:6px;">
                            <span class="gap-bar" style="width:${barWidth}px;background:${gapColor};"></span>
                            <span class="score-badge" style="color:${gapColor};background:rgba(255,165,2,0.1);font-size:10px;">预期差 ${gs}/10</span>
                        </span>
                    </div>
                    ${m.gap_reason ? `<div style="font-size:10px;color:var(--accent-gold);margin-top:4px;">${escHtml(m.gap_reason)}</div>` : ''}
                </div>`;
            }).join('');
        }

        function renderTemporalV3(temporal) {
            if (!temporal.length || !temporal[0].segment) return;
            document.getElementById('panel-temporal').style.display = '';
            document.getElementById('content-temporal').innerHTML = `
                <div style="overflow-x:auto;">
                <table style="width:100%;font-size:10px;">
                <tr style="color:var(--text-micro);">
                    <th>环节</th><th>需求增速</th><th>供需缺口</th><th>缺口填补</th><th>产能过剩风险</th><th>热度</th>
                </tr>
                ${temporal.map(t => `
                <tr>
                    <td style="font-weight:600;">${escHtml(t.segment||'')}</td>
                    <td>${escHtml(t.demand_growth||'?')}</td>
                    <td style="color:var(--accent-red);">${escHtml(t.supply_gap||'?')}</td>
                    <td>${escHtml(t.gap_filled||'?')}</td>
                    <td style="color:${(t.overcapacity_risk||'').includes('202')?'var(--accent-gold)':'var(--text-dim)'};">${escHtml(t.overcapacity_risk||'暂无')}</td>
                    <td style="color:${t.heat_level==='过热'?'var(--accent-red)':(t.heat_level==='偏热'?'var(--accent-gold)':'var(--accent-green)')};">${escHtml(t.heat_level||'?')}</td>
                </tr>`).join('')}
                </table></div>`;
        }

        function renderPeers(peers) {
            document.getElementById('panel-peers').style.display = '';
            document.getElementById('content-peers').innerHTML = peers.map(p => `
                <div class="peer-row">
                    <span><strong>${escHtml(p.name||'')}</strong> <span style="color:var(--text-micro);font-size:10px;">${escHtml(p.code||'')} ${escHtml(p.exchange||'')}</span></span>
                    <span style="color:var(--text-dim);">PE ${p.pe||'?'}x | PS ${p.ps||'?'}x</span>
                    <span style="font-size:10px;color:var(--text-micro);">${escHtml(p.relevance||'')}</span>
                </div>
            `).join('');
        }

        function renderRisks(risks) {
            document.getElementById('panel-risks').style.display = '';
            document.getElementById('content-risks').innerHTML = risks.map(r => {
                const sevClass = r.severity === '高' ? 'risk-high' : (r.severity === '中' ? 'risk-mid' : 'risk-low');
                return `<span class="risk-tag ${sevClass}">${escHtml(r.type||'')}: ${escHtml(r.description||'')}</span>`;
            }).join(' ');
        }

        function renderWatchlist(items) {
            document.getElementById('panel-watchlist').style.display = '';
            document.getElementById('content-watchlist').innerHTML = items.map(item =>
                `<span class="watchlist-item">${escHtml(item)}</span>`
            ).join(' ');
        }

        // ═══ Legacy 兼容 ═════════════════════════════════

        function renderLegacy(d) {
            if (d.prosperity_signals) {
                const p = d.prosperity_signals;
                document.getElementById('current-industry').textContent =
                    (p.hot_segments||[]).join(' / ') || d.industry || '';
                document.getElementById('stock-count').textContent = '景气评分: ' + (p.prosperity_score||'?') + '/10';
            }
            if (d.summary) {
                document.getElementById('panel-summary').style.display = '';
                document.getElementById('content-summary').innerHTML = mdToHtml(d.summary);
            }
            if (d.supply_chain) {
                const ls = d.supply_chain.recursive_layers || d.supply_chain.layers || [];
                if (ls.length) {
                    document.getElementById('panel-chain').style.display = '';
                    const gc = {10:'var(--accent-red)',9:'var(--accent-red)',8:'var(--accent-gold)',7:'var(--accent-gold)'};
                    document.getElementById('content-chain').innerHTML = ls.map(l => `
                        <div class="chain-layer" style="${(l.expectation_gap_score||0)>=8?'border-left:3px solid var(--accent-red);':''}">
                            <div style="display:flex;justify-content:space-between;">
                                <span><span style="display:inline-block;padding:1px 6px;border-radius:2px;font-size:9px;background:rgba(255,165,2,0.15);color:var(--accent-gold);">L${l.level||'?'}</span> <strong>${escHtml(l.name||'')}</strong></span>
                                ${l.expectation_gap_score?`<span class="score-badge" style="color:${gc[l.expectation_gap_score]||'var(--text-dim)'};">预期差 ${l.expectation_gap_score}/10</span>`:''}
                            </div>
                            <div style="font-size:10px;color:var(--text-dim);margin-top:4px;">${escHtml(l.barriers||'')}</div>
                            ${l.gap_reason?`<div style="font-size:10px;color:var(--accent-gold);margin-top:2px;">${escHtml(l.gap_reason)}</div>`:''}
                            ${l.a_share_peers&&l.a_share_peers.length?`<div style="font-size:9px;color:var(--accent-blue);">A股: ${l.a_share_peers.map(p=>escHtml(p.name||p.code)).join(', ')}</div>`:''}
                        </div>`).join('');
                }
            }
            if (d.temporal) {
                const tl = Array.isArray(d.temporal) ? d.temporal : [];
                if (tl.length && tl[0].segment) renderTemporalV3(tl);
            }
        }

        // ═══ 工具函数 ═══════════════════════════════════

        function mdToHtml(md) {
            return md
                .replace(/### (.+)/g, '<h3>$1</h3>')
                .replace(/## (.+)/g, '<h2>$1</h2>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function escHtml(s) {
            if (!s) return '';
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // ── 持久化 ──
        const CACHE_KEY = 'aistock_research';
        function saveCache(d) { try { localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(),d})); } catch(e) {} }
        function loadCache() { try { const r = localStorage.getItem(CACHE_KEY); return r ? JSON.parse(r).d : null; } catch(e) { return null; } }

        function restoreView(d) {
            document.getElementById('panel-empty').style.display = 'none';
            if (d.hot_industries) {
                const c = document.getElementById('content-scan-industries');
                document.getElementById('panel-scan-result').style.display = '';
                c.innerHTML = d.hot_industries.map((ind,i) => `
                    <div style="padding:10px;border-bottom:1px solid var(--border-thin);cursor:pointer;${i===0?'border-left:3px solid var(--accent-gold);padding-left:8px;':''}"
                         onclick="document.getElementById('research-industry').value='${(ind.name||ind.industry||'').replace(/'/g,"\\'")}';startResearch();">
                        <div style="display:flex;justify-content:space-between;"><span style="font-weight:600;">${i+1}. ${ind.name||ind.industry||''}</span><span class="score-badge score-high">${ind.score||'?'}/10</span></div>
                        <div style="font-size:11px;color:var(--text-dim);margin-top:4px;">${ind.reason||''}</div>
                    </div>`).join('');
            }

            const isV3 = d.core_stocks || d.supply_chain_map;
            if (isV3) {
                renderV3(d);
                document.getElementById('current-industry').textContent = d.industry || '';
                document.getElementById('stock-count').textContent = (d.core_stocks||[]).length ? `锁定 ${d.core_stocks.length} 只标的` : '';
            } else if (d.supply_chain || d.bottleneck || d.temporal || d.briefing) {
                renderLegacy(d);
                if (d.briefing) {
                    document.getElementById('panel-summary').style.display = '';
                    document.getElementById('content-summary').innerHTML = mdToHtml(d.briefing);
                }
            }
        }

        // ── 历史研报 ──
        async function loadReportList() {
            const el = document.getElementById('content-report-history');
            try {
                const res = await fetch(`${API_BASE}/research/reports?limit=20`);
                const data = await res.json();
                const reports = data.data || [];
                if (!reports.length) {
                    el.innerHTML = '<div style="color:var(--text-micro);font-size:11px;text-align:center;">暂无历史研报</div>';
                    return;
                }
                el.innerHTML = reports.map(r => `
                    <div style="padding:8px;border-bottom:1px solid var(--border-thin);cursor:pointer;display:flex;justify-content:space-between;align-items:center;"
                         onclick="loadReportById('${r.report_id}')">
                        <div style="flex:1;min-width:0;">
                            <div style="font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(r.industry||'未命名')}</div>
                            <div style="font-size:9px;color:var(--text-micro);">${escHtml(r.agent)} | ${(r.created_at||'').slice(0,16)} | ${r.stocks_count||0}只标的</div>
                        </div>
                        <button onclick="event.stopPropagation();deleteReport('${r.report_id}')"
                            style="background:none;border:none;color:var(--accent-red);cursor:pointer;font-size:10px;padding:2px 6px;"
                            title="删除"><i class="fas fa-trash"></i></button>
                    </div>
                `).join('');
            } catch(e) {
                el.innerHTML = '<div style="color:var(--text-micro);font-size:11px;">加载失败</div>';
            }
        }

        async function loadReportById(reportId) {
            try {
                const res = await fetch(`${API_BASE}/research/reports/${reportId}`);
                const data = await res.json();
                const report = data.data;
                if (!report) return;
                const d = report.data || {};
                hideAllPanels();
                document.getElementById('panel-empty').style.display = 'none';
                document.getElementById('current-industry').textContent = d.industry || report.industry || '';
                document.getElementById('stock-count').textContent = (d.core_stocks||[]).length ? (d.core_stocks.length + ' 只标的') : '';
                const isV3 = d.core_stocks || d.supply_chain_map;
                if (isV3) renderV3(d);
                else renderLegacy(d);
            } catch(e) {
                Modal.alert('加载失败', e.message);
            }
        }

        async function deleteReport(reportId) {
            const ok = await Modal.confirm('删除研报', '确定删除这份研报?');
            if (!ok) return;
            try {
                await fetch(`${API_BASE}/research/reports/${reportId}`, { method: 'DELETE' });
                loadReportList();
            } catch(e) {
                Modal.alert('删除失败', e.message);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const cache = loadCache();
                if (cache) { restoreView(cache); document.getElementById('scan-status').textContent = '已恢复上次分析'; }
            }, 300);
            setTimeout(loadReportList, 500);
        });

    </script>
</body>
</html>
