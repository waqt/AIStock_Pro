<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AIStock | 投研观察</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .workspace { display: flex; flex-direction: column; gap: 12px; padding: 14px; height: calc(100vh - 110px); }
        .obs-header { display: flex; align-items: center; gap: 10px; padding: 0 0 8px 0; flex-shrink: 0; }
        .obs-header select { background: #000; border: 1px solid var(--border-color); color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 12px; min-width: 300px; }
        .obs-header .btn { font-size: 11px; padding: 5px 14px; border-radius: 4px; cursor: pointer; border: none; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-success { background: #16a34a; color: #fff; }
        .btn-success:hover { background: #15803d; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: #ccc; }
        .btn-outline:hover { background: rgba(255,255,255,0.04); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .obs-stats { font-size: 11px; color: var(--text-micro); margin-left: auto; }

        .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .tabs .tab { padding: 7px 18px; font-size: 12px; cursor: pointer; color: var(--text-dim); border-bottom: 2px solid transparent; }
        .tabs .tab.active { color: #60a5fa; border-bottom-color: #60a5fa; }
        .tabs .tab:hover { color: #ccc; }

        .obs-content { flex: 1; overflow-y: auto; min-height: 0; }

        /* Table */
        .obs-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .obs-table th { text-align: left; padding: 6px 8px; color: var(--text-micro); font-weight: 500; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; background: #0a0a0a; }
        .obs-table td { padding: 5px 8px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: top; }
        .obs-table tr:hover td { background: rgba(255,255,255,0.02); }
        .obs-table .chk { width: 28px; text-align: center; }
        .obs-table .chk input { cursor: pointer; }

        .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 500; }
        .badge-step2 { background: rgba(96,165,250,0.15); color: #60a5fa; }
        .badge-step3 { background: rgba(52,211,153,0.15); color: #34d399; }
        .badge-step4 { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .badge-step5 { background: rgba(244,114,182,0.15); color: #f472b6; }
        .badge-step6 { background: rgba(168,85,247,0.15); color: #a855f7; }
        .badge-saved { background: rgba(22,163,74,0.15); color: #4ade80; font-size: 9px; }
        .badge-new { background: rgba(37,99,235,0.15); color: #60a5fa; font-size: 9px; }

        .dir-positive { color: #34d399; }
        .dir-negative { color: #f87171; }
        .dir-neutral { color: var(--text-dim); }

        .category-tag { font-size: 10px; color: var(--text-micro); }
        .title-text { color: #ddd; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .title-text:hover { white-space: normal; }

        .toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 0; flex-shrink: 0; }
        .toolbar .info { font-size: 11px; color: var(--text-dim); }

        /* Filter */
        .filter-bar { display: flex; align-items: center; gap: 8px; padding: 6px 0; flex-shrink: 0; flex-wrap: wrap; }
        .filter-bar select, .filter-bar input { background: #000; border: 1px solid var(--border-color); color: #fff; padding: 4px 8px; border-radius: 3px; font-size: 11px; }
        .filter-bar label { font-size: 10px; color: var(--text-micro); }

        .empty-state { text-align: center; padding: 40px; color: var(--text-dim); font-size: 13px; }
        .empty-state i { font-size: 32px; margin-bottom: 12px; opacity: 0.3; }

        .group-label { font-size: 10px; color: var(--text-micro); padding: 4px 8px; background: rgba(255,255,255,0.02); border-radius: 2px; margin: 4px 0; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .modal-box { background: #111; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-box h3 { font-size: 14px; color: #eee; margin-bottom: 10px; }
        .modal-box pre { font-size: 11px; color: #aaa; white-space: pre-wrap; background: #000; padding: 10px; border-radius: 4px; max-height: 400px; overflow-y: auto; }
        .modal-box .btn { margin-top: 12px; }
    </style>
</head>
<body data-page-id="observations">
<div class="app-container">
    <aside class="sidebar"></aside>
    <main class="main-content">
        <div class="top-bar"></div>
        <div class="workspace">
            <!-- Header: Run Selector + Actions -->
            <div class="obs-header">
                <select id="run-selector"><option value="">-- 选择投研项目 --</option></select>
                <button class="btn btn-primary" id="btn-extract" onclick="ExtractUI.extract()"><i class="fas fa-search"></i> 提取观察</button>
                <button class="btn btn-success" id="btn-save" onclick="ExtractUI.batchSave()" disabled><i class="fas fa-save"></i> 确认入库</button>
                <button class="btn btn-outline" onclick="ExtractUI.refreshSaved()"><i class="fas fa-sync"></i> 刷新</button>
                <span class="obs-stats" id="stats-display"></span>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <div class="tab active" data-tab="extract" onclick="ExtractUI.switchTab('extract')">待提取预览</div>
                <div class="tab" data-tab="saved" onclick="ExtractUI.switchTab('saved')">已入库观察</div>
                <div class="tab" data-tab="plans" onclick="ExtractUI.switchTab('plans')">监控计划</div>
                <div class="tab" data-tab="signals" onclick="ExtractUI.switchTab('signals')">信号事件 <span id="signal-badge" style="display:none;background:#ef4444;color:#fff;border-radius:8px;padding:0 6px;font-size:10px;margin-left:4px;">0</span></div>
            </div>

            <!-- Tab: Extract Preview -->
            <div class="obs-content" id="tab-extract">
                <div class="empty-state" id="extract-empty">
                    <i class="fas fa-eye"></i><br>
                    选择一个投研项目，点击「提取观察」预览可入库的观察事件
                </div>
                <div id="extract-table-wrap" style="display:none;">
                    <div class="toolbar">
                        <label><input type="checkbox" id="select-all" onchange="ExtractUI.toggleAll()"> 全选</label>
                        <span class="info" id="selection-info">已选 0 条</span>
                    </div>
                    <table class="obs-table" id="extract-table">
                        <thead>
                            <tr>
                                <th class="chk"></th>
                                <th style="width:48px;">Step</th>
                                <th style="width:50px;">级别</th>
                                <th>观察标题</th>
                                <th style="width:100px;">分类</th>
                                <th style="width:54px;">方向</th>
                                <th style="width:90px;">时间窗口</th>
                                <th style="width:80px;">行业/股票</th>
                                <th style="width:44px;">状态</th>
                            </tr>
                        </thead>
                        <tbody id="extract-tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- Tab: Monitor Plans -->
            <div class="obs-content" id="tab-plans" style="display:none;">
                <div class="filter-bar">
                    <button class="btn btn-primary" onclick="MonitorUI.generateFromReport()"><i class="fas fa-magic"></i> 生成监控计划</button>
                    <button class="btn btn-outline" onclick="MonitorUI.checkAll()"><i class="fas fa-play"></i> 执行检查</button>
                    <button class="btn btn-outline" onclick="MonitorUI.load()"><i class="fas fa-sync"></i> 刷新</button>
                    <label>状态:</label>
                    <select id="plan-filter-status" onchange="MonitorUI.load()">
                        <option value="">全部</option>
                        <option value="draft">draft</option>
                        <option value="active">active</option>
                        <option value="paused">paused</option>
                        <option value="archived">archived</option>
                    </select>
                    <label>级别:</label>
                    <select id="plan-filter-level" onchange="MonitorUI.load()">
                        <option value="">全部</option>
                        <option value="stock">个股</option>
                        <option value="industry">行业</option>
                    </select>
                    <input id="plan-filter-stock" placeholder="股票代码" style="width:80px;" onchange="MonitorUI.load()">
                    <span class="info" id="plan-count-display"></span>
                </div>
                <table class="obs-table" id="plans-table">
                    <thead><tr>
                        <th>计划名称</th>
                        <th style="width:50px;">级别</th>
                        <th style="width:80px;">目标</th>
                        <th style="width:70px;">信号方向</th>
                        <th style="width:60px;">频率</th>
                        <th style="width:80px;">最近检查</th>
                        <th style="width:60px;">状态</th>
                        <th style="width:80px;">操作</th>
                    </tr></thead>
                    <tbody id="plans-tbody"><tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-dim);">暂无监控计划，点击「生成监控计划」从研报创建</td></tr></tbody>
                </table>
            </div>

            <!-- Tab: Signal Events -->
            <div class="obs-content" id="tab-signals" style="display:none;">
                <div class="filter-bar">
                    <button class="btn btn-outline" onclick="SignalUI.load()"><i class="fas fa-sync"></i> 刷新</button>
                    <label>状态:</label>
                    <select id="signal-filter-status" onchange="SignalUI.load()">
                        <option value="">全部</option>
                        <option value="pending_review">待审核</option>
                        <option value="confirmed">已确认</option>
                        <option value="dismissed">已忽略</option>
                        <option value="acted">已执行</option>
                    </select>
                    <label>方向:</label>
                    <select id="signal-filter-direction" onchange="SignalUI.load()">
                        <option value="">全部</option>
                        <option value="buy">买入</option>
                        <option value="sell">卖出</option>
                        <option value="neutral">中性</option>
                    </select>
                    <input id="signal-filter-stock" placeholder="股票代码" style="width:80px;" onchange="SignalUI.load()">
                    <span class="info" id="signal-count-display"></span>
                </div>
                <table class="obs-table" id="signals-table">
                    <thead><tr>
                        <th>信号标题</th>
                        <th style="width:50px;">方向</th>
                        <th style="width:50px;">强度</th>
                        <th style="width:56px;">置信度</th>
                        <th style="width:70px;">股票/行业</th>
                        <th style="width:80px;">触发时间</th>
                        <th style="width:70px;">状态</th>
                        <th style="width:80px;">操作</th>
                    </tr></thead>
                    <tbody id="signals-tbody"><tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-dim);">暂无信号事件</td></tr></tbody>
                </table>
            </div>

            <!-- Tab: Saved Observations -->
            <div class="obs-content" id="tab-saved" style="display:none;">
                <div class="filter-bar">
                    <label>行业:</label>
                    <input id="filter-industry" placeholder="行业名" onchange="ExtractUI.refreshSaved()">
                    <label>步骤:</label>
                    <select id="filter-step" onchange="ExtractUI.refreshSaved()">
                        <option value="">全部</option>
                        <option value="step2">Step 2</option>
                        <option value="step3">Step 3</option>
                        <option value="step4">Step 4</option>
                        <option value="step5">Step 5</option>
                        <option value="step6">Step 6</option>
                    </select>
                    <label>状态:</label>
                    <select id="filter-status" onchange="ExtractUI.refreshSaved()">
                        <option value="">全部</option>
                        <option value="active">active</option>
                        <option value="monitoring">monitoring</option>
                        <option value="triggered">triggered</option>
                        <option value="confirmed">confirmed</option>
                        <option value="invalidated">invalidated</option>
                        <option value="expired">expired</option>
                    </select>
                    <label>股票:</label>
                    <input id="filter-stock" placeholder="代码" style="width:80px;" onchange="ExtractUI.refreshSaved()">
                    <span class="info" id="saved-count-display"></span>
                </div>
                <table class="obs-table" id="saved-table">
                    <thead>
                        <tr>
                            <th style="width:44px;">Step</th>
                            <th>观察标题</th>
                            <th style="width:90px;">分类</th>
                            <th style="width:44px;">方向</th>
                            <th style="width:80px;">时间窗口</th>
                            <th style="width:70px;">行业</th>
                            <th style="width:60px;">股票</th>
                            <th style="width:56px;">状态</th>
                            <th style="width:50px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="saved-tbody"></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="js/framework/api.js"></script>
<script src="js/framework/modal.js"></script>
<script src="js/framework/task_monitor.js"></script>
<script src="js/framework/markdown.js"></script>
<script src="js/ui.js"></script>
<script src="js/common.js"></script>
<script>
// ═══ ExtractUI — 观察提取与管理 ══════════════════════
const ExtractUI = {
    currentExtractData: [],       // 当前提取的全部观察
    selectedIds: new Set(),

    // ── 初始化 ───────────────────────────────────
    async init() {
        await this.loadRuns();
        await this.loadStats();
    },

    async loadRuns() {
        try {
            const res = await API.get('/research/pipeline/runs');
            const runs = res.data || [];
            const sel = document.getElementById('run-selector');
            sel.innerHTML = '<option value="">-- 选择投研项目 --</option>';
            runs.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.run_id;
                opt.textContent = r.display_name || r.run_id;
                sel.appendChild(opt);
            });
        } catch (e) {
            console.error('[ExtractUI] loadRuns failed:', e);
        }
    },

    async loadStats() {
        try {
            const s = await API.get('/observations/stats/counts');
            document.getElementById('stats-display').textContent =
                `📊 共 ${s.total} 条 | active ${s.active} | monitoring ${s.monitoring} | expired ${s.expired}`;
        } catch (e) {}
    },

    // ── Tab 切换 ────────────────────────────────
    switchTab(tab) {
        document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`.tabs .tab[data-tab="${tab}"]`).classList.add('active');
        document.getElementById('tab-extract').style.display = tab === 'extract' ? 'block' : 'none';
        document.getElementById('tab-saved').style.display = tab === 'saved' ? 'block' : 'none';
        document.getElementById('tab-plans').style.display = tab === 'plans' ? 'block' : 'none';
        document.getElementById('tab-signals').style.display = tab === 'signals' ? 'block' : 'none';
        if (tab === 'saved') this.refreshSaved();
        if (tab === 'plans') MonitorUI.load();
        if (tab === 'signals') SignalUI.load();
    },

    // ── 提取预览 ────────────────────────────────
    async extract() {
        const runId = document.getElementById('run-selector').value;
        if (!runId) { await Modal.alert('提示', '请先选择一个投研项目'); return; }

        document.getElementById('btn-extract').disabled = true;
        document.getElementById('btn-extract').innerHTML = '<i class="fas fa-spinner fa-pulse"></i> 提取中...';

        try {
            const data = await API.get(`/observations/extract-preview/${encodeURIComponent(runId)}`);
            this.currentExtractData = data.observations || [];
            this.renderExtractTable(data);
        } catch (e) {
            console.error('[ExtractUI] extract failed:', e);
            await Modal.alert('提取失败', e.message || String(e));
        } finally {
            document.getElementById('btn-extract').disabled = false;
            document.getElementById('btn-extract').innerHTML = '<i class="fas fa-search"></i> 提取观察';
        }
    },

    renderExtractTable(data) {
        const wrap = document.getElementById('extract-table-wrap');
        const empty = document.getElementById('extract-empty');
        const tbody = document.getElementById('extract-tbody');

        if (!data.observations || data.observations.length === 0) {
            wrap.style.display = 'none';
            empty.style.display = 'block';
            empty.innerHTML = '<i class="fas fa-inbox"></i><br>该项目的检查点中未提取到新观察事件';
            return;
        }

        empty.style.display = 'none';
        wrap.style.display = 'block';
        this.selectedIds = new Set();
        document.getElementById('select-all').checked = false;
        this.updateSelectionInfo();

        // Group by step
        const groups = data.groups || [];
        let html = '';
        groups.forEach(g => {
            if (g.total === 0) return;
            const groupObs = data.observations.filter(o => o.source_step === g.step);
            if (groupObs.length === 0) return;

            const stepLabel = g.step.replace('step', 'Step ');
            const badgeClass = `badge-step${g.step.replace('step','')}`;
            html += `<tr class="group-label"><td colspan="9">
                <span class="badge ${badgeClass}">${stepLabel}</span>
                &nbsp;${g.total} 条 · 新 ${g.new} · 已入库 ${g.existing}
            </td></tr>`;

            groupObs.forEach((obs, idx) => {
                const isSaved = obs.already_saved;
                const key = obs.title + obs.source_step + (obs.industry || '');
                const checked = !isSaved && !this.selectedIds.has(key) ? '' : 'checked';
                const stepNum = (obs.source_step || 'step0').replace('step', '');
                const dirClass = obs.direction === 'positive' ? 'dir-positive' :
                    obs.direction === 'negative' ? 'dir-negative' : 'dir-neutral';
                const dirIcon = obs.direction === 'positive' ? '↑' :
                    obs.direction === 'negative' ? '↓' : '—';

                html += `<tr>
                    <td class="chk">
                        <input type="checkbox" class="obs-chk" data-key="${key}"
                            onchange="ExtractUI.toggleOne('${key}')"
                            ${isSaved ? 'disabled' : ''}>
                    </td>
                    <td><span class="badge badge-step${stepNum}">Step ${stepNum}</span></td>
                    <td style="color:var(--text-micro);font-size:10px;">${obs.level || '-'}</td>
                    <td><div class="title-text" title="${escHtml(obs.description || obs.title)}">${escHtml((obs.title || '').substring(0, 60))}</div></td>
                    <td><span class="category-tag">${escHtml(obs.category || '-')}</span></td>
                    <td class="${dirClass}">${dirIcon}</td>
                    <td style="font-size:10px;color:var(--text-micro);">${escHtml(obs.window_start || '')}~${escHtml(obs.window_end || '')}</td>
                    <td style="font-size:10px;">${escHtml(obs.industry || '')}${obs.related_stock_code ? '<br>'+escHtml(obs.related_stock_code) : ''}</td>
                    <td>${isSaved ? '<span class="badge badge-saved">已入库</span>' : '<span class="badge badge-new">新</span>'}</td>
                </tr>`;
            });
        });

        tbody.innerHTML = html;
        document.getElementById('btn-save').disabled = true;
    },

    // ── 选择管理 ────────────────────────────────
    toggleOne(key) {
        if (this.selectedIds.has(key)) {
            this.selectedIds.delete(key);
        } else {
            this.selectedIds.add(key);
        }
        this.updateSelectionInfo();
    },

    toggleAll() {
        const checked = document.getElementById('select-all').checked;
        document.querySelectorAll('.obs-chk:not(:disabled)').forEach(cb => {
            cb.checked = checked;
            const key = cb.dataset.key;
            if (checked) this.selectedIds.add(key);
            else this.selectedIds.delete(key);
        });
        this.updateSelectionInfo();
    },

    updateSelectionInfo() {
        const n = this.selectedIds.size;
        document.getElementById('selection-info').textContent = `已选 ${n} 条`;
        document.getElementById('btn-save').disabled = n === 0;
    },

    // ── 批量入库 ────────────────────────────────
    async batchSave() {
        if (this.selectedIds.size === 0) return;
        const ok = await Modal.confirm('确认入库', `确认将选中的 ${this.selectedIds.size} 条观察事件写入数据库？`);
        if (!ok) return;

        const selected = this.currentExtractData.filter(o => {
            const key = o.title + o.source_step + (o.industry || '');
            return this.selectedIds.has(key) && !o.already_saved;
        });

        if (selected.length === 0) {
            await Modal.alert('提示', '没有可入库的新观察');
            return;
        }

        document.getElementById('btn-save').disabled = true;
        document.getElementById('btn-save').innerHTML = '<i class="fas fa-spinner fa-pulse"></i> 入库中...';

        try {
            const result = await API.post('/observations/batch-save', { observations: selected });
            await Modal.alert('入库成功', `已写入 ${result.saved} 条观察事件`);
            // Refresh: re-extract to update status
            await this.extract();
            await this.loadStats();
        } catch (e) {
            console.error('[ExtractUI] batchSave failed:', e);
            await Modal.alert('入库失败', e.message || String(e));
        } finally {
            document.getElementById('btn-save').innerHTML = '<i class="fas fa-save"></i> 确认入库';
        }
    },

    // ── 已入库观察 ──────────────────────────────
    async refreshSaved() {
        const tbody = document.getElementById('saved-tbody');
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--text-dim);"><i class="fas fa-spinner fa-pulse"></i> 加载中...</td></tr>';

        const params = {};
        const industry = document.getElementById('filter-industry').value.trim();
        const step = document.getElementById('filter-step').value;
        const status = document.getElementById('filter-status').value;
        const stock = document.getElementById('filter-stock').value.trim();
        if (industry) params.industry = industry;
        if (step) params.source_step = step;
        if (status) params.status = status;
        if (stock) params.stock_code = stock;
        params.limit = 500;

        try {
            const data = await API.get('/observations', params);
            this.renderSavedTable(data.observations || []);
            document.getElementById('saved-count-display').textContent = `共 ${data.total} 条`;
        } catch (e) {
            console.error('[ExtractUI] refreshSaved failed:', e);
            tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:30px;color:#f87171;">加载失败: ${e.message}</td></tr>`;
        }
    },

    renderSavedTable(observations) {
        const tbody = document.getElementById('saved-tbody');
        if (!observations.length) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-dim);">暂无匹配的观察事件</td></tr>';
            return;
        }

        let html = '';
        observations.forEach(o => {

<table style="font-size:11px;width:100%;border-collapse:collapse;">

  <tr><td style="padding:3px 8px;color:var(--text-micro);">股票</td><td>${o.related_stock_code || '-'}</td></tr>
  <tr><td style="padding:3px 8px;color:var(--text-micro);">监控指标</td><td>${escHtml(o.monitor_metric || '-')}</td></tr>

// ═══ MonitorUI — 监控计划管理 ═════════════════════
const MonitorUI = {
    async load() {
        const tbody = document.getElementById('plans-tbody');
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-dim);"><i class="fas fa-spinner fa-pulse"></i> 加载中...</td></tr>';
        const params = {};
        const status = document.getElementById('plan-filter-status').value;
        const level = document.getElementById('plan-filter-level').value;
        const stock = document.getElementById('plan-filter-stock').value.trim();
        if (status) params.status = status;
        if (level) params.level = level;
        if (stock) params.stock_code = stock;
        try {
            const data = await API.get('/monitor/plans', params);
            this.render(data.plans || []);
            document.getElementById('plan-count-display').textContent = `共 ${data.total} 条`;
        } catch (e) {
            console.error('[MonitorUI] load failed:', e);
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:30px;color:#f87171;">加载失败: ${escHtml(e.message)}</td></tr>`;
        }
    },

    render(plans) {
        const tbody = document.getElementById('plans-tbody');
        if (!plans.length) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-dim);">暂无监控计划</td></tr>';
            return;
        }
        let html = '';
        plans.forEach(p => {
            const levelLabel = p.level === 'industry' ? '🏭' : '📈';
            const target = p.level === 'stock' ? (p.target_stock_code || '-') : (p.target_industry || '-');
            const dirMap = {buy: '买入↑', sell: '卖出↓', neutral: '中性—'};
            const intervalDays = Math.round((p.check_interval_hours || 168) / 24);
            const statusBadge = p.status === 'active' ? 'badge-step6' : p.status === 'draft' ? 'badge-step3' : '';
            html += `<tr>
                <td><div style="cursor:pointer;" onclick="MonitorUI.showDetail('${p.id}')" title="${escHtml(p.description || p.name)}">${escHtml((p.name || '').substring(0, 40))}</div></td>
                <td>${levelLabel}</td>
                <td style="font-size:10px;">${escHtml(target)}</td>
                <td style="font-size:10px;">${dirMap[p.signal_direction] || p.signal_direction}</td>
                <td style="font-size:10px;">${intervalDays}d</td>
                <td style="font-size:10px;color:var(--text-micro);">${p.last_check_at ? p.last_check_at.substring(0,10) : '-'}</td>
                <td><span class="badge ${statusBadge}" style="font-size:9px;">${p.status}</span></td>
                <td style="font-size:10px;">
                    <button class="btn btn-outline" style="font-size:9px;padding:2px 6px;" onclick="MonitorUI.toggleStatus('${p.id}','${p.status}')">${p.status==='active'?'暂停':'激活'}</button>
                    <button class="btn btn-outline" style="font-size:9px;padding:2px 6px;" onclick="MonitorUI.checkOne('${p.id}')">检查</button>
                    ${p.status === 'archived' ? `<button class="btn btn-outline" style="font-size:9px;padding:2px 6px;" onclick="MonitorUI.deletePlan('${p.id}')">删除</button>` : ''}
                </td>
            </tr>`;
        });
        tbody.innerHTML = html;
    },

    async showDetail(planId) {
        try {
            const p = await API.get('/monitor/plans/' + planId);
            const signals = await API.get('/monitor/signals', {plan_id: planId, limit: 20});
            const searchConfig = JSON.stringify(JSON.parse(p.search_config || '[]'), null, 2);
            const triggerInst = escHtml(p.trigger_instruction || '-');
            const cascade = JSON.stringify(JSON.parse(p.cascade_to_stocks || '[]'), null, 2);
            const sigList = (signals.signals||[]);
            const sigHtml = sigList.length ? sigList.map(s => '[' + s.signal_direction + '] ' + s.title + ' (' + s.status + ') ' + (s.triggered_at||'').substring(0,10)).join('\n') : '无';

            let detailHtml = `
<h3>${escHtml(p.name)}</h3>
<table style="font-size:11px;width:100%;border-collapse:collapse;">
  <tr><td style="padding:3px 8px;color:var(--text-micro);width:80px;">级别</td><td>${p.level}</td></tr>
  <tr><td style="padding:3px 8px;color:var(--text-micro);">目标</td><td>${p.target_stock_code || p.target_stock_name || p.target_industry || '-'}</td></tr>
  <tr><td style="padding:3px 8px;color:var(--text-micro);">信号</td><td>${p.signal_direction} / ${p.signal_strength}</td></tr>
  <tr><td style="padding:3px 8px;color:var(--text-micro);">频率</td><td>${Math.round(p.check_interval_hours/24)}天 / 冷却${p.cooldown_days}天</td></tr>
  <tr><td style="padding:3px 8px;color:var(--text-micro);">状态</td><td>${p.status} (检查${p.total_checks}次)</td></tr>
  <tr><td style="padding:3px 8px;color:var(--text-micro);">最近检查</td><td>${p.last_check_at || '-'}</td></tr>
  <tr><td style="padding:3px 8px;color:var(--text-micro);">最近触发</td><td>${p.last_triggered_at || '-'}</td></tr>
  <tr><td style="padding:3px 8px;color:var(--text-micro);">来源</td><td>${p.source_report_id || '-'} / ${p.source_step || '-'}</td></tr>
</table>
<p style="margin-top:8px;font-size:11px;color:var(--text-dim);">${escHtml(p.description || '')}</p>
<h4 style="margin-top:10px;font-size:12px;">触发指令</h4>
<pre style="font-size:10px;">${triggerInst}</pre>
<h4 style="margin-top:10px;font-size:12px;">搜索配置</h4>
<pre style="font-size:10px;">${searchConfig}</pre>`;
            if (cascade !== '[]') {
                detailHtml += `<h4 style="margin-top:10px;font-size:12px;">级联股票</h4><pre style="font-size:10px;">${cascade}</pre>`;
            }
            detailHtml += `<h4 style="margin-top:10px;font-size:12px;">相关信号 (${sigList.length})</h4>
<pre style="font-size:10px;">${sigHtml}</pre>`;

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `<div class="modal-box" style="max-width:700px;">${detailHtml}<button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">关闭</button></div>`;
            overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
            document.body.appendChild(overlay);
        } catch (e) {
            console.error('[MonitorUI] showDetail failed:', e);
        }
    },

    async toggleStatus(planId, currentStatus) {
        const newStatus = currentStatus === 'active' ? 'paused' : 'active';
        try {
            await API.patch('/monitor/plans/' + planId + '/status', {status: newStatus});
            this.load();
        } catch (e) {
            await Modal.alert('操作失败', e.message || String(e));
        }
    },

    async checkOne(planId) {
        try {
            const r = await API.post('/monitor/execute', {plan_id: planId});
            if (r.triggered) {
                await Modal.alert('检查完成', '信号触发: ' + (r.signal?.title || ''));
            } else {
                await Modal.alert('检查完成', '未触发信号');
            }
            this.load();
            SignalUI.refreshBadge();
        } catch (e) {
            await Modal.alert('检查失败', e.message || String(e));
        }
    },

    async checkAll() {
        try {
            const r = await API.post('/monitor/execute', {});
            await Modal.alert('批量检查完成', '检查 ' + r.checked + ' 计划, 触发 ' + r.triggered + ' 信号');
            this.load();
            SignalUI.refreshBadge();
        } catch (e) {
            await Modal.alert('批量检查失败', e.message || String(e));
        }
    },

    async deletePlan(planId) {
        const ok = await Modal.confirm('确认删除', '删除后关联的信号事件也将被删除，确认？');
        if (!ok) return;
        try {
            await API.del('/monitor/plans/' + planId);
            this.load();
        } catch (e) {
            await Modal.alert('删除失败', e.message || String(e));
        }
    },

    async generateFromReport() {
        try {
            const reports = await API.get('/research/reports');
            const reportList = (reports.reports || reports.data || []);
            if (!reportList.length) {
                await Modal.alert('提示', '没有找到研报，请先运行投研 Pipeline');
                return;
            }
            const listHtml = reportList.map(r =>
                `<label style="display:block;padding:4px 0;cursor:pointer;">
                    <input type="radio" name="report-select" value="${r.report_id}">
                    ${escHtml(r.title || r.industry || r.report_id)} (${(r.created_at || '').substring(0,10)})
                 </label>`
            ).join('');
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `<div class="modal-box">
                <h3>选择研报生成监控计划</h3>
                <p style="font-size:11px;color:var(--text-dim);margin-bottom:8px;">将用 LLM 分析研报内容，自动建议监控计划</p>
                <div style="max-height:300px;overflow-y:auto;">${listHtml}</div>
                <button class="btn btn-primary" style="margin-top:12px;" onclick="MonitorUI._doGenerate(this)"><i class="fas fa-magic"></i> 开始生成</button>
                <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
            </div>`;
            overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
            document.body.appendChild(overlay);
        } catch (e) {
            console.error('[MonitorUI] generateFromReport failed:', e);
            await Modal.alert('加载失败', e.message || String(e));
        }
    },

    async _doGenerate(btn) {
        const selected = document.querySelector('input[name="report-select"]:checked');
        if (!selected) { await Modal.alert('提示', '请选择一份研报'); return; }
        const reportId = selected.value;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> LLM 分析中...';
        try {
            const r = await API.post('/monitor/generate', {report_id: reportId});
            const plans = r.plans || [];
            if (!plans.length) {
                await Modal.alert('生成结果', 'LLM 未建议监控计划');
                return;
            }
            const reviewHtml = plans.map((p, i) =>
                `<div style="border:1px solid var(--border-color);border-radius:4px;padding:10px;margin:8px 0;">
                    <label style="cursor:pointer;">
                        <input type="checkbox" class="plan-approve" data-idx="${i}" checked>
                        <strong>${escHtml(p.name || '未命名计划')}</strong>
                    </label>
                    <div style="font-size:10px;color:var(--text-dim);margin-top:4px;">
                        方向: ${p.signal_direction} / 强度: ${p.signal_strength} / 频率: ${Math.round((p.check_interval_hours||168)/24)}天
                        | 级别: ${p.level} | 目标: ${p.target_stock_code || p.target_stock_name || p.target_industry || '-'}
                    </div>
                    <div style="font-size:10px;margin-top:2px;">${escHtml((p.description || p.reasoning || '').substring(0, 150))}</div>
                    <button class="btn btn-outline" style="font-size:9px;padding:2px 6px;margin-top:4px;" onclick="MonitorUI._togglePlanDetail(${i})">详情</button>
                    <pre id="plan-detail-${i}" style="display:none;font-size:9px;margin-top:4px;">${escHtml(JSON.stringify(p, null, 2))}</pre>
                </div>`
            ).join('');
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `<div class="modal-box" style="max-width:700px;">
                <h3>LLM 建议的监控计划 (${plans.length})</h3>
                <p style="font-size:11px;color:var(--text-dim);margin-bottom:8px;">请审核并勾选要保存的计划</p>
                <div style="max-height:400px;overflow-y:auto;">${reviewHtml}</div>
                <div style="margin-top:12px;display:flex;gap:8px;">
                    <button class="btn btn-success" onclick="MonitorUI._saveApprovedPlans(this)"><i class="fas fa-save"></i> 保存选中计划</button>
                    <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
                </div>
            </div>`;
            overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
            btn.closest('.modal-overlay').remove();
            document.body.appendChild(overlay);
        } catch (e) {
            console.error('[MonitorUI] _doGenerate failed:', e);
            await Modal.alert('生成失败', e.message || String(e));
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-magic"></i> 开始生成';
        }
    },

    _togglePlanDetail(idx) {
        const el = document.getElementById('plan-detail-' + idx);
        if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    },

    async _saveApprovedPlans(btn) {
        const checked = document.querySelectorAll('.plan-approve:checked');
        if (!checked.length) { await Modal.alert('提示', '请至少勾选一个计划'); return; }
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> 保存中...';
        try {
            const plans = [];
            checked.forEach(cb => {
                const idx = parseInt(cb.dataset.idx);
                const detailEl = document.getElementById('plan-detail-' + idx);
                if (detailEl && detailEl.textContent) {
                    try {
                        const p = JSON.parse(detailEl.textContent);
                        delete p.reasoning;
                        plans.push(p);
                    } catch(e) { console.error('[MonitorUI] parse detail:', e); }
                }
            });
            if (!plans.length) { await Modal.alert('错误', '无法获取计划数据'); return; }
            let saved = 0;
            for (const plan of plans) {
                await API.post('/monitor/plans', plan);
                saved++;
            }
            await Modal.alert('保存成功', '已保存 ' + saved + ' 个监控计划');
            btn.closest('.modal-overlay').remove();
            this.load();
        } catch (e) {
            console.error('[MonitorUI] _saveApprovedPlans failed:', e);
            await Modal.alert('保存失败', e.message || String(e));
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-save"></i> 保存选中计划';
        }
    },
};

  <tr><td style="padding:3px 8px;color:var(--text-micro);">强度</td><td>${s.signal_strength}</td></tr>
  <tr><td style="padding:3px 8px;color:var(--text-micro);">置信度</td><td>${s.confidence}</td></tr>
  <tr><td style="padding:3px 8px;color:var(--text-micro);">触发时间</td><td>${s.triggered_at}</td></tr>
  <tr><td style="padding:3px 8px;color:var(--text-micro);">股票</td><td>${s.related_stock_code || s.related_stock_name || '-'}</td></tr>
  <tr><td style="padding:3px 8px;color:var(--text-micro);">行业</td><td>${s.target_industry || '-'}</td></tr>
  <tr><td style="padding:3px 8px;color:var(--text-micro);">监控计划</td><td>${escHtml(s.plan_name || s.plan_id)}</td></tr>
  <tr><td style="padding:3px 8px;color:var(--text-micro);">状态</td><td>${s.status}</td></tr>
</table>
<p style="margin-top:8px;font-size:11px;">${escHtml(s.description || '')}</p>
<h4 style="margin-top:10px;font-size:12px;">证据 (${evidence.length})</h4>
${evidenceHtml}`;
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `<div class="modal-box" style="max-width:650px;">${html}<button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()" style="margin-top:12px;">关闭</button></div>`;
            overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
            document.body.appendChild(overlay);
        } catch (e) {
            console.error('[SignalUI] showDetail failed:', e);
        }
    },

    async confirm(signalId) {
        try {
            await API.patch('/monitor/signals/' + signalId + '/status', {status: 'confirmed'});
            this.load();
        } catch (e) {
            await Modal.alert('操作失败', e.message || String(e));
        }
    },

    async dismiss(signalId) {
        try {
            await API.patch('/monitor/signals/' + signalId + '/status', {status: 'dismissed'});
            this.load();
        } catch (e) {
            await Modal.alert('操作失败', e.message || String(e));
        }
    },

    async act(signalId) {
        try {
            await API.patch('/monitor/signals/' + signalId + '/status', {status: 'acted'});
            this.load();
        } catch (e) {
            await Modal.alert('操作失败', e.message || String(e));
        }
    },

    async refreshBadge() {
        try {
            const stats = await API.get('/monitor/stats/counts');
            const pending = stats.signals?.pending_review || 0;
            const badge = document.getElementById('signal-badge');
            if (pending > 0) {
                badge.style.display = 'inline';
                badge.textContent = '' + pending;
            } else {
                badge.style.display = 'none';
            }
        } catch(e) {
            console.error('[SignalUI] refreshBadge failed:', e);
        }
    },
};


// ── 初始化 ─────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    ExtractUI.init();
});
</script>
</body>
</html>
