<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AIStock | 调仓建议管理</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand-area"><div class="brand-title">AI STOCK</div></div>
            <div class="nav-item" onclick="location.href='index.html'"><i class="fas fa-terminal"></i><span>指挥部概览</span></div>
            <div class="nav-item" onclick="location.href='positions.html'"><i class="fas fa-search-dollar"></i><span>持仓管理</span></div>
            <div class="nav-item active" onclick="location.href='suggestions.html'"><i class="fas fa-exchange-alt"></i><span>调仓建议</span></div>
            <div class="nav-item" onclick="location.href='research.html'"><i class="fas fa-brain"></i><span>AI 投研</span></div>
            <div class="nav-item" onclick="location.href='history.html'"><i class="fas fa-history"></i><span>交易审计</span></div>
            <div class="nav-item" onclick="location.href='data.html'"><i class="fas fa-server"></i><span>数据中心</span></div>
            <div class="nav-item" onclick="location.href='import.html'"><i class="fas fa-file-import"></i><span>智能导入</span></div>
            <div style="margin-top: auto;"><div class="nav-item"><i class="fas fa-cog"></i><span>系统设置</span></div></div>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <div class="status-item"><span class="status-label">待执行信号:</span> <span class="status-value" id="pending-count">0</span></div>
                <div style="margin-left: auto; display: flex; gap: 15px; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <input type="date" id="target-cancel-date" class="btn-action" style="padding: 2px 5px; height: 28px;">
                        <button class="btn-action" onclick="batchCancel()" style="color: var(--accent-red); border-color: var(--accent-red); height: 28px;"><i class="fas fa-trash-alt"></i> 按日期作废</button>
                    </div>
                    <button class="btn-action" onclick="generateNew()" style="border-color: var(--accent-blue); color: var(--accent-blue); height: 28px;"><i class="fas fa-magic"></i> 全新扫描</button>
                </div>
            </div>

            <div class="workspace" style="grid-template-columns: 1fr;">
                <div class="panel">
                    <div class="panel-header"><span class="panel-title">信号执行队列 (Execution Queue)</span></div>
                    <div class="panel-body">
                        <table>
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>股票名称</th>
                                    <th>操作建议</th>
                                    <th style="text-align: right;">当前价格</th>
                                    <th style="text-align: right;">综合评分</th>
                                    <th>建议逻辑</th>
                                    <th style="text-align: right;">操作</th>
                                </tr>
                            </thead>
                            <tbody id="suggestion-list"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>
        const API_BASE = '/api';
        async function loadSuggestions() {
            const res = await fetch(`${API_BASE}/suggestions?status=PENDING`);
            const data = await res.json();
            document.getElementById('pending-count').textContent = data.length;
            const list = document.getElementById('suggestion-list');
            list.innerHTML = data.map(s => `
                <tr>
                    <td style="color: var(--text-micro); font-size: 11px;">${s.suggestion_date}</td>
                    <td class="ticker">${s.stock_name}</td>
                    <td style="color: ${s.action.includes('BUY') ? 'var(--accent-green)' : 'var(--accent-red)'}; font-weight: bold;">
                        ${s.action === 'BUY' ? '买入' : (s.action === 'SELL' ? '卖出' : s.action)}
                    </td>
                    <td style="text-align: right; font-family: var(--font-mono);">¥${Number(s.current_price).toFixed(2)}</td>
                    <td style="text-align: right;"><span style="color: var(--accent-gold); font-weight: bold;">${Number(s.score).toFixed(1)}</span></td>
                    <td style="font-size: 11px; color: var(--text-dim); max-width: 300px;">${s.reason}</td>
                    <td style="text-align: right;">
                        <button class="btn-action" onclick="execute(${s.id})" style="color: var(--accent-green); border-color: var(--accent-green);">执行</button>
                        <button class="btn-action" onclick="cancel(${s.id})">作废</button>
                    </td>
                </tr>
            `).join('');
        }
        async function batchCancel() {
            const dateStr = document.getElementById('target-cancel-date').value;
            if (!dateStr) { alert('请先选择日期'); return; }
            if (!confirm(`确认作废 ${dateStr} 的所有待执行信号？`)) return;
            
            try {
                const res = await fetch(`${API_BASE}/suggestions/batch/cancel-by-date?target_date=${dateStr}`, { 
                    method: 'PUT' 
                });
                const data = await res.json();
                alert(data.message);
                loadSuggestions();
            } catch (e) { alert('批量作废失败'); }
        }

        async function execute(id) { await fetch(`${API_BASE}/suggestions/${id}/execute`, { method: 'PUT' }); loadSuggestions(); }
        async function cancel(id) { await fetch(`${API_BASE}/suggestions/${id}/cancel`, { method: 'PUT' }); loadSuggestions(); }
        async function generateNew() { await fetch(`${API_BASE}/suggestions/generate`, { method: 'POST' }); loadSuggestions(); }
        
        window.onload = () => {
            // 初始化日期选择器为今天
            document.getElementById('target-cancel-date').value = new Date().toISOString().split('T')[0];
            loadSuggestions();
        };
    </script>
</body>
</html>
