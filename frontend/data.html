<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AIStock_Pro | 数据同步看板</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --bg-card: #0d0d0d;
            --accent-primary: #ffffff;
            --accent-border: #222222;
            --accent-green: #00ff88;
            --accent-red: #ff3344;
            --accent-gold: #ffcc00;
            --text-main: #e0e0e0;
            --text-dim: #666666;
        }

        body {
            font-family: 'Outfit', 'Inter', sans-serif;
            background-color: var(--bg-deep);
            margin: 0; padding: 0;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        /* 顶部看板样式优化 - 交易终端感 */
        .source-header {
            background: #080808;
            border-bottom: 1px solid var(--accent-border);
            padding: 12px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 15px;
            margin: 15px;
        }

        /* 指令卡片组 - 扁平硬朗化 */
        .command-section { display: flex; flex-direction: column; gap: 10px; }
        .hero-card {
            background: #111;
            border: 1px solid #333;
            padding: 25px;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .hero-card:hover { border-color: var(--accent-green); background: #161616; }
        
        .sub-cmds {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .mini-card {
            background: #0d0d0d;
            border: 1px solid var(--accent-border);
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            transition: all 0.2s;
        }
        .mini-card:hover { border-color: #444; background: #111; }

        /* 终端显示 - 纯粹代码感 */
        .monitor-panel {
            background: #000;
            border: 1px solid var(--accent-border);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .monitor-header {
            background: #111;
            border-bottom: 1px solid var(--accent-border);
            padding: 8px 15px;
            font-size: 11px;
            font-family: 'JetBrains Mono';
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
        }
        .terminal-box {
            flex: 1;
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            overflow-y: auto;
            color: #888;
            height: 240px;
        }

        /* 底部宽幅表格 - 增加滚动条支持 */
        .health-section {
            margin: 15px;
            background: #080808;
            border: 1px solid var(--accent-border);
            border-radius: 4px;
            padding: 0;
            overflow: hidden;
        }
        .table-scroll-container {
            max-height: 400px;
            overflow-y: auto;
        }
        /* 自定义滚动条 */
        .table-scroll-container::-webkit-scrollbar { width: 6px; }
        .table-scroll-container::-webkit-scrollbar-track { background: #000; }
        .table-scroll-container::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .health-table {
            width: 100%;
            border-collapse: collapse;
        }
        .health-table th {
            position: sticky; top: 0;
            background: #111;
            text-align: left;
            padding: 12px 15px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--accent-border);
            font-weight: 500;
            font-size: 11px;
            text-transform: uppercase;
        }
        .health-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #111;
            font-size: 13px;
        }
        .indicator-pill {
            padding: 2px 8px;
            border: 1px solid var(--accent-green);
            border-radius: 2px;
            font-size: 10px;
            color: var(--accent-green);
            background: transparent;
        }

        .step-pill { font-size: 10px; color: #444; font-family: 'JetBrains Mono'; }
        .step-pill.active { color: #fff; }
        .step-pill.done { color: var(--accent-green); }

    </style>
</head>
<body data-page-id="data">
    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <!-- 1. 顶部状态栏 -->
            <div class="source-header">
                <div>
                    <i class="fas fa-microchip" style="margin-right: 10px; color: var(--accent-blue);"></i>
                    <span style="color: var(--text-dim); margin-right: 15px;">数据源链路:</span>
                    <span style="color: #fff; font-family: 'JetBrains Mono';">Sina -> AkShare -> Backup</span>
                </div>
                <div style="font-size: 12px;">
                    <span style="color: var(--text-dim);">核心算力状态:</span>
                    <span style="color: var(--accent-green); margin-left: 5px;">● OPTIMAL</span>
                </div>
            </div>

            <!-- 2. 中间操作与监控 -->
            <div class="main-grid">
                <div class="command-section">
                    <div class="hero-card" onclick="triggerSync('AUTO')">
                        <i class="fas fa-magic" style="font-size: 40px; color: var(--accent-blue); margin-bottom: 20px;"></i>
                        <div style="font-size: 20px; font-weight: 600; margin-bottom: 10px;">智能一键同步</div>
                        <p style="font-size: 13px; color: var(--text-dim); margin: 0;">自动感知数据缺口，决定增量或全量模式</p>
                    </div>
                    
                    <div class="sub-cmds">
                        <div class="mini-card" onclick="triggerSync('AUTO_FULL')">
                            <i class="fas fa-redo-alt" style="color: var(--accent-gold);"></i>
                            <span>强制全量重算</span>
                        </div>
                        <div class="mini-card" onclick="triggerSync('INDICATORS_ONLY')">
                            <i class="fas fa-calculator" style="color: var(--accent-green);"></i>
                            <span>仅重算指标</span>
                        </div>
                    </div>

                    <div class="mini-card" style="margin-top: auto; border-color: var(--accent-primary);" onclick="location.href='/tasks_registry.html'">
                        <i class="fas fa-tasks" style="color: var(--accent-primary);"></i>
                        <span style="color: var(--accent-primary);">管理任务定义与调度</span>
                    </div>
                </div>

                <div class="monitor-panel">
                    <div class="monitor-header">
                        <span>LIVE EXECUTION TRACE</span>
                        <span id="task-id-display" style="color: var(--text-dim);">ID: ---</span>
                    </div>
                    <div class="stepper-mini">
                        <div class="step-pill" id="step-fetch"><i class="fas fa-circle"></i> 行情获取</div>
                        <div class="step-pill" id="step-calc"><i class="fas fa-circle"></i> 指标运算</div>
                        <div class="step-pill" id="step-logic"><i class="fas fa-circle"></i> 逻辑推演</div>
                        <div class="step-pill" id="step-save"><i class="fas fa-circle"></i> 存盘就绪</div>
                    </div>
                    <div class="terminal-box" id="data-terminal">
                        <div>Ready for command...</div>
                    </div>
                </div>
            </div>

            <!-- 3. 底部宽幅：健康体检 + 任务历史 -->
            <div style="display: grid; grid-template-columns: 1fr 350px; gap: 15px; margin: 15px;">
                <!-- 健康检查 (左) -->
                <div class="health-section" style="margin: 0;">
                    <div style="padding: 12px 15px; font-weight: 600; font-size: 11px; letter-spacing: 1px; color: var(--accent-green); border-bottom: 1px solid var(--accent-border);">
                        <i class="fas fa-heartbeat"></i> HEALTH CHECK MONITOR
                    </div>
                    <div class="table-scroll-container">
                        <table class="health-table">
                            <thead>
                                <tr>
                                    <th>Security</th>
                                    <th>Last Sync</th>
                                    <th>Price</th>
                                    <th>Source</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="health-check-list"></tbody>
                        </table>
                    </div>
                </div>

                <!-- 任务历史 (右) -->
                <div class="panel" style="background: #080808; border: 1px solid var(--accent-border); border-radius: 4px;">
                    <div class="monitor-header">
                        <span>TASK EXECUTION LOG</span>
                        <a href="/tasks_history.html" style="color: var(--text-dim); text-decoration: none;" title="查看历史记录"><i class="fas fa-history"></i></a>
                    </div>
                    <div id="task-history-list" style="max-height: 412px; overflow-y: auto;">
                        <!-- 动态加载活跃任务 -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/ui.js"></script>
    <script src="js/common.js"></script>
    <script>
        function addLog(msg, type='info') {
            const terminal = document.getElementById('data-terminal');
            const time = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ef4444' : (type === 'success' ? '#22c55e' : '#94a3b8');
            const div = document.createElement('div');
            div.style.marginBottom = '4px';
            div.innerHTML = `<span style="color:#475569">[${time}]</span> <span style="color:${color}">${msg}</span>`;
            terminal.prepend(div);
        }

        async function triggerSync(type) {
            try {
                const res = await fetch('/api/data/sync/daily/auto', { 
                    method: 'POST', 
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ type: type }) // 必须发送 Body，否则 422
                });
                
                if (!res.ok) {
                    const errorData = await res.json();
                    throw new Error(errorData.detail || '请求失败');
                }

                const data = await res.json();
                if(data.task_id) {
                    document.getElementById('task-id-display').innerText = `ID: ${data.task_id.substring(0,8)}`;
                    addLog(`任务链激活成功: ${type}`, 'success');
                }
            } catch (e) {
                addLog(`启动异常: ${e.message}`, 'error');
                console.error("Sync Error:", e);
            }
        }

        async function updateHealth() {
            try {
                const res = await fetch('/api/positions');
                const positions = await res.json();
                const container = document.getElementById('health-check-list');
                container.innerHTML = positions.map(p => {
                    const isToday = p.updated_at && p.updated_at.includes(new Date().toISOString().split('T')[0]);
                    return `
                        <tr>
                            <td>
                                <div style="font-weight:600;">${p.stock_name}</div>
                                <div style="font-size:11px; color:var(--text-dim);">${p.stock_code}</div>
                            </td>
                            <td>${p.updated_at ? p.updated_at.split('T')[0] : '---'}</td>
                            <td style="font-family:'JetBrains Mono'; font-weight:500;">${p.current_price || '---'}</td>
                            <td><span style="color:var(--text-dim); font-size:12px;">Sina Finance</span></td>
                            <td><span class="indicator-pill" style="${isToday?'':'background:rgba(251,191,36,0.1); color:var(--accent-gold);'}">${isToday?'SYNCED':'OUTDATED'}</span></td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {}
        }

        async function stopTask(id) {
            if(!confirm('确定强制停止该任务？')) return;
            try {
                const res = await fetch(`/api/system/tasks/executions/${id}`, { method: 'DELETE' });
                if(res.ok) {
                    addLog(`已发送停止指令 (Task: ${id.substring(0,8)})`, 'error');
                    updateTasks();
                }
            } catch (e) {
                alert('停止失败');
            }
        }

        async function clearTaskHistory() {
            if (!confirm('确定要清空所有任务历史记录吗？')) return;
            try {
                const res = await fetch('/api/system/tasks/all', { method: 'DELETE' });
                const data = await res.json();
                showNotification(data.message);
                updateTasks();
            } catch (e) {
                showNotification('清空失败', 'error');
            }
        }

        async function updateTasks() {
            try {
                const res = await fetch('/api/system/tasks/executions/active');
                const tasks = await res.json();
                
                // 检查是否有活跃任务，若无则清空显示
                if (tasks.length === 0) {
                    document.getElementById('task-id-display').textContent = 'ID: ---';
                } else {
                    document.getElementById('task-id-display').textContent = `ID: ${tasks[0].id.substring(0,8)}`;
                }

                const container = document.getElementById('task-history-list');
                container.innerHTML = tasks.length === 0 ? 
                    '<div style="padding:40px; text-align:center; color:#444; font-size:12px;">无活跃任务</div>' :
                    tasks.map(t => {
                        const status = t.status.toUpperCase();
                        const statusColor = status === 'RUNNING' ? 'var(--accent-green)' : (status === 'PENDING' ? 'var(--accent-gold)' : '#ff4757');
                        return `
                            <div style="padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.03); display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <div style="font-size: 13px; font-weight: 600;">${t.task_code}</div>
                                    <div style="font-size: 11px; color: var(--text-dim); margin-top: 4px;">${t.result_msg || '等待资源...'}</div>
                                    <div style="width: 150px; height: 2px; background: #222; margin-top: 8px;">
                                        <div style="width: ${t.progress}%; height: 100%; background: var(--accent-green);"></div>
                                    </div>
                                </div>
                                <div style="text-align: right;">
                                    <div style="font-size: 11px; color: ${statusColor}; font-weight: 600;">${status}</div>
                                    <button onclick="stopTask('${t.id}')" style="background: none; border: 1px solid #ef4444; color: #ef4444; font-size: 10px; padding: 2px 8px; border-radius: 4px; margin-top: 5px; cursor: pointer;">停止</button>
                                </div>
                            </div>
                        `;
                    }).join('');
            } catch (e) {}
        }

        setInterval(updateHealth, 10000);
        setInterval(updateTasks, 3000);
        window.onload = () => {
            updateHealth();
            updateTasks();
        };
    </script>
</body>
</html>
