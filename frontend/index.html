<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIStock | 量化投研控制台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-page-id="index">
    <div class="app-container">
        <!-- 侧边导航 (由 ui.js 填充) -->
        <aside class="sidebar"></aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶栏 (由 ui.js 填充) -->
            <div class="top-bar"></div>

            <!-- 核心工作区 -->
            <div class="workspace">
                <!-- 左侧：调仓建议区 -->
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">智能调仓建议 (Signal Cluster)</span>
                    </div>
                    <div class="panel-body">
                        <table>
                            <thead>
                                <tr>
                                    <th>股票代码</th>
                                    <th>操作建议</th>
                                    <th style="text-align: right;">建议仓位</th>
                                    <th style="text-align: right;">当前价格</th>
                                    <th style="text-align: right;">综合评分</th>
                                    <th style="text-align: right;">执行</th>
                                </tr>
                            </thead>
                            <tbody id="suggestion-list">
                                <!-- 由 app.js 填充 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 右侧：深度投研区 -->
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">全球供应链动态 (AI Intelligence)</span>
                    </div>
                    <div class="panel-body" id="research-container">
                        <!-- 由 app.js 填充 -->
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- 任务监控由 common.js 自动注入到 body -->

    <script src="js/ui.js"></script>
    <script src="js/common.js"></script>
    <script src="js/app.js"></script>
</body>
</body>
</html>
