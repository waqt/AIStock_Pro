<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AIStock | AI 深度投研报告</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .score-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 12px;
        }
        .score-high { background: rgba(46,204,113,0.2); color: var(--accent-green); }
        .score-mid { background: rgba(241,196,15,0.2); color: var(--accent-gold); }
        .score-low { background: rgba(231,76,60,0.2); color: var(--accent-red); }

        .industry-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-thin);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .industry-card h3 {
            color: var(--accent-blue);
            font-size: 16px;
            margin-bottom: 12px;
        }
        .kpi-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .kpi-box {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-thin);
            border-radius: 4px;
            padding: 12px;
            text-align: center;
        }
        .kpi-label { font-size: 11px; color: var(--text-micro); margin-bottom: 4px; }
        .kpi-value { font-size: 18px; font-weight: bold; font-family: var(--font-mono); }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin: 15px 0 8px;
            padding-bottom: 5px;
            border-bottom: 1px dashed var(--border-thin);
        }
        .desc-text {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand-area"><div class="brand-title">AI STOCK</div></div>
            <div class="nav-item" onclick="location.href='index.html'"><i class="fas fa-terminal"></i><span>指挥部概览</span></div>
            <div class="nav-item" onclick="location.href='positions.html'"><i class="fas fa-search-dollar"></i><span>持仓管理</span></div>
            <div class="nav-item" onclick="location.href='suggestions.html'"><i class="fas fa-exchange-alt"></i><span>调仓建议</span></div>
            <div class="nav-item active" onclick="location.href='research.html'"><i class="fas fa-brain"></i><span>AI 投研</span></div>
            <div class="nav-item" onclick="location.href='history.html'"><i class="fas fa-history"></i><span>交易审计</span></div>
            <div class="nav-item" onclick="location.href='data.html'"><i class="fas fa-server"></i><span>数据中心</span></div>
            <div class="nav-item" onclick="location.href='import.html'"><i class="fas fa-file-import"></i><span>智能导入</span></div>
            <div style="margin-top: auto;"><div class="nav-item"><i class="fas fa-cog"></i><span>系统设置</span></div></div>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <div class="status-item">
                    <span class="status-label">报告日期:</span>
                    <input type="date" id="report-date" class="btn-action" style="padding: 2px 8px; height: 28px;" onchange="loadReport()">
                </div>
                <div class="status-item">
                    <span class="status-label">标的数量:</span>
                    <span class="status-value" id="item-count">0</span>
                </div>
                <div style="margin-left: auto; display: flex; gap: 10px;">
                    <button class="btn-action" onclick="loadReport()"><i class="fas fa-redo"></i> 刷新</button>
                    <button class="btn-action" onclick="generateReport()" id="btn-generate" style="border-color: var(--accent-blue); color: var(--accent-blue);">
                        <i class="fas fa-magic"></i> 生成投研报告
                    </button>
                </div>
            </div>

            <div class="workspace" style="grid-template-columns: 1fr;">
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">深度产业链定量投研 (AI Supply Chain Intelligence)</span>
                        <span id="report-status" style="font-size: 11px; color: var(--text-micro);"></span>
                    </div>
                    <div class="panel-body" id="report-container">
                        <div style="text-align: center; padding: 60px; color: var(--text-micro);">
                            <i class="fas fa-brain" style="font-size: 48px; margin-bottom: 15px; display: block; color: var(--border-thin);"></i>
                            点击右上方「生成投研报告」启动 AI 深度分析
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = '/api';

        function getScoreClass(score) {
            if (score >= 7) return 'score-high';
            if (score >= 4) return 'score-mid';
            return 'score-low';
        }

        async function loadReport() {
            const dateStr = document.getElementById('report-date').value;
            const url = dateStr
                ? `${API_BASE}/reports/supply-chain/${dateStr}`
                : `${API_BASE}/reports/supply-chain`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderReport(data);
            } catch (e) {
                console.error('加载报告失败:', e);
            }
        }

        function renderReport(data) {
            const container = document.getElementById('report-container');
            const items = data.items || [];
            document.getElementById('item-count').textContent = items.length;
            document.getElementById('report-status').textContent = data.report_date ? `报告日期: ${data.report_date}` : '';

            if (!items.length) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px; color: var(--text-micro);">
                        <i class="fas fa-inbox" style="font-size: 48px; margin-bottom: 15px; display: block; color: var(--border-thin);"></i>
                        ${data.report_date ? '该日期暂无报告数据' : '暂无报告，请点击「生成投研报告」'}
                    </div>`;
                return;
            }

            // 按行业分组
            const industries = {};
            items.forEach(item => {
                const ind = item.industry || '未分类';
                if (!industries[ind]) industries[ind] = { items: [], score: 0, market_size: '' };
                industries[ind].items.push(item);
                industries[ind].score = item.prosperity_score || 0;
                industries[ind].market_size = item.market_size || '0';
            });

            let html = '';
            for (const [industry, group] of Object.entries(industries)) {
                const scoreClass = getScoreClass(group.score);
                const firstItem = group.items[0];
                
                html += `
                <div class="industry-card">
                    <h3>
                        <i class="fas fa-chart-line"></i> ${industry}
                        <span class="score-badge ${scoreClass}" style="margin-left: 10px;">景气度 ${group.score}/10</span>
                    </h3>
                    
                    <div class="kpi-row">
                        <div class="kpi-box">
                            <div class="kpi-label">市场规模</div>
                            <div class="kpi-value" style="color: var(--accent-blue);">${group.market_size}B</div>
                            <div class="kpi-label">USD</div>
                        </div>
                        <div class="kpi-box">
                            <div class="kpi-label">涉及标的</div>
                            <div class="kpi-value" style="color: var(--accent-gold);">${group.items.length}</div>
                            <div class="kpi-label">A股公司</div>
                        </div>
                        <div class="kpi-box">
                            <div class="kpi-label">景气度</div>
                            <div class="kpi-value" style="color: var(--accent-green);">${group.score}/10</div>
                            <div class="kpi-label">评分</div>
                        </div>
                    </div>

                    <div class="section-title">景气度与技术路线分析</div>
                    <div class="desc-text">${firstItem.event || '暂无分析'}</div>

                    <div class="section-title">价值缺口与估值逻辑</div>
                    <div class="desc-text">${firstItem.impact || '暂无分析'}</div>

                    <div class="section-title">A 股标的定量对标</div>
                    <table>
                        <thead>
                            <tr>
                                <th>公司</th>
                                <th>代码</th>
                                <th style="text-align:right;">营收(亿)</th>
                                <th style="text-align:right;">市值(亿)</th>
                                <th style="text-align:right;">PE</th>
                                <th>对标龙头</th>
                                <th style="text-align:right;">对标市值(亿CNY)</th>
                                <th style="text-align:right;">估值潜力</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${group.items.map(item => `
                                <tr>
                                    <td class="ticker">${item.company_name}</td>
                                    <td style="font-family: var(--font-mono); color: var(--text-dim);">${item.stock_code || '-'}</td>
                                    <td style="text-align:right; font-family: var(--font-mono);">${item.revenue || '-'}</td>
                                    <td style="text-align:right; font-family: var(--font-mono);">${item.market_cap || '-'}</td>
                                    <td style="text-align:right; font-family: var(--font-mono);">${item.pe_ratio || '-'}</td>
                                    <td style="color: var(--text-dim);">${item.peer_company || '-'}</td>
                                    <td style="text-align:right; font-family: var(--font-mono);">${item.peer_market_cap || '-'}</td>
                                    <td style="text-align:right;">
                                        <span style="color: var(--accent-green); font-weight: bold; font-family: var(--font-mono);">
                                            ${item.valuation_multiple ? item.valuation_multiple + 'x' : '-'}
                                        </span>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <div class="section-title" style="margin-top: 25px;"><i class="fas fa-search-dollar" style="color: var(--accent-gold);"></i> Alpha-Tracker 深度审计 (Tech-Alpha Audit)</div>
                    <div style="display: flex; flex-direction: column; gap: 15px;">
                        ${group.items.map(item => `
                            <div style="background: rgba(0,0,0,0.2); border-left: 3px solid var(--accent-blue); padding: 15px; border-radius: 4px;">
                                <h4 style="color: var(--text-main); margin-bottom: 10px; font-size: 14px;">${item.company_name} <span style="font-family: var(--font-mono); color: var(--text-dim); font-size: 12px;">(${item.stock_code || 'N/A'})</span></h4>
                                
                                <div style="margin-bottom: 8px;">
                                    <strong style="color: var(--accent-gold); font-size: 12px;"><i class="fas fa-user-tie"></i> 宗师级背景审计:</strong>
                                    <div class="desc-text" style="margin-top: 4px; font-size: 12px;">${item.human_capital_desc || '暂无数据'}</div>
                                </div>
                                
                                <div style="margin-bottom: 8px;">
                                    <strong style="color: var(--accent-green); font-size: 12px;"><i class="fas fa-chart-pie"></i> 财务剪刀差穿透:</strong>
                                    <div class="desc-text" style="margin-top: 4px; font-size: 12px;">${item.scissor_gap_desc || '暂无数据'}</div>
                                </div>
                                
                                <div>
                                    <strong style="color: var(--accent-blue); font-size: 12px;"><i class="fas fa-project-diagram"></i> 核心部件递归溯源:</strong>
                                    <div class="desc-text" style="margin-top: 4px; font-size: 12px;">${item.recursive_path || '暂无数据'}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }

            container.innerHTML = html;
        }

        async function generateReport() {
            const btn = document.getElementById('btn-generate');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AI 分析中...';
            document.getElementById('report-status').textContent = '正在调用 AI 引擎，请稍候（约30-60秒）...';

            try {
                const res = await fetch(`${API_BASE}/reports/supply-chain/generate`, { method: 'POST' });
                const data = await res.json();
                document.getElementById('report-status').textContent = data.message || '生成完成';
                loadReport();
            } catch (e) {
                document.getElementById('report-status').textContent = '生成失败，请检查后台日志';
            }
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-magic"></i> 生成投研报告';
        }

        window.onload = () => {
            document.getElementById('report-date').value = new Date().toISOString().split('T')[0];
            loadReport();
        };
    </script>
</body>
</html>
