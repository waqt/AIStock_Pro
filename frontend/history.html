<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIStock | 任务执行历史</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-page-id="history">
    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="top-bar"></div>

            <div class="workspace" style="grid-template-columns: 1fr;">
                <div class="panel">
                    <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
                        <span class="panel-title">任务执行历史 (Execution History)</span>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <select id="filter-code" style="background: var(--bg-deep); border: 1px solid var(--border-color); color: var(--text-normal); padding: 4px 8px; border-radius: 4px; font-size: 12px;">
                                <option value="">全部任务类型</option>
                            </select>
                            <button class="btn-action" onclick="refreshHistory()" style="font-size: 11px;">
                                <i class="fas fa-sync"></i> 刷新
                            </button>
                            <button class="btn-action" onclick="clearOldHistory()" style="font-size: 11px; color: var(--accent-red);">
                                <i class="fas fa-trash"></i> 清理 7 天前
                            </button>
                        </div>
                    </div>
                    <div class="panel-body" style="padding: 0;">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 180px;">启动时间</th>
                                    <th>任务名称</th>
                                    <th style="width: 80px;">状态</th>
                                    <th style="text-align: right; width: 60px;">进度</th>
                                    <th style="width: 90px;">耗时</th>
                                    <th>执行摘要</th>
                                    <th style="text-align: center; width: 60px;">操作</th>
                                </tr>
                            </thead>
                            <tbody id="history-list">
                                <tr><td colspan="7" style="text-align: center; color: var(--text-micro); padding: 40px;">加载中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="panel-footer" style="display: flex; justify-content: center; gap: 8px; padding: 10px; border-top: 1px solid var(--border-thin);" id="pagination">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/framework/api.js"></script>
    <script src="js/framework/modal.js"></script>
    <script src="js/framework/task_monitor.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/common.js"></script>
    <script>
        let currentPage = 1;
        const PAGE_SIZE = 20;
        let currentFilter = '';

        // ── 加载任务定义列表用于筛选下拉 ──
        async function loadFilterOptions() {
            try {
                const res = await fetch(`${API_BASE}/system/tasks/definitions`);
                const defs = await res.json();
                const select = document.getElementById('filter-code');
                defs.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.code;
                    opt.textContent = `${d.name} (${d.code})`;
                    select.appendChild(opt);
                });
                select.addEventListener('change', () => {
                    currentFilter = select.value;
                    currentPage = 1;
                    refreshHistory();
                });
            } catch (e) {
                console.error('加载任务定义失败:', e);
            }
        }

        // ── 刷新执行历史 ──
        async function refreshHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-micro); padding: 40px;">加载中...</td></tr>';

            try {
                let url = `${API_BASE}/system/tasks/executions/history?page=${currentPage}&limit=${PAGE_SIZE}`;
                if (currentFilter) url += `&task_code=${encodeURIComponent(currentFilter)}`;

                const res = await fetch(url);
                const tasks = await res.json();

                if (!tasks.length) {
                    list.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-micro); padding: 40px;">暂无执行记录</td></tr>';
                    document.getElementById('pagination').innerHTML = '';
                    return;
                }

                list.innerHTML = tasks.map(t => {
                    const statusColor = {
                        'SUCCESS': 'var(--accent-green)',
                        'FAILED': 'var(--accent-red)',
                        'CANCELLED': 'var(--accent-orange)',
                        'STOPPING': 'var(--accent-orange)'
                    }[t.status] || 'var(--text-dim)';

                    const statusText = {
                        'SUCCESS': '成功',
                        'FAILED': '失败',
                        'CANCELLED': '已取消',
                        'STOPPING': '终止中'
                    }[t.status] || t.status;

                    let duration = '—';
                    if (t.start_time && t.end_time) {
                        const ms = new Date(t.end_time) - new Date(t.start_time);
                        if (ms < 1000) duration = `${ms}ms`;
                        else if (ms < 60000) duration = `${(ms/1000).toFixed(1)}s`;
                        else duration = `${Math.floor(ms/60000)}m ${Math.floor((ms%60000)/1000)}s`;
                    }

                    const startTime = t.start_time ? new Date(t.start_time).toLocaleString('zh-CN') : '—';

                    return `
                        <tr>
                            <td style="font-size: 11px; color: var(--text-micro);">${startTime}</td>
                            <td>
                                <span style="font-weight: 600;">${t.task_code}</span>
                            </td>
                            <td>
                                <span style="color: ${statusColor}; font-weight: bold; font-size: 11px;">${statusText}</span>
                            </td>
                            <td style="text-align: right; font-family: var(--font-mono);">
                                <div style="height: 3px; background: var(--border-color); border-radius: 2px; margin-top: 4px;">
                                    <div style="width: ${t.progress || 0}%; height: 100%; background: ${statusColor}; border-radius: 2px;"></div>
                                </div>
                                <span style="font-size: 10px; color: var(--text-micro);">${t.progress || 0}%</span>
                            </td>
                            <td style="font-family: var(--font-mono); font-size: 11px; color: var(--text-dim);">${duration}</td>
                            <td style="font-size: 11px; color: var(--text-dim); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${t.result_msg || '—'}</td>
                            <td style="text-align: center;">
                                <button class="btn-action" style="padding: 2px 8px; font-size: 10px;" onclick="viewDetail('${t.id}')" title="查看详情">
                                    <i class="fas fa-search"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');

                // 分页
                const hasMore = tasks.length === PAGE_SIZE;
                document.getElementById('pagination').innerHTML = `
                    <button class="btn-action" ${currentPage <= 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})" style="font-size: 11px;">
                        <i class="fas fa-chevron-left"></i> 上一页
                    </button>
                    <span style="color: var(--text-dim); font-size: 11px; line-height: 28px;">第 ${currentPage} 页</span>
                    <button class="btn-action" ${!hasMore ? 'disabled' : ''} onclick="goPage(${currentPage + 1})" style="font-size: 11px;">
                        下一页 <i class="fas fa-chevron-right"></i>
                    </button>
                `;
            } catch (e) {
                list.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--accent-red); padding: 40px;">加载失败: ${e.message}</td></tr>`;
            }
        }

        function goPage(page) {
            currentPage = page;
            refreshHistory();
        }

        // ── 详情弹窗 ──
        async function viewDetail(execId) {
            try {
                const res = await fetch(`${API_BASE}/system/tasks/executions/history?page=1&limit=100`);
                const tasks = await res.json();
                const t = tasks.find(x => x.id === execId);
                if (!t) { Modal.alert('提示', '未找到该记录'); return; }

                const startTime = t.start_time ? new Date(t.start_time).toLocaleString('zh-CN') : '—';
                const endTime = t.end_time ? new Date(t.end_time).toLocaleString('zh-CN') : '—';
                let duration = '—';
                if (t.start_time && t.end_time) {
                    const ms = new Date(t.end_time) - new Date(t.start_time);
                    duration = ms < 1000 ? `${ms}ms` : ms < 60000 ? `${(ms/1000).toFixed(1)}s` : `${Math.floor(ms/60000)}m ${Math.floor((ms%60000)/1000)}s`;
                }

                Modal.alert(`任务执行详情`,
                    `任务代码: ${t.task_code}\n` +
                    `执行 ID: ${t.id}\n` +
                    `状态: ${t.status}  进度: ${t.progress || 0}%\n` +
                    `启动: ${startTime}\n` +
                    `结束: ${endTime}  耗时: ${duration}\n` +
                    `━━━━━━━━━━━━━━━━\n` +
                    `${t.result_msg || '—'}`
                );
            } catch (e) {
                Modal.alert('加载失败', e.message);
            }
        }

        // ── 清理功能 ──
        async function clearOldHistory() {
            const choice = await Modal.confirm('清理历史记录',
                '请选择清理方式：\n\n' +
                '点击"确认" = 清理 7 天前的记录\n' +
                '点击"取消" = 手动输入');
            let days = 7;
            if (!choice) {
                // 用户选了取消，提供更多选项
                const mode = await Modal.confirm('清理选项', '点击"确认"=清理全部\n点击"取消"=取消操作');
                if (mode) {
                    const ok = await Modal.danger('危险操作', '确认删除全部历史记录？此操作不可撤销！');
                    if (!ok) return;
                    days = -1; // 全部
                } else return;
            }

            try {
                const url = days === -1
                    ? `${API_BASE}/system/tasks/history?all=true`
                    : `${API_BASE}/system/tasks/history?days_ago=${days}`;
                const res = await fetch(url, { method: 'DELETE' });
                const data = await res.json();
                Modal.alert('清理完成', `已清理 ${data.deleted || 0} 条记录`);
                currentPage = 1;
                refreshHistory();
            } catch (e) {
                Modal.alert('清理失败', e.message);
            }
        }

        window.onload = () => {
            loadFilterOptions();
            refreshHistory();
        };
    </script>
</body>
</html>
