<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AIStock | 定量估值</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        .workspace { display: flex; gap: 14px; padding: 14px; height: calc(100vh - 110px); }
        .left-panel { width: 340px; min-width: 320px; display: flex; flex-direction: column; gap: 8px; }
        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
        .tab-btn { padding: 8px 16px; background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 13px; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab-btn:hover { color: #fff; }
        .tab-btn.active { color: #fff; border-bottom-color: var(--accent-blue); }
        .v-method-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; overflow-y: auto; flex: 1; padding: 0 2px; }
        .v-method-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 4px; padding: 8px; cursor: pointer; transition: all 0.15s; }
        .v-method-card:hover { border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.04); }
        .v-method-card .cat { font-size: 9px; color: var(--text-micro); text-transform: uppercase; }
        .v-method-card .name { font-size: 11px; color: #ddd; font-weight: 600; margin: 2px 0; }
        .v-method-card .desc { font-size: 9px; color: var(--text-dim); line-height: 1.4; }
        .v-metric-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; }
        .v-metric-card .label { font-size: 10px; color: var(--text-micro); }
        .v-metric-card .value { font-size: 20px; font-weight: 700; font-family: var(--font-mono); margin: 4px 0; }
        .v-metric-card .sub { font-size: 10px; color: var(--text-dim); }
        .status-under { color: var(--accent-green); }
        .status-over { color: var(--accent-red); }
        .status-fair { color: var(--accent-gold); }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .cat-group { margin-bottom: 6px; }
        .cat-group-title { font-size: 10px; color: var(--text-micro); padding: 2px 4px; background: rgba(255,255,255,0.03); border-radius: 3px; margin-bottom: 4px; }
        .chart-container { flex: 1; min-height: 280px; }
        .badge { display: inline-block; padding: 1px 6px; border-radius: 2px; font-size: 9px; }
        .badge-relative { background: rgba(112,161,255,0.15); color: var(--accent-blue); }
        .badge-absolute { background: rgba(46,213,115,0.15); color: var(--accent-green); }
        .badge-advanced { background: rgba(255,165,2,0.15); color: var(--accent-gold); }
        .badge-composite { background: rgba(162,155,254,0.15); color: #a29bfe; }
        .badge-dynamic { background: rgba(0,206,209,0.15); color: #00ced1; }
        .v-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .v-table th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border-color); color: var(--text-micro); font-weight: 500; background: #0a0a0a; }
        .v-table td { padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .v-table tr:hover td { background: rgba(255,255,255,0.03); }
        .detail-section { font-size: 11px; color: var(--text-dim); line-height: 1.6; }
    </style>
</head>
<body data-page-id="valuation">
<div class="app-container">
<aside class="sidebar"></aside>
<main class="main-content">
<div class="top-bar"></div>
<div class="workspace">

    <!-- ═══ Left Panel: Stock Input + Method List ═══ -->
    <div class="left-panel">
        <div class="panel">
            <div class="panel-body" style="display:flex;flex-direction:column;gap:8px;">
                <div style="display:flex;gap:6px;">
                    <input type="text" id="val-code" placeholder="股票代码 (如 688012)"
                        style="flex:1;background:#000;border:1px solid var(--border-color);color:#fff;padding:8px 10px;border-radius:4px;font-size:13px;">
                    <button class="btn-action btn-primary" onclick="Valuation.run()" id="btn-val" style="white-space:nowrap;">
                        <i class="fas fa-calculator"></i> 计算
                    </button>
                </div>
                <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
                    <select id="val-mode" style="background:#000;border:1px solid var(--border-color);color:#fff;padding:4px 8px;border-radius:4px;font-size:10px;">
                        <option value="snapshot">快照</option>
                        <option value="historical">全量</option>
                        <option value="incremental">增量</option>
                    </select>
                    <span id="val-status" style="font-size:10px;color:var(--text-micro);">输入代码后计算</span>
                </div>
            </div>
        </div>

        <div class="panel" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
            <div class="panel-header"><span class="panel-title">估值方法</span></div>
            <div id="val-method-list" class="v-method-grid" style="padding:6px;">
                <div style="color:var(--text-micro);font-size:11px;grid-column:1/-1;text-align:center;">加载中...</div>
            </div>
        </div>
    </div>

    <!-- ═══ Right Panel: 4 Tabs ═══ -->
    <div class="right-panel">
        <div style="display:flex;gap:0;border-bottom:1px solid var(--border-color);">
            <button class="tab-btn active" onclick="Valuation.switchTab('dashboard')" id="vt-dashboard">估值仪表盘</button>
            <button class="tab-btn" onclick="Valuation.switchTab('peband')" id="vt-peband">PE Band</button>
            <button class="tab-btn" onclick="Valuation.switchTab('details')" id="vt-details">方法详情</button>
            <button class="tab-btn" onclick="Valuation.switchTab('compare')" id="vt-compare">对比分析</button>
            <button class="tab-btn" onclick="Valuation.switchTab('sim')" id="vt-sim">仿真分析</button>
        </div>

        <!-- Tab 1: Dashboard -->
        <div class="tab-panel active" id="vtab-dashboard" style="flex:1;display:flex;flex-direction:column;gap:8px;overflow-y:auto;">
            <div id="val-result" style="display:none;flex-direction:column;gap:10px;"></div>
            <div id="val-empty" style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:12px;">
                输入股票代码后点击「计算」查看估值仪表盘
            </div>
        </div>

        <!-- Tab 2: PE Band Chart -->
        <div class="tab-panel" id="vtab-peband" style="flex:1;display:none;flex-direction:column;gap:8px;">
            <div id="peband-chart" class="chart-container"></div>
            <div id="peband-info" style="font-size:10px;color:var(--text-micro);text-align:center;"></div>
        </div>

        <!-- Tab 3: Method Details -->
        <div class="tab-panel" id="vtab-details" style="flex:1;display:none;flex-direction:column;gap:8px;overflow-y:auto;">
            <div id="val-details-content" style="font-size:11px;color:var(--text-dim);padding:10px;">
                计算后查看各方法详细输出
            </div>
        </div>

        <!-- Tab 4: Compare -->
        <div class="tab-panel" id="vtab-compare" style="flex:1;display:none;flex-direction:column;gap:8px;">
            <div style="display:flex;gap:6px;padding:4px 0;">
                <input type="text" id="cmp-codes" placeholder="多个代码用逗号分隔 (如 688012,002371,600703)"
                    style="flex:1;background:#000;border:1px solid var(--border-color);color:#fff;padding:6px 8px;border-radius:4px;font-size:11px;">
                <button class="btn-action" onclick="Valuation.runCompare()" style="font-size:11px;"><i class="fas fa-chart-bar"></i> 对比</button>
            </div>
            <div id="cmp-result" style="font-size:11px;color:var(--text-dim);overflow-y:auto;flex:1;"></div>
        </div>

        <!-- Tab 5: Simulation -->
        <div class="tab-panel" id="vtab-sim" style="flex:1;display:none;flex-direction:column;gap:8px;overflow-y:auto;">
            <div style="display:flex;gap:10px;flex:1;">
                <!-- Left: Controls -->
                <div style="width:340px;min-width:300px;display:flex;flex-direction:column;gap:6px;">
                    <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;">
                        <select id="sim-method" style="flex:1;background:#000;border:1px solid var(--border-color);color:#fff;padding:5px 8px;border-radius:4px;font-size:11px;"></select>
                        <span style="font-size:9px;color:var(--text-micro);">→</span>
                        <select id="sim-target" style="flex:1;background:#000;border:1px solid var(--border-color);color:#fff;padding:5px 8px;border-radius:4px;font-size:10px;"></select>
                    </div>
                    <div style="font-size:9px;color:var(--text-micro);line-height:1.4;padding:4px 6px;background:rgba(255,255,255,0.02);border-radius:3px;" id="sim-method-desc"></div>
                    <div style="display:flex;align-items:center;gap:6px;">
                        <span style="font-size:10px;color:var(--text-dim);">迭代:</span>
                        <input type="number" id="sim-iterations" value="5000" min="100" max="50000" style="width:80px;background:#000;border:1px solid var(--border-color);color:#fff;padding:3px 6px;border-radius:3px;font-size:10px;">
                        <button class="btn-action btn-primary" onclick="ValuationSim.run()" id="btn-sim-run" style="font-size:10px;padding:4px 10px;">
                            <i class="fas fa-rocket"></i> 运行仿真
                        </button>
                    </div>
                    <div style="font-size:10px;color:var(--text-dim);font-weight:500;padding:4px 0;">参数分布配置</div>
                    <div id="sim-params" style="flex:1;overflow-y:auto;"></div>
                    <div id="sim-status" style="font-size:9px;color:var(--text-micro);text-align:center;"></div>
                </div>
                <!-- Right: Results -->
                <div id="sim-result" style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;">
                    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-size:11px;">
                        <div style="text-align:center;">
                            <div style="font-size:40px;opacity:0.2;margin-bottom:8px;">&#9881;</div>
                            <div>配置参数后点击「运行仿真」</div>
                            <div style="font-size:9px;color:var(--text-micro);margin-top:4px;">对关键参数设定概率分布, 观察估值结果的分布形态</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
</main>
</div>

<script src="js/framework/api.js"></script>
<script src="js/framework/modal.js"></script>
<script src="js/framework/task_monitor.js"></script>
<script src="js/framework/markdown.js"></script>
<script src="js/ui.js"></script>
<script src="js/common.js"></script>
<script src="js/valuation.js"></script>
<script src="js/simulation.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    Valuation.init();
    if (window.ValuationSim) ValuationSim.init();
});
window.refreshPageData = function() {};
</script>
</body>
</html>
